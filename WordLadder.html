<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" sizes="64x64" href="./assets/edurena_logo_64.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Word Ladder — Edurena</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#050810;--panel:#0d1117;--bdr:#1a2035;--txt:#e8edf5;--muted:#5a6a8a;--acc:#00d4ff;--grn:#00ff88;--red:#ff3355;--yel:#ffcc00;--pur:#bf5fff;--f:'Plus Jakarta Sans',system-ui,sans-serif;--display:'Orbitron',monospace}
*{margin:0;padding:0;box-sizing:border-box}
html,body{position:fixed;inset:0;width:100%;height:100vh;height:100dvh;background:var(--bg);color:var(--txt);font-family:var(--f);overflow:hidden;overscroll-behavior:none}

.screen{display:none;position:fixed;inset:0;z-index:100}
.screen.on{display:flex;flex-direction:column;align-items:center;justify-content:center}
#s-fatal{background:var(--bg);z-index:9999}
#s-fatal h2{color:var(--muted);font-family:var(--display);font-size:22px;margin-bottom:12px}
#s-fatal.err h2{color:var(--red)}
#s-fatal p{color:var(--muted);font-size:14px;line-height:1.8;max-width:420px;text-align:center}
#s-join,#s-lobby{background:var(--bg)}
.brand-title{font-family:var(--display);font-size:clamp(18px,5vw,30px);font-weight:900;letter-spacing:3px;background:linear-gradient(135deg,var(--acc),var(--pur));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:4px}
.brand-sub{color:var(--muted);font-size:11px;letter-spacing:2px;text-transform:uppercase;margin-bottom:28px;text-align:center}
.join-card{max-width:340px;width:calc(100% - 32px);background:rgba(13,17,23,.95);border:1px solid var(--bdr);border-radius:16px;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.field-lbl{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
.inp{display:block;width:100%;padding:12px 14px;min-height:48px;background:#0a0e1a;border:1.5px solid var(--bdr);border-radius:10px;color:var(--txt);font-size:16px;font-family:var(--f);outline:none;margin-bottom:14px;-webkit-appearance:none;touch-action:manipulation}
.inp:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(0,212,255,.1)}
.inp-code{text-transform:uppercase;letter-spacing:4px;font-family:var(--display);font-size:16px;text-align:center}
.join-btn{width:100%;padding:14px;min-height:52px;background:linear-gradient(135deg,#0055aa,#5500cc);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:700;font-family:var(--display);letter-spacing:1px;cursor:pointer;touch-action:manipulation;box-shadow:0 4px 24px rgba(0,100,220,.35)}
.join-btn:disabled{opacity:.5;cursor:not-allowed}
.join-err{color:var(--red);font-size:13px;margin-top:10px;text-align:center;min-height:18px}
.lobby-code{font-family:var(--display);font-size:clamp(32px,8vw,52px);font-weight:900;letter-spacing:8px;color:var(--acc);margin:8px 0;text-shadow:0 0 30px rgba(0,212,255,.5)}
.lobby-count{font-family:var(--display);font-size:40px;font-weight:900;color:var(--grn);margin-top:14px;text-shadow:0 0 20px rgba(0,255,136,.4)}
.lobby-lbl{font-size:11px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin:4px 0 16px}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:520px;margin:0 auto 16px;min-height:32px;padding:0 12px}
.chip{padding:4px 12px;background:#0d1525;border:1px solid #1e2d4a;border-radius:20px;font-size:12px;font-weight:600;color:var(--acc)}
.pulse-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--acc);margin-right:7px;animation:pulseDot 1.4s ease-in-out infinite;vertical-align:middle}
@keyframes pulseDot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(.6)}}
.lobby-wait{font-size:13px;color:var(--muted);letter-spacing:1px}

#s-game{background:var(--bg);align-items:stretch;justify-content:flex-start;overflow-y:auto;padding:16px 16px 40px}
.wl-wrap{max-width:560px;margin:0 auto;width:100%}
.wl-brand{font-family:var(--display);font-size:12px;letter-spacing:2px;color:var(--muted);text-align:center;margin-bottom:10px}
.wl-turn-banner{text-align:center;padding:10px;border-radius:10px;margin-bottom:14px;font-family:var(--display);font-weight:700;letter-spacing:1px;font-size:13px}
.wl-turn-banner.mine{background:rgba(0,255,136,.12);border:1px solid rgba(0,255,136,.4);color:var(--grn)}
.wl-turn-banner.theirs{background:rgba(90,106,138,.1);border:1px solid var(--bdr);color:var(--muted)}
.wl-tiles{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:16px}
.wl-tile{width:42px;height:50px;display:flex;align-items:center;justify-content:center;background:var(--panel);border:1.5px solid var(--bdr);border-radius:8px;font-family:var(--display);font-size:20px;font-weight:900;color:var(--acc)}
.wl-input-row{display:flex;gap:8px;margin-bottom:6px}
.wl-input{flex:1;padding:12px 14px;min-height:48px;background:#0a0e1a;border:1.5px solid var(--bdr);border-radius:10px;color:var(--txt);font-size:18px;font-family:var(--display);letter-spacing:3px;text-transform:uppercase;outline:none;text-align:center;-webkit-appearance:none}
.wl-input:focus{border-color:var(--acc)}
.wl-input:disabled{opacity:.5}
.wl-submit{padding:12px 18px;min-height:48px;background:linear-gradient(135deg,var(--acc),#0088ff);color:#000;border:none;border-radius:10px;font-weight:700;font-family:var(--display);cursor:pointer;touch-action:manipulation}
.wl-submit:disabled{opacity:.4;cursor:not-allowed}
.wl-err{color:var(--red);font-size:13px;text-align:center;min-height:18px;margin-bottom:6px}
.wl-def-pop{background:rgba(0,255,136,.08);border:1px solid rgba(0,255,136,.3);border-radius:10px;padding:12px 14px;margin-bottom:16px;display:none}
.wl-def-pop.show{display:block}
.wl-def-word{font-family:var(--display);font-weight:900;color:var(--grn);font-size:16px;letter-spacing:1px}
.wl-def-text{font-size:14px;line-height:1.5;color:var(--txt);margin-top:4px}
.wl-section-h{font-size:11px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin:16px 0 8px}
.wl-score-row{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:var(--panel);border:1px solid var(--bdr);border-radius:8px;margin-bottom:6px;font-size:13px}
.wl-score-row.me{border-color:rgba(0,212,255,.4)}
.wl-score-row .nm{font-weight:600}
.wl-score-row .sc{font-family:var(--display);color:var(--yel);font-weight:700}
.wl-chain-item{padding:8px 0 8px 12px;border-left:2px solid var(--bdr);margin-bottom:8px;font-size:13px}
.wl-chain-word{font-family:var(--display);font-weight:700;color:var(--acc)}
.wl-chain-by{color:var(--muted);font-size:11px;margin-left:6px}
.wl-chain-def{color:var(--muted);font-size:12px;margin-top:2px;line-height:1.4}

#s-ended{background:var(--bg)}
.wl-end-title{font-family:var(--display);font-size:clamp(24px,6vw,40px);font-weight:900;color:var(--yel);letter-spacing:4px;margin-bottom:20px;text-shadow:0 0 30px rgba(255,204,0,.4)}
.wl-final-wrap{max-width:360px;width:calc(100% - 32px)}
</style>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
</head>
<body>

<div class="screen on" id="s-fatal"><h2 id="fatal-title">LOADING&hellip;</h2><p id="fatal-msg">Please wait a moment.</p></div>

<div class="screen" id="s-join">
  <div class="brand-title">WORD LADDER</div>
  <div class="brand-sub">Change one letter &middot; make a new word &middot; learn its meaning</div>
  <div class="join-card">
    <div class="field-lbl">Game Code</div>
    <input class="inp inp-code" id="inp-code" type="text" placeholder="ABCDEF" maxlength="10" autocomplete="off" spellcheck="false">
    <div class="field-lbl">Your Name</div>
    <input class="inp" id="inp-name" type="text" placeholder="Your name" maxlength="20" autocomplete="given-name">
    <button class="join-btn" id="joinBtn">&#x25B6;&nbsp; JOIN GAME</button>
    <div class="join-err" id="joinErr"></div>
  </div>
</div>

<div class="screen" id="s-lobby">
  <div class="brand-title" style="font-size:clamp(14px,4vw,18px)">WORD LADDER</div>
  <div style="font-size:11px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-top:6px">GAME CODE</div>
  <div class="lobby-code" id="lby-code">------</div>
  <div class="lobby-count" id="lby-count">0</div>
  <div class="lobby-lbl">players joined</div>
  <div class="chips" id="lby-chips"></div>
  <div class="lobby-wait"><span class="pulse-dot"></span>Waiting for the host to start&hellip;</div>
</div>

<div class="screen" id="s-game">
  <div class="wl-wrap">
    <div class="wl-brand">WORD LADDER</div>
    <div class="wl-turn-banner" id="wl-turn-banner">&hellip;</div>
    <div class="wl-tiles" id="wl-tiles"></div>
    <div class="wl-input-row">
      <input class="wl-input" id="wlInput" type="text" maxlength="12" autocomplete="off" spellcheck="false">
      <button class="wl-submit" id="wlSubmit">SUBMIT</button>
    </div>
    <div class="wl-err" id="wl-err"></div>
    <div class="wl-def-pop" id="wl-def-pop">
      <div class="wl-def-word" id="wl-def-word">&mdash;</div>
      <div class="wl-def-text" id="wl-def-text"></div>
    </div>
    <div class="wl-section-h">Scoreboard</div>
    <div id="wl-scores"></div>
    <div class="wl-section-h">Word Chain</div>
    <div id="wl-chain"></div>
  </div>
</div>

<div class="screen" id="s-ended">
  <div class="wl-end-title">GAME OVER</div>
  <div class="wl-final-wrap" id="wl-final-scores"></div>
</div>

<script>
(function () {
'use strict';
var P = new URLSearchParams(location.search);
var GAS_URL = (P.get('script') || '').trim();
var preCode = (P.get('room') || '').trim().toUpperCase();
var preName = (P.get('name') || '').trim();
function el(id) { return document.getElementById(id); }
function esc(s) { return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function showScreen(id) { document.querySelectorAll('.screen').forEach(function (s) { s.classList.remove('on'); }); var t = el(id); if (t) t.classList.add('on'); }
function fatal(msg) { showScreen('s-fatal'); el('s-fatal').classList.add('err'); el('fatal-title').textContent = 'CANNOT LOAD'; el('fatal-msg').textContent = msg; }
if (!GAS_URL) { fatal('Missing backend URL.'); return; }
showScreen('s-join');

var db;
try {
  var cfgFb = { apiKey: 'AIzaSyCLfySFzCpbz3CBX1bjha5KxvA0MrJExIc', authDomain: 'kahoot-24063.firebaseapp.com', databaseURL: 'https://kahoot-24063-default-rtdb.firebaseio.com', projectId: 'kahoot-24063', storageBucket: 'kahoot-24063.firebasestorage.app', messagingSenderId: '962917873467', appId: '1:962917873467:web:a6b526aee30cd15c92291e' };
  var existing = null; if (firebase.apps) firebase.apps.forEach(function (a) { if (a.name === 'wl') existing = a; });
  db = firebase.database(existing || firebase.initializeApp(cfgFb, 'wl'));
} catch (e) { fatal('Firebase error: ' + e.message); return; }

function gasPost(body, cb) {
  fetch(GAS_URL, { method: 'POST', body: JSON.stringify(body) }).then(function (r) { return r.json(); }).then(function (d) { cb(null, d); }).catch(function (e) { cb(e, null); });
}

var sessionId = '', playerId = '', playerName = '', state = null, lastChainLen = 0;

document.addEventListener('DOMContentLoaded', function () {
  if (preCode) el('inp-code').value = preCode;
  if (preName) el('inp-name').value = preName;
  el('inp-code').addEventListener('keydown', function (e) { if (e.key === 'Enter') el('inp-name').focus(); });
  el('inp-name').addEventListener('keydown', function (e) { if (e.key === 'Enter') doJoin(); });
  el('joinBtn').addEventListener('click', doJoin);
  el('wlSubmit').addEventListener('click', doSubmitMove);
  el('wlInput').addEventListener('keydown', function (e) { if (e.key === 'Enter') doSubmitMove(); });
});

function doJoin() {
  var btn = el('joinBtn'), errE = el('joinErr');
  sessionId = (el('inp-code').value || '').trim().toUpperCase();
  playerName = (el('inp-name').value || '').trim();
  errE.textContent = '';
  if (sessionId.length < 4) { errE.textContent = 'Enter a valid game code'; return; }
  if (playerName.length < 2) { errE.textContent = 'Enter your name (min 2 chars)'; return; }
  btn.disabled = true; btn.textContent = 'JOINING…';
  gasPost({ action: 'joinWordLadder', sessionId: sessionId, playerName: playerName }, function (gErr, res) {
    btn.disabled = false; btn.textContent = '▶ JOIN GAME';
    if (gErr || !res || res.status !== 'success') { errE.textContent = (res && res.message) || 'Could not join. Check your code.'; return; }
    playerId = res.data.playerId;
    listenFirebase();
    applyState(res.data.state);
  });
}

function listenFirebase() {
  db.ref('wordladder/' + sessionId).on('value', function (s) {
    var v = s.val(); if (!v) return;
    applyState(v);
  });
}

function applyState(v) {
  state = v;
  if (!state) return;
  if (state.status === 'ended') { renderEnded(); showScreen('s-ended'); return; }
  // No separate host "start" step — play begins as soon as a 2nd player joins.
  if ((state.players || []).length >= 2) { showScreen('s-game'); render(); return; }
  showScreen('s-lobby'); renderLobby();
}

function renderLobby() {
  el('lby-code').textContent = sessionId;
  var names = (state.players || []).map(function (p) { return p.name; });
  el('lby-count').textContent = names.length;
  el('lby-chips').innerHTML = names.map(function (n) { return '<div class="chip">' + esc(n) + '</div>'; }).join('');
}

function myTurn() {
  if (!state || !state.players || !state.players.length) return false;
  var tp = state.players[state.turnIndex];
  return tp && tp.playerId === playerId;
}

function render() {
  var chain = state.chain || [];
  var current = chain[chain.length - 1];
  el('wl-tiles').innerHTML = current.word.split('').map(function (ch) { return '<div class="wl-tile">' + esc(ch) + '</div>'; }).join('');

  var turnPlayer = state.players[state.turnIndex];
  var mine = myTurn();
  var banner = el('wl-turn-banner');
  banner.className = 'wl-turn-banner ' + (mine ? 'mine' : 'theirs');
  banner.textContent = mine ? 'YOUR TURN — change one letter' : ((turnPlayer ? turnPlayer.name : '…') + '’s turn');
  el('wlInput').disabled = !mine;
  el('wlSubmit').disabled = !mine;
  if (mine && document.activeElement !== el('wlInput')) el('wlInput').value = current.word;

  el('wl-scores').innerHTML = (state.players || []).slice().sort(function (a, b) { return (b.score || 0) - (a.score || 0); }).map(function (p) {
    return '<div class="wl-score-row' + (p.playerId === playerId ? ' me' : '') + '"><span class="nm">' + esc(p.name) + '</span><span class="sc">' + (p.score || 0) + '</span></div>';
  }).join('');

  var hist = chain.slice(1).slice().reverse();
  el('wl-chain').innerHTML = hist.map(function (c) {
    return '<div class="wl-chain-item"><span class="wl-chain-word">' + esc(c.word) + '</span><span class="wl-chain-by">by ' + esc(c.playerName || '?') + '</span><div class="wl-chain-def">' + esc(c.definition || '') + '</div></div>';
  }).join('') || ('<div style="color:var(--muted);font-size:12px">Starting word <b>' + esc(chain[0].word) + '</b>: ' + esc(chain[0].definition || '') + '</div>');

  if (chain.length > lastChainLen && lastChainLen > 0) {
    var latest = chain[chain.length - 1];
    el('wl-def-word').textContent = latest.word;
    el('wl-def-text').textContent = latest.definition || '';
    el('wl-def-pop').classList.add('show');
    setTimeout(function () { el('wl-def-pop').classList.remove('show'); }, 4000);
  }
  lastChainLen = chain.length;
}

function doSubmitMove() {
  if (!myTurn()) return;
  var errE = el('wl-err'); errE.textContent = '';
  var candidate = (el('wlInput').value || '').trim().toUpperCase();
  var current = state.chain[state.chain.length - 1].word;
  if (candidate.length !== current.length) { errE.textContent = 'Must be ' + current.length + ' letters'; return; }
  var diff = 0; for (var i = 0; i < candidate.length; i++) if (candidate[i] !== current[i]) diff++;
  if (diff !== 1) { errE.textContent = 'Change exactly one letter'; return; }
  el('wlSubmit').disabled = true;
  gasPost({ action: 'submitWordLadderMove', sessionId: sessionId, playerId: playerId, word: candidate }, function (gErr, res) {
    el('wlSubmit').disabled = !myTurn();
    if (gErr || !res || res.status !== 'success') { errE.textContent = (res && res.message) || 'Could not submit — try again.'; return; }
  });
}

function renderEnded() {
  el('wl-final-scores').innerHTML = (state.players || []).slice().sort(function (a, b) { return (b.score || 0) - (a.score || 0); }).map(function (p, i) {
    return '<div class="wl-score-row' + (p.playerId === playerId ? ' me' : '') + '"><span class="nm">' + (i + 1) + '. ' + esc(p.name) + '</span><span class="sc">' + (p.score || 0) + '</span></div>';
  }).join('');
}

window.addEventListener('beforeunload', function () { try { db.ref('wordladder/' + sessionId).off('value'); } catch (e) {} });
})();
</script>
</body>
</html>
