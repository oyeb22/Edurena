<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" sizes="64x64" href="./assets/edurena_logo_64.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Edurena — Simulation Lab</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eef5ff; --panel:#ffffff; --ink:#233047; --muted:#6b7896; --border:#dde6f5;
    --f:'Plus Jakarta Sans',system-ui,sans-serif; --fd:'Baloo 2',var(--f);
    --good:#22b573; --bad:#e5484d; --warn:#f5a623;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{font-family:var(--f);background:var(--bg);color:var(--ink);min-height:100dvh}
  .topbar{display:flex;align-items:center;gap:10px;padding:14px 16px;background:var(--panel);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20}
  .back-btn{display:none;background:#f1f5fc;border:1px solid var(--border);border-radius:10px;padding:9px 14px;font-family:var(--f);font-weight:700;font-size:14px;color:var(--ink);cursor:pointer;min-height:40px}
  .back-btn.show{display:inline-flex;align-items:center;gap:6px}
  .lab-title{font-family:var(--fd);font-weight:800;font-size:20px;color:#3355dd}
  .sim-title{font-family:var(--fd);font-weight:800;font-size:18px}
  .spacer{flex:1}
  .mode-toggle{display:flex;background:#f1f5fc;border:1px solid var(--border);border-radius:12px;padding:3px;gap:3px}
  .mode-btn{border:none;background:transparent;padding:8px 16px;border-radius:9px;font-family:var(--f);font-weight:700;font-size:13px;color:var(--muted);cursor:pointer;min-height:36px}
  .mode-btn.on{background:#3355dd;color:#fff}

  .wrap{max-width:1000px;margin:0 auto;padding:20px 16px 60px}

  /* MENU */
  #menu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
  .sim-card{background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:20px;cursor:pointer;transition:transform .15s,box-shadow .15s;text-align:left}
  .sim-card:active{transform:scale(.97)}
  .sim-card:hover{box-shadow:0 8px 24px rgba(30,50,100,.12);transform:translateY(-2px)}
  .sim-icon{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:26px;margin-bottom:12px}
  .sim-name{font-family:var(--fd);font-weight:800;font-size:16.5px;margin-bottom:4px}
  .sim-desc{font-size:12.5px;color:var(--muted);line-height:1.5}
  .lab-intro{font-size:14px;color:var(--muted);margin-bottom:18px;max-width:640px;line-height:1.6}

  /* SIM SHELL */
  #sim-view{display:none}
  #sim-view.on{display:block}
  #sim-stage{background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:20px;min-height:320px}
  .challenge-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#fff7e6;border:1px solid #f5d98a;border-radius:12px;padding:12px 14px;margin-bottom:16px}
  .challenge-prompt{font-family:var(--fd);font-weight:700;font-size:15px;flex:1;min-width:200px}
  .btn{font-family:var(--f);font-weight:700;font-size:13.5px;border:none;border-radius:10px;padding:10px 16px;cursor:pointer;min-height:40px;touch-action:manipulation}
  .btn-primary{background:#3355dd;color:#fff}
  .btn-ghost{background:#f1f5fc;color:var(--ink);border:1px solid var(--border)}
  .btn:active{transform:scale(.96)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .feedback{font-family:var(--fd);font-weight:800;font-size:16px;text-align:center;padding:12px;border-radius:12px;margin-top:14px;display:none}
  .feedback.show{display:block}
  .feedback.good{background:#e6f9f0;color:var(--good)}
  .feedback.bad{background:#fdeceb;color:var(--bad)}

  .stat-row{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;margin-top:16px;font-family:var(--fd);font-weight:700;font-size:15px}
  .stat-pill{background:#f1f5fc;border-radius:10px;padding:8px 16px}

  .ctrl-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:16px}
  .ctrl-group{display:flex;flex-direction:column;align-items:center;gap:6px;background:#f8fafd;border:1px solid var(--border);border-radius:12px;padding:10px 14px}
  .ctrl-label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  .ctrl-btns{display:flex;gap:6px}
  .step-btn{width:38px;height:38px;border-radius:9px;border:none;background:#3355dd;color:#fff;font-size:18px;font-weight:800;cursor:pointer}
  .step-btn.minus{background:#8896b3}
  .step-btn:disabled{opacity:.35;cursor:not-allowed}

  /* Place value blocks */
  .pv-cols{display:flex;justify-content:center;gap:22px;flex-wrap:wrap}
  .pv-col{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:110px}
  .pv-col-label{font-family:var(--fd);font-weight:700;font-size:13px;color:var(--muted)}
  .pv-blocks{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;min-height:90px;align-content:flex-start;width:100px}
  .pv-hundred{width:96px;height:96px;background:repeating-linear-gradient(0deg,#3355dd 0 8px,#547af0 8px 16px),repeating-linear-gradient(90deg,transparent 0 8px,rgba(255,255,255,.25) 8px 9px);border-radius:6px}
  .pv-ten{width:16px;height:96px;background:#22b573;border-radius:4px}
  .pv-one{width:20px;height:20px;background:#f5a623;border-radius:5px}

  @keyframes pvPopIn {
    0% { transform: scale(0.4); opacity: 0; }
    70% { transform: scale(1.12); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }
  .pv-block-new {
    animation: pvPopIn 0.35s ease-out;
    box-shadow: 0 0 0 2.5px #fff, 0 0 0 4.5px #eb6f2d;
  }
  .pv-col.highlight-col {
    background: #fffbeb;
    border: 1.5px solid #f5a623;
    border-radius: 14px;
    padding: 8px 6px;
  }
  .pv-banner {
    background: #fff7e6;
    border: 1.5px solid #f5a623;
    color: #9a5b00;
    font-family: var(--fd);
    font-weight: 800;
    font-size: 14px;
    text-align: center;
    padding: 8px 14px;
    border-radius: 10px;
    margin: 0 auto 14px;
    max-width: 520px;
  }
  .pv-banner.bundle {
    background: #e6f9f0;
    border-color: #22b573;
    color: #15803d;
  }
  .pv-expanded {
    font-size: 13px;
    color: var(--muted);
    font-weight: 700;
    text-align: center;
    margin-top: 6px;
  }

  /* Ten frame */
  .tf-wrap{display:flex;gap:20px;justify-content:center;flex-wrap:wrap}
  .tf-grid{display:grid;grid-template-columns:repeat(5,44px);grid-template-rows:repeat(2,44px);gap:5px;background:#dde6f5;padding:6px;border-radius:10px}
  .tf-cell{width:44px;height:44px;background:#fff;border:2px solid #c6d4ec;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .tf-cell.filled{background:#3355dd;border-color:#3355dd}
  .tf-cell.filled::after{content:'';width:20px;height:20px;border-radius:50%;background:#fff}
  .tf-cell.red{background:#e5484d;border-color:#e5484d}
  .tf-cell.red::after{content:'';width:20px;height:20px;border-radius:50%;background:#fff}
  .tf-cell.locked-cell{cursor:default;box-shadow:inset 0 0 0 2px rgba(255,255,255,.45)}

  .tf-frame-box{display:flex;flex-direction:column;align-items:center;gap:6px}
  .tf-frame-title{font-family:var(--fd);font-weight:700;font-size:12px;color:var(--muted)}
  .tf-bond-bar{font-family:var(--fd);font-weight:800;font-size:18px;text-align:center;margin-top:14px;padding:8px 16px;background:#f8fafd;border:1.5px solid var(--border);border-radius:12px;display:inline-block}
  .tf-color-pill{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:10px;border:1.5px solid var(--border);background:#fff;font-family:var(--f);font-weight:700;font-size:13px;cursor:pointer}
  .tf-color-pill.on-blue{border-color:#3355dd;background:#eef2ff;color:#3355dd}
  .tf-color-pill.on-red{border-color:#e5484d;background:#fdeceb;color:#b91c1c}
  .tf-dot-swatch{width:14px;height:14px;border-radius:50%;display:inline-block}

  /* number line */
  #nl-svg{width:100%;max-width:760px;display:block;margin:0 auto}
  .nl-jump-label{font-family:var(--fd);font-weight:700;font-size:14px;text-align:center;color:var(--muted);margin-bottom:8px}

  /* clock */
  .clock-wrap{display:flex;flex-direction:column;align-items:center;gap:14px}
  #clock-svg{width:240px;height:240px}
  .digital-time{font-family:var(--fd);font-weight:800;font-size:28px;background:#0f172a;color:#4ade80;padding:8px 22px;border-radius:12px}

  /* money */
  .coin-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:16px;align-items:center}
  .coin-btn,.note-btn{border:none;font-family:var(--fd);font-weight:800;cursor:pointer;color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.35);box-shadow:0 2px 5px rgba(0,0,0,.25),inset 0 1px 2px rgba(255,255,255,.4)}
  .coin-btn{border-radius:50%;width:58px;height:58px;font-size:13px;background:radial-gradient(circle at 35% 30%,#f5cf6b,#b8860b 75%)}
  .coin-btn[data-v="1"]{background:radial-gradient(circle at 35% 30%,#e8c27a,#9c7a3c 75%)}
  .coin-btn[data-v="2"]{background:radial-gradient(circle at 35% 30%,#e0e0e0,#8a8f98 75%)}
  .coin-btn[data-v="5"]{background:radial-gradient(circle at 35% 30%,#f5cf6b,#b8860b 75%)}
  .coin-btn[data-v="10"]{background:radial-gradient(circle at 35% 30%,#f7d98a,#c9941e 75%)}
  .note-btn{border-radius:5px;width:82px;height:44px;font-size:13px}
  .note-btn[data-v="20"]{background:linear-gradient(135deg,#3aa876,#1e6b46)}
  .note-btn[data-v="50"]{background:linear-gradient(135deg,#4d7fd6,#26449c)}
  .note-btn[data-v="100"]{background:linear-gradient(135deg,#d65a5a,#8c2a2a)}
  .note-btn[data-v="200"]{background:linear-gradient(135deg,#9a6bd6,#5a2f9c)}
  .purse{display:flex;gap:8px;flex-wrap:wrap;align-items:center;min-height:66px;background:#f8fafd;border:1px dashed var(--border);border-radius:10px;padding:10px;justify-content:center}
  .purse-total{font-family:var(--fd);font-weight:800;font-size:20px;text-align:center;margin-top:10px;color:#3355dd}

  .shop-shelf{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:14px}
  .shop-item{display:flex;flex-direction:column;align-items:center;gap:4px;background:#f8fafd;border:1.5px solid var(--border);border-radius:14px;padding:10px 14px;min-width:105px;cursor:pointer;transition:transform .15s,border-color .15s}
  .shop-item:active{transform:scale(.96)}
  .shop-item.on{background:#ecfdf5;border-color:#0aa39a;box-shadow:0 4px 12px rgba(10,163,154,.16)}
  .shop-icon{font-size:26px;line-height:1}
  .shop-name{font-size:12px;font-weight:700;color:var(--ink)}
  .shop-price{font-family:var(--fd);font-weight:800;font-size:14px;color:#0aa39a}
  .shop-status{font-family:var(--fd);font-weight:800;font-size:14.5px;text-align:center;padding:8px 14px;border-radius:10px;margin:0 auto 14px;max-width:480px}
  .shop-status.short{background:#fff7e6;border:1.5px solid #f5a623;color:#9a5b00}
  .shop-status.exact{background:#e6f9f0;border:1.5px solid #22b573;color:#15803d}
  .shop-status.over{background:#eef2ff;border:1.5px solid #3355dd;color:#3355dd}
  .purse-breakdown{font-size:12px;font-weight:700;color:var(--muted);text-align:center;margin-top:4px}

  /* geoboard */
  #geo-svg{width:100%;max-width:420px;display:block;margin:0 auto;touch-action:manipulation}
  .geo-peg{fill:#c6d4ec;cursor:pointer}
  .geo-peg.selected{fill:#7c3aed}
  .geo-peg.first{fill:#22b573}

  /* array & picnic */
  .arr-grid{display:inline-grid;gap:6px;margin:0 auto}
  .arr-dot{width:22px;height:22px;border-radius:50%;background:#3355dd}
  .arr-fact{font-family:var(--fd);font-weight:800;font-size:20px;text-align:center;margin-top:14px}

  .picnic-tabs{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:14px}
  .picnic-tab{padding:8px 14px;border-radius:10px;border:1.5px solid var(--border);background:#f1f5fc;font-family:var(--f);font-weight:700;font-size:13px;color:var(--muted);cursor:pointer}
  .picnic-tab.on{background:#eb6f2d;color:#fff;border-color:#eb6f2d}

  .picnic-blanket{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;background:#fef9ee;border:2px dashed #f5c97b;border-radius:16px;padding:16px;margin:0 auto;max-width:740px}
  .friend-card{background:#fff;border:2px solid var(--border);border-radius:14px;padding:10px 12px;min-width:108px;display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform .2s,border-color .2s}
  .friend-card.prev-group{border-color:#93c5fd;background:#f8fbff}
  .friend-card.new-step{border-color:#f5a623;background:#fffbeb;box-shadow:0 4px 14px rgba(245,166,35,.22);transform:translateY(-2px)}
  .friend-avatar{font-size:28px;line-height:1}
  .friend-name{font-family:var(--fd);font-weight:700;font-size:12.5px;color:var(--muted)}
  .friend-plate{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;background:#f1f5fc;border-radius:10px;padding:6px 8px;min-height:38px;min-width:84px}
  .plate-item{position:relative;font-size:20px;line-height:1}
  .plate-num{position:absolute;bottom:-4px;right:-4px;background:#233047;color:#fff;font-size:9px;font-weight:800;border-radius:99px;padding:1px 4px}
  .friend-card.new-step .plate-num{background:#eb6f2d}

  .step-callout{background:#fff7e6;border:1.5px solid #f5a623;color:#9a5b00;font-family:var(--fd);font-weight:800;font-size:15px;text-align:center;padding:8px 14px;border-radius:10px;margin:12px auto 0;max-width:540px}
  .equation-bridge{display:flex;flex-direction:column;align-items:center;gap:4px;margin-top:14px;background:#f8fafd;border:1px solid var(--border);border-radius:12px;padding:12px}
  .eq-words{font-size:13px;font-weight:700;color:var(--muted)}
  .eq-repeat{font-family:var(--fd);font-weight:700;font-size:16px;color:#3355dd}
  .eq-mult{font-family:var(--fd);font-weight:800;font-size:22px;color:var(--ink)}

  .remainder-box{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;background:#fdeceb;border:1.5px dashed #e5484d;border-radius:12px;padding:10px 16px;margin:12px auto 0;max-width:480px;font-family:var(--fd);font-weight:700;color:#b91c1c}
  .arr-icon-cell{font-size:22px;line-height:1;text-align:center;padding:2px;border-radius:6px}
  .arr-icon-cell.new-row{background:#fff3d6;outline:1.5px solid #f5a623}

  /* converter */
  .conv-cats{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:18px}
  .conv-cat-btn{border:1px solid var(--border);background:#f1f5fc;color:var(--ink);font-family:var(--f);font-weight:700;font-size:13px;padding:9px 16px;border-radius:10px;cursor:pointer;min-height:40px}
  .conv-cat-btn.on{background:#0891b2;color:#fff;border-color:#0891b2}
  .conv-row{display:flex;align-items:center;gap:12px;justify-content:center;flex-wrap:wrap}
  .conv-field{display:flex;flex-direction:column;gap:6px;align-items:center}
  .conv-input{width:130px;padding:10px 12px;border:1.5px solid var(--border);border-radius:10px;font-family:var(--fd);font-weight:700;font-size:18px;text-align:center}
  .conv-select{padding:10px 10px;border:1.5px solid var(--border);border-radius:10px;font-family:var(--f);font-weight:600;font-size:13.5px;background:#fff;min-height:44px}
  .conv-equals{font-family:var(--fd);font-weight:800;font-size:24px;color:var(--muted)}
  .conv-result{font-family:var(--fd);font-weight:800;font-size:20px;color:#0891b2;min-width:120px;text-align:center}
  .conv-swap{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--border);background:#fff;font-size:18px;cursor:pointer}

  .conv-container-wrap{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:24px}
  .conv-beaker{position:relative;width:140px;height:200px;border:4px solid #233047;border-top:none;border-radius:0 0 16px 16px;background:rgba(255,255,255,.5);overflow:hidden}
  .conv-beaker::before{content:'';position:absolute;top:-4px;left:-4px;right:-4px;height:6px;border:4px solid #233047;border-radius:8px;background:rgba(255,255,255,.6)}
  .conv-fill{position:absolute;bottom:0;left:0;right:0;transition:height .4s ease;border-radius:0 0 12px 12px}
  .conv-fill.liquid{background:linear-gradient(180deg,#7dd3fc,#0284c7)}
  .conv-fill.solid{background:repeating-linear-gradient(45deg,#d9b98a,#d9b98a 6px,#c9a877 6px,#c9a877 12px)}
  .conv-ticks{position:absolute;inset:0;pointer-events:none}
  .conv-tick{position:absolute;right:0;width:14px;height:2px;background:rgba(35,48,71,.35)}
  .conv-overflow{font-family:var(--fd);font-weight:800;color:#e5484d;text-align:center;min-height:20px}
  .conv-capacity-note{font-size:11.5px;color:var(--muted);text-align:center}

  /* shared object theme picker */
  .theme-row{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:16px}
  .theme-btn{width:40px;height:40px;border-radius:10px;border:1.5px solid var(--border);background:#fff;font-size:19px;cursor:pointer}
  .theme-btn.on{border-color:#3355dd;background:#eef2ff}

  /* addition / subtraction */
  .as-groups{display:flex;justify-content:center;gap:28px;flex-wrap:wrap}
  .as-group{display:flex;flex-direction:column;align-items:center;gap:8px}
  .as-icons{display:flex;flex-wrap:wrap;gap:4px;max-width:220px;min-height:40px;justify-content:center}
  .as-icons span{font-size:22px}
  .as-icons span.removed{opacity:.2}
  .as-op{font-family:var(--fd);font-weight:800;font-size:30px;color:var(--muted);align-self:center}

  @keyframes asMergePop {
    0% { transform: scale(0.75); opacity: 0.4; }
    100% { transform: scale(1); opacity: 1; }
  }
  .as-merged-tray{display:flex;flex-direction:column;align-items:center;gap:10px;background:#eef2ff;border:2px solid #3355dd;border-radius:16px;padding:14px 18px;max-width:460px;margin:0 auto;animation:asMergePop .25s ease-out}
  .as-merged-icons{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;min-height:42px}
  .as-merged-icons span{font-size:24px;padding:2px 4px;border-radius:8px}
  .as-merged-icons span.from-a{background:#dbeafe}
  .as-merged-icons span.from-b{background:#fef3c7}
  .as-eq-banner{font-family:var(--fd);font-weight:800;font-size:18px;text-align:center;color:var(--ink);margin-top:12px}

  /* compare and order */
  .cmp-row{display:flex;align-items:flex-end;justify-content:center;gap:18px;flex-wrap:wrap}
  .cmp-bar-wrap{display:flex;flex-direction:column;align-items:center;gap:8px}
  .cmp-bar{width:64px;border-radius:8px 8px 3px 3px;background:linear-gradient(180deg,#8aa3fb,#3355dd);display:flex;align-items:flex-start;justify-content:center;padding-top:6px;color:#fff;font-family:var(--fd);font-weight:800;font-size:16px;transition:height .3s ease;box-shadow:0 2px 5px rgba(0,0,0,.2)}
  .cmp-sym-display{font-family:var(--fd);font-weight:800;font-size:34px;color:#7c3aed;padding-bottom:20px}
  .cmp-sym-btns{display:flex;gap:8px;padding-bottom:20px}
  .cmp-sym-btn{width:52px;height:52px;border-radius:12px;border:1.5px solid var(--border);background:#fff;font-family:var(--fd);font-weight:800;font-size:24px;cursor:pointer}
  .cmp-sym-btn.on{background:#7c3aed;color:#fff;border-color:#7c3aed}
  .order-pool{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:16px}
  .order-tile{background:#f1f5fc;border:1.5px solid var(--border);border-radius:10px;padding:12px 16px;font-family:var(--fd);font-weight:800;font-size:18px;cursor:pointer;min-width:44px;text-align:center}
  .order-tile.used{opacity:.25;cursor:not-allowed}
  .order-slots{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:10px}
  .order-slot{background:#fff;border:2px dashed var(--border);border-radius:10px;padding:12px 16px;font-family:var(--fd);font-weight:800;font-size:18px;min-width:44px;text-align:center;color:var(--muted)}
  .order-slot.filled{border-style:solid;border-color:#7c3aed;color:var(--ink)}

  /* counting */
  .count-scatter{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-items:center;max-width:420px;margin:0 auto 16px;min-height:86px;background:#f8fafd;border:1.5px dashed var(--border);border-radius:16px;padding:14px}
  .scatter-item{position:relative;font-size:28px;cursor:pointer;padding:4px 6px;border-radius:10px;transition:transform .15s,background .15s;user-select:none}
  .scatter-item:active{transform:scale(.92)}
  .scatter-item.counted{background:#dcfce7;outline:2px solid #22b573}
  .scatter-badge{position:absolute;top:-6px;right:-6px;background:#15803d;color:#fff;font-family:var(--fd);font-weight:800;font-size:10px;border-radius:99px;padding:1px 5px;line-height:1.2}

  .ord-row{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:0 auto 16px}
  .ord-item{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;padding:6px;border-radius:10px;border:1.5px solid transparent}
  .ord-item.picked{background:#dcfce7;border-color:#22b573}
  .ord-item.reveal-right{background:#dcfce7;border-color:#16a34a}
  .ord-item.reveal-wrong{background:#fdeceb;border-color:#e5484d}
  .ord-tag{font-family:var(--fd);font-weight:800;font-size:11px;color:var(--muted)}

  /* fractions */
  .frac-bar{display:flex;height:70px;width:min(78vw,420px);margin:0 auto;border:2px solid #db2777;border-radius:8px;overflow:hidden}
  .frac-seg{flex:1;border-right:2px solid #db2777;cursor:pointer;background:#fff}
  .frac-seg:last-child{border-right:none}
  .frac-seg.shaded{background:#f9a8d4}
  .frac-label{font-family:var(--fd);font-weight:800;font-size:26px;text-align:center;margin-top:14px}

  .frac-stack{display:flex;flex-direction:column;align-items:center;gap:14px;margin:0 auto}
  .frac-row-card{display:flex;flex-direction:column;align-items:center;gap:8px;background:#f8fafd;border:1.5px solid var(--border);border-radius:14px;padding:12px 14px}
  .frac-row-card.ref-locked{background:#fff7e6;border-color:#f5c97b}
  .frac-bar.bar-b{border-color:#0891b2}
  .frac-bar.bar-b .frac-seg{border-right-color:#0891b2}
  .frac-bar.bar-b .frac-seg.shaded{background:#67e8f9}
  .frac-meta{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:center}
  .frac-badge{font-family:var(--fd);font-weight:800;font-size:20px;padding:4px 14px;border-radius:99px;background:#f1f5fc;color:var(--ink)}
  .frac-badge.eq{background:#e6f9f0;color:#15803d;border:1.5px solid #22b573}
  .frac-sub{font-size:12px;font-weight:700;color:var(--muted)}

  /* shapes */
  #shape-svg{width:200px;height:200px;display:block;margin:0 auto 10px}
  .shape-opts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  .shape-opt-btn{padding:10px 16px;border-radius:10px;border:1.5px solid var(--border);background:#fff;font-family:var(--f);font-weight:700;font-size:13.5px;cursor:pointer;min-height:42px}
  .shape-opt-btn.on{background:#ea580c;color:#fff;border-color:#ea580c}

  /* ruler */
  #ruler-svg{width:100%;max-width:640px;display:block;margin:0 auto 10px}

  /* data / graphs */
  .tally-card{background:#f8fafd;border:1.5px solid var(--border);border-radius:14px;padding:12px 16px;max-width:520px;margin:0 auto 18px}
  .tally-line{display:flex;align-items:center;gap:12px;padding:6px 0;border-bottom:1px dashed var(--border)}
  .tally-line:last-child{border-bottom:none}
  .tally-label{width:105px;font-family:var(--fd);font-weight:700;font-size:14.5px;display:flex;align-items:center;gap:6px}
  .tally-strokes{flex:1;display:flex;align-items:center;gap:10px;min-height:28px}
  .tally-count-pill{font-family:var(--fd);font-weight:800;font-size:13px;background:#eef2ff;color:#3355dd;padding:2px 9px;border-radius:99px}

  .bar-chart-wrap{position:relative;max-width:460px;margin:0 auto 10px;padding:12px 16px 8px;background:#fff;border:1.5px solid var(--border);border-radius:14px}
  .bar-chart{display:flex;align-items:flex-end;gap:32px;justify-content:center;height:185px;margin-bottom:6px;border-bottom:2px solid #94a3b8;padding-bottom:2px}
  .bar-col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px}
  .bar-rect{width:46px;border-radius:6px 6px 0 0;transition:height .25s ease;display:flex;align-items:flex-start;justify-content:center;padding-top:4px;color:#fff;font-family:var(--fd);font-weight:800;font-size:13px}
  .bar-lbl{font-size:12.5px;color:var(--ink);font-weight:700;text-align:center}

  @media(max-width:520px){
    .lab-title{font-size:17px}
    .sim-title{font-size:15px}
    #sim-stage{padding:14px}
  }
</style>
</head>
<body>

<div class="topbar">
  <button class="back-btn" id="back-btn" onclick="showMenu()">&larr; Back</button>
  <div class="lab-title" id="header-title">Edurena Simulation Lab</div>
  <div class="spacer"></div>
  <div class="mode-toggle" id="mode-toggle" style="display:none">
    <button class="mode-btn on" id="mode-explore" onclick="setMode('explore')">Explore</button>
    <button class="mode-btn" id="mode-challenge" onclick="setMode('challenge')">Challenge</button>
  </div>
</div>

<div class="wrap">

  <div id="menu-view">
    <p class="lab-intro">Hands on maths tools for primary learners. Explore freely, or switch to Challenge mode inside any simulation for a target to reach.</p>
    <div id="menu-grid"></div>
  </div>

  <div id="sim-view">
    <div id="sim-stage"></div>
  </div>

</div>

<script>
(function(){
'use strict';
function el(id){ return document.getElementById(id); }
function rand(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }

var OBJECT_THEMES=[
  {id:'counter', label:'Counters', icon:'●'},
  {id:'apple',   label:'Apples',   icon:'\u{1F34E}'},
  {id:'star',    label:'Stars',    icon:'⭐'},
  {id:'balloon', label:'Balloons', icon:'\u{1F388}'},
  {id:'bug',     label:'Bugs',     icon:'\u{1F41E}'},
  {id:'block',   label:'Blocks',   icon:'\u{1F7E6}'}
];
function objectIcon(themeId){
  var t=OBJECT_THEMES.filter(function(o){return o.id===themeId;})[0];
  return t?t.icon:OBJECT_THEMES[0].icon;
}
function objectThemePicker(selectedId){
  return '<div class="theme-row">'+OBJECT_THEMES.map(function(o){
    return '<button class="theme-btn'+(o.id===selectedId?' on':'')+'" data-theme="'+o.id+'" title="'+o.label+'">'+o.icon+'</button>';
  }).join('')+'</div>';
}
function wireThemePicker(container, onPick){
  Array.prototype.forEach.call(container.querySelectorAll('.theme-btn'),function(b){
    b.addEventListener('click',function(){ onPick(b.getAttribute('data-theme')); });
  });
}

var currentSimId=null;
var currentMode='explore';
var simInstance=null;

var SIMS=[
  {id:'placevalue', name:'Place Value Blocks', desc:'Build numbers with ones, tens and hundreds, and watch them regroup or borrow.', color:'#3355dd', icon:'\u{1F9F1}'},
  {id:'tenframe', name:'Ten Frame', desc:'Fill the frame with two-color counters to explore partners to 10 and teen numbers.', color:'#22b573', icon:'⚪'},
  {id:'numberline', name:'Number Line Jumps', desc:'Hop the frog along the line with jump arcs to discover repeated addition and subtraction.', color:'#f5a623', icon:'\u{1F438}'},
  {id:'clock', name:'Clock Explorer', desc:'Drag the hands directly on the clock face and read 12-hour or 24-hour time.', color:'#e5484d', icon:'\u{1F550}'},
  {id:'money', name:'Money and Coins', desc:'Shop for items or combine Naira coins and notes to reach an amount or give change.', color:'#0aa39a', icon:'\u{1F4B0}'},
  {id:'geoboard', name:'Geoboard', desc:'Build shapes and count the shaded unit squares inside to discover area and perimeter.', color:'#a855f7', icon:'\u{1F4D0}'},
  {id:'array', name:'Picnic & Array Builder', desc:'Share items with friends or arrange arrays to discover multiplication, division, and remainders.', color:'#eb6f2d', icon:'🧺'},
  {id:'convert', name:'Unit Converter', desc:'Convert between units of liquid, mass, length, time and money, freely.', color:'#0891b2', icon:'⇄'},
  {id:'addsub', name:'Addition and Subtraction', desc:'Combine or take away groups of objects and watch numbers regroup.', color:'#3355dd', icon:'➕'},
  {id:'compare', name:'Compare and Order', desc:'Greater than, less than, equal to, and putting numbers in order.', color:'#7c3aed', icon:'⚖️'},
  {id:'counting', name:'Counting and Ordinals', desc:'Tap scattered objects to count one by one, and find the 1st, 2nd and 3rd.', color:'#16a34a', icon:'🔢'},
  {id:'fractions', name:'Fractions', desc:'Shade parts of aligned bars to build and compare equivalent fractions.', color:'#db2777', icon:'▬'},
  {id:'shapes', name:'Shape Sorter', desc:'Name shapes and tap their corners and edges to count sides and vertices.', color:'#ea580c', icon:'🔺'},
  {id:'ruler', name:'Measuring Ruler', desc:'Measure real objects like a pencil or crayon against a centimetre ruler.', color:'#0d9488', icon:'📏'},
  {id:'databar', name:'Data and Graphs', desc:'Read 5-gate tally marks and build matching bar graphs.', color:'#4338ca', icon:'📊'}
];

function buildMenu(){
  var grid=el('menu-grid');
  grid.innerHTML=SIMS.map(function(s){
    return '<div class="sim-card" onclick="openSim(\''+s.id+'\')">'
      +'<div class="sim-icon" style="background:'+s.color+'22;color:'+s.color+'">'+s.icon+'</div>'
      +'<div class="sim-name">'+s.name+'</div>'
      +'<div class="sim-desc">'+s.desc+'</div>'
      +'</div>';
  }).join('');
}

window.showMenu=function(){
  currentSimId=null; simInstance=null;
  el('menu-view').style.display='block';
  el('sim-view').classList.remove('on');
  el('back-btn').classList.remove('show');
  el('mode-toggle').style.display='none';
  el('header-title').textContent='Edurena Simulation Lab';
};

window.openSim=function(id){
  var meta=SIMS.filter(function(s){return s.id===id;})[0];
  if(!meta) return;
  currentSimId=id;
  currentMode='explore';
  el('menu-view').style.display='none';
  el('sim-view').classList.add('on');
  el('back-btn').classList.add('show');
  el('mode-toggle').style.display='flex';
  el('header-title').textContent=meta.name;
  el('mode-explore').classList.add('on');
  el('mode-challenge').classList.remove('on');
  mountCurrentSim();
};

window.setMode=function(mode){
  currentMode=mode;
  el('mode-explore').classList.toggle('on',mode==='explore');
  el('mode-challenge').classList.toggle('on',mode==='challenge');
  mountCurrentSim();
};

function mountCurrentSim(){
  var stage=el('sim-stage');
  stage.innerHTML='';
  var mounters={
    placevalue: mountPlaceValue,
    tenframe: mountTenFrame,
    numberline: mountNumberLine,
    clock: mountClock,
    money: mountMoney,
    geoboard: mountGeoboard,
    array: mountArray,
    convert: mountConvert,
    addsub: mountAddSub,
    compare: mountCompare,
    counting: mountCounting,
    fractions: mountFractions,
    shapes: mountShapes,
    ruler: mountRuler,
    databar: mountDataBar
  };
  var fn=mounters[currentSimId];
  if(fn) simInstance=fn(stage, currentMode);
}

function buildChallengeBar(stage, getPromptText, onCheck, onNew){
  var bar=document.createElement('div');
  bar.className='challenge-bar';
  bar.innerHTML='<div class="challenge-prompt" id="chal-prompt"></div>'
    +'<button class="btn btn-primary" id="chal-check">Check</button>'
    +'<button class="btn btn-ghost" id="chal-new">New Challenge</button>';
  stage.appendChild(bar);
  var fb=document.createElement('div');
  fb.className='feedback'; fb.id='chal-feedback';
  stage.appendChild(fb);
  function refreshPrompt(){ el('chal-prompt').textContent=getPromptText(); }
  refreshPrompt();
  el('chal-check').addEventListener('click',function(){
    var ok=onCheck();
    fb.className='feedback show '+(ok?'good':'bad');
    fb.textContent=ok?'Correct! Well done.':'Not quite, try adjusting it and check again.';
  });
  el('chal-new').addEventListener('click',function(){
    onNew();
    refreshPrompt();
    fb.className='feedback';
  });
  return { bar:bar, feedback:fb, refreshPrompt:refreshPrompt };
}

/* ══════════════ 1. PLACE VALUE BLOCKS ══════════════ */
function mountPlaceValue(stage, mode){
  var state={ones:0,tens:0,hundreds:0};
  var target=null;
  var eventMsg='';
  var eventType='';
  var highlightCol='';
  var highlightCount=0;

  var host=document.createElement('div');
  stage.appendChild(host);

  function total(){ return state.hundreds*100+state.tens*10+state.ones; }

  function clearEvent(){
    eventMsg=''; eventType=''; highlightCol=''; highlightCount=0;
  }

  function addOnes(n){
    clearEvent();
    state.ones+=n;
    if(state.ones>=10){
      var bundledTens=Math.floor(state.ones/10);
      state.ones=state.ones%10;
      state.tens+=bundledTens;
      eventType='bundle';
      highlightCol='tens';
      highlightCount=bundledTens;
      eventMsg='10 Ones snapped together into 1 Ten rod!';
    }
    if(state.tens>=10){
      var bundledHundreds=Math.floor(state.tens/10);
      state.tens=state.tens%10;
      state.hundreds+=bundledHundreds;
      eventType='bundle';
      highlightCol='hundreds';
      highlightCount=bundledHundreds;
      eventMsg='10 Tens snapped together into 1 Hundred flat!';
    }
    render();
  }

  function addTens(n){
    clearEvent();
    state.tens+=n;
    if(state.tens>=10){
      var bundledHundreds=Math.floor(state.tens/10);
      state.tens=state.tens%10;
      state.hundreds+=bundledHundreds;
      eventType='bundle';
      highlightCol='hundreds';
      highlightCount=bundledHundreds;
      eventMsg='10 Tens snapped together into 1 Hundred flat!';
    }
    render();
  }

  function addHundreds(n){
    clearEvent();
    if(state.hundreds<9){
      state.hundreds+=n;
      highlightCol='hundreds';
      highlightCount=1;
    }
    render();
  }

  function subOnes(){
    clearEvent();
    if(state.ones>0){
      state.ones--;
      render();
      return;
    }
    if(state.tens>0){
      state.tens--;
      state.ones=9;
      eventType='unbundle';
      highlightCol='ones';
      highlightCount=9;
      eventMsg='Borrowed 1 Ten and broke it into 10 Ones, then took 1 away (9 left)!';
      render();
    } else if(state.hundreds>0){
      state.hundreds--;
      state.tens=9;
      state.ones=9;
      eventType='unbundle';
      highlightCol='ones';
      highlightCount=9;
      eventMsg='Broke 1 Hundred into 10 Tens, then broke 1 Ten into 10 Ones, and took 1 away!';
      render();
    }
  }

  function subTens(){
    clearEvent();
    if(state.tens>0){
      state.tens--;
      render();
      return;
    }
    if(state.hundreds>0){
      state.hundreds--;
      state.tens=9;
      eventType='unbundle';
      highlightCol='tens';
      highlightCount=9;
      eventMsg='Borrowed 1 Hundred and broke it into 10 Tens, then took 1 away (9 left)!';
      render();
    }
  }

  function subHundreds(){
    clearEvent();
    if(state.hundreds>0){
      state.hundreds--;
      render();
    }
  }

  function blockRow(kind, count, colName){
    var out='';
    var newStartIndex = (highlightCol===colName && highlightCount>0) ? (count - highlightCount) : count;
    for(var i=0;i<count;i++){
      var isNew = i >= newStartIndex;
      out+='<div class="pv-'+kind+(isNew?' pv-block-new':'')+'"></div>';
    }
    return out;
  }

  function render(){
    var canSubOnes = total() > 0;
    var canSubTens = (state.tens > 0 || state.hundreds > 0);
    var canSubHundreds = state.hundreds > 0;

    var bannerHtml = eventMsg
      ? '<div class="pv-banner '+(eventType==='bundle'?'bundle':'')+'">'+eventMsg+'</div>'
      : '';

    var expandedParts=[];
    if(state.hundreds>0) expandedParts.push((state.hundreds*100)+' ('+state.hundreds+'H)');
    if(state.tens>0) expandedParts.push((state.tens*10)+' ('+state.tens+'T)');
    if(state.ones>0 || expandedParts.length===0) expandedParts.push(state.ones+' ('+state.ones+'O)');

    host.innerHTML=
      bannerHtml
      +'<div class="pv-cols">'
      +'<div class="pv-col'+(highlightCol==='hundreds'?' highlight-col':'')+'">'
        +'<div class="pv-col-label">Hundreds ('+state.hundreds+')</div>'
        +'<div class="pv-blocks">'+blockRow('hundred',state.hundreds,'hundreds')+'</div>'
        +'<div class="ctrl-btns">'
          +'<button class="step-btn minus" id="pv-h-minus" '+(canSubHundreds?'':'disabled')+'>&minus;</button>'
          +'<button class="step-btn" id="pv-h-plus" '+(state.hundreds>=9?'disabled':'')+'>+</button>'
        +'</div>'
      +'</div>'
      +'<div class="pv-col'+(highlightCol==='tens'?' highlight-col':'')+'">'
        +'<div class="pv-col-label">Tens ('+state.tens+')</div>'
        +'<div class="pv-blocks">'+blockRow('ten',state.tens,'tens')+'</div>'
        +'<div class="ctrl-btns">'
          +'<button class="step-btn minus" id="pv-t-minus" '+(canSubTens?'':'disabled')+'>&minus;</button>'
          +'<button class="step-btn" id="pv-t-plus">+</button>'
        +'</div>'
      +'</div>'
      +'<div class="pv-col'+(highlightCol==='ones'?' highlight-col':'')+'">'
        +'<div class="pv-col-label">Ones ('+state.ones+')</div>'
        +'<div class="pv-blocks">'+blockRow('one',state.ones,'ones')+'</div>'
        +'<div class="ctrl-btns">'
          +'<button class="step-btn minus" id="pv-o-minus" '+(canSubOnes?'':'disabled')+'>&minus;</button>'
          +'<button class="step-btn" id="pv-o-plus">+</button>'
        +'</div>'
      +'</div>'
      +'</div>'
      +'<div class="stat-row"><div class="stat-pill">Number: '+total()+'</div></div>'
      +'<div class="pv-expanded">'+expandedParts.join(' + ')+'</div>';

    el('pv-h-plus').onclick=function(){ addHundreds(1); };
    el('pv-h-minus').onclick=subHundreds;
    el('pv-t-plus').onclick=function(){ addTens(1); };
    el('pv-t-minus').onclick=subTens;
    el('pv-o-plus').onclick=function(){ addOnes(1); };
    el('pv-o-minus').onclick=subOnes;
  }

  render();

  if(mode==='challenge'){
    var chalVariant='build', startVal=0, subVal=0;
    function newTarget(){
      clearEvent();
      chalVariant = Math.random()<0.5 ? 'build' : 'subtract';
      if(chalVariant==='build'){
        target=rand(11,899);
        state.ones=0; state.tens=0; state.hundreds=0;
      } else {
        var h=rand(1,4), t=rand(1,5);
        startVal = h*100 + t*10;
        subVal = rand(2,9);
        target = startVal - subVal;
        state.hundreds = h;
        state.tens = t;
        state.ones = 0;
      }
      render();
    }
    newTarget();
    var barObj = buildChallengeBar(stage, function(){
      return chalVariant==='build'
        ? 'Build the number '+target+' using the blocks.'
        : 'Start at '+startVal+' and take away '+subVal+' (watch the Tens unbundle into Ones!).';
    }, function(){
      return total()===target;
    }, newTarget);

    el('chal-check').addEventListener('click', function(){
      var cur=total();
      if(cur!==target){
        var diff=Math.abs(cur-target);
        barObj.feedback.textContent = cur < target
          ? 'You built '+cur+' — that is '+diff+' too low. Add more blocks!'
          : 'You built '+cur+' — that is '+diff+' too high. Take away '+diff+'!';
      }
    });
  }
}

/* ══════════════ 2. TEN FRAME ══════════════ */
function mountTenFrame(stage, mode){
  var cells=new Array(20).fill(null);
  var locked=new Array(20).fill(false);
  var activeColor='blue';
  var host=document.createElement('div');
  stage.appendChild(host);

  function countColor(c){ return cells.filter(function(v){ return v===c; }).length; }
  function totalCount(){ return cells.filter(Boolean).length; }

  function render(){
    var blueN=countColor('blue');
    var redN=countColor('red');
    var tot=blueN+redN;

    var cellsA='', cellsB='';
    for(var i=0;i<10;i++){
      var cls='tf-cell'+(cells[i]==='blue'?' filled':(cells[i]==='red'?' red':''))+(locked[i]?' locked-cell':'');
      cellsA+='<div class="'+cls+'" data-i="'+i+'"></div>';
    }
    for(var j=10;j<20;j++){
      var clsB='tf-cell'+(cells[j]==='blue'?' filled':(cells[j]==='red'?' red':''))+(locked[j]?' locked-cell':'');
      cellsB+='<div class="'+clsB+'" data-i="'+j+'"></div>';
    }

    var eqHtml='';
    if(tot===0){
      eqHtml='Tap squares to place counters';
    } else if(blueN>0 && redN>0){
      eqHtml='<span style="color:#3355dd">'+blueN+' Blue</span> + <span style="color:#e5484d">'+redN+' Red</span> = <strong>'+tot+'</strong>'
        +(tot===10 ? ' &nbsp;🎯 Partner to 10!' : (tot>10 ? ' &nbsp;(10 + '+(tot-10)+')' : ''));
    } else {
      var label=blueN>0?'Blue':'Red';
      var col=blueN>0?'#3355dd':'#e5484d';
      eqHtml='<span style="color:'+col+'">'+tot+' '+label+'</span>'
        +(tot>10 ? ' = <strong>10 + '+(tot-10)+'</strong>' : (tot===10 ? ' = <strong>1 Full Ten!</strong>' : ''));
    }

    var firstFrameCount=cells.slice(0,10).filter(Boolean).length;
    var canCompleteTen=(mode==='explore' && firstFrameCount>0 && firstFrameCount<10);

    var colorControls = '<div class="ctrl-row" style="margin-top:0;margin-bottom:14px">'
      +'<button class="tf-color-pill'+(activeColor==='blue'?' on-blue':'')+'" id="tf-pick-blue">'
        +'<span class="tf-dot-swatch" style="background:#3355dd"></span> Blue Counter'
      +'</button>'
      +'<button class="tf-color-pill'+(activeColor==='red'?' on-red':'')+'" id="tf-pick-red">'
        +'<span class="tf-dot-swatch" style="background:#e5484d"></span> Red Counter'
      +'</button>'
      +(canCompleteTen
        ? '<button class="btn btn-ghost" id="tf-fill-ten">Fill Frame 1 to 10 (+'+(10-firstFrameCount)+' Red)</button>'
        : '')
      +'</div>';

    host.innerHTML=colorControls
      +'<div class="tf-wrap">'
        +'<div class="tf-frame-box"><div class="tf-frame-title">First Ten (1–10)</div><div class="tf-grid">'+cellsA+'</div></div>'
        +'<div class="tf-frame-box"><div class="tf-frame-title">Second Ten (11–20)</div><div class="tf-grid">'+cellsB+'</div></div>'
      +'</div>'
      +'<div style="text-align:center"><div class="tf-bond-bar">'+eqHtml+'</div></div>'
      +'<div class="stat-row"><button class="btn btn-ghost" id="tf-clear">Clear Unlocked</button></div>';

    el('tf-pick-blue').onclick=function(){ activeColor='blue'; render(); };
    el('tf-pick-red').onclick=function(){ activeColor='red'; render(); };

    if(canCompleteTen){
      el('tf-fill-ten').onclick=function(){
        for(var k=0;k<10;k++){
          if(!cells[k]) cells[k]='red';
        }
        render();
      };
    }

    Array.prototype.forEach.call(host.querySelectorAll('.tf-cell'),function(c){
      c.addEventListener('click',function(){
        var idx=parseInt(c.getAttribute('data-i'),10);
        if(locked[idx]) return;
        cells[idx] = (cells[idx]===activeColor) ? null : activeColor;
        render();
      });
    });

    el('tf-clear').onclick=function(){
      for(var k=0;k<20;k++){
        if(!locked[k]) cells[k]=null;
      }
      render();
    };
  }
  render();

  if(mode==='challenge'){
    var chalVariant='build', targetTotal=0, startBlue=0, addRed=0;

    function newTarget(){
      var pick=rand(1,3);
      chalVariant = pick===1 ? 'build' : (pick===2 ? 'make10' : 'bond');
      cells=new Array(20).fill(null);
      locked=new Array(20).fill(false);

      if(chalVariant==='build'){
        targetTotal=rand(4,19);
        activeColor='blue';
      } else if(chalVariant==='make10'){
        startBlue=rand(2,9);
        addRed=10-startBlue;
        targetTotal=10;
        for(var i=0;i<startBlue;i++){
          cells[i]='blue';
          locked[i]=true;
        }
        activeColor='red';
      } else {
        startBlue=rand(5,9);
        addRed=rand(10-startBlue+1, 8);
        targetTotal=startBlue+addRed;
        activeColor='blue';
      }
      render();
    }
    newTarget();

    var barObj = buildChallengeBar(stage, function(){
      if(chalVariant==='build'){
        return 'Fill '+targetTotal+' counters using the ten-frames.';
      }
      if(chalVariant==='make10'){
        return 'There are '+startBlue+' Blue counters. Add Red counters to make 10!';
      }
      return 'Show '+startBlue+' Blue + '+addRed+' Red counters to find the total.';
    }, function(){
      if(chalVariant==='build'){
        return totalCount()===targetTotal;
      }
      if(chalVariant==='make10'){
        return countColor('blue')===startBlue && countColor('red')===addRed && totalCount()===10;
      }
      return countColor('blue')===startBlue && countColor('red')===addRed;
    }, newTarget);

    el('chal-check').addEventListener('click',function(){
      if(chalVariant==='make10'){
        var r=countColor('red');
        if(r!==addRed || totalCount()!==10){
          barObj.feedback.textContent='You have '+startBlue+' Blue and '+r+' Red ('+(startBlue+r)+' total). Fill only the empty spaces in the first frame to make 10!';
        }
      } else if(chalVariant==='bond'){
        var b=countColor('blue'), rd=countColor('red');
        if(b!==startBlue || rd!==addRed){
          barObj.feedback.textContent='You placed '+b+' Blue and '+rd+' Red — adjust them to '+startBlue+' Blue and '+addRed+' Red!';
        }
      }
    });
  }
}

/* ══════════════ 3. NUMBER LINE JUMPS ══════════════ */
function mountNumberLine(stage, mode){
  var MINV=-10, MAXV=20;
  var pos=0;
  var history=[];
  var host=document.createElement('div');
  stage.appendChild(host);
  var jumpSize=1, targetVal=null;

  function clamp(v){ return Math.max(MINV,Math.min(MAXV,v)); }

  function recordJump(delta){
    var next=clamp(pos+delta);
    var actualDelta=next-pos;
    if(actualDelta===0) return;
    history.push({from:pos, to:next, step:actualDelta});
    pos=next;
    render();
  }

  function undoJump(){
    if(history.length===0) return;
    var last=history.pop();
    pos=last.from;
    render();
  }

  function svgLine(){
    var w=740, h=145, padding=28, usable=w-padding*2, span=MAXV-MINV;
    var lineY=96;
    function xFor(v){ return padding+((v-MINV)/span)*usable; }

    var ticks='', step=span<=20?1:span<=60?2:span<=200?5:Math.ceil(span/40);
    var labelEvery=step*(span<=20?2:5);
    for(var v=MINV;v<=MAXV;v+=step){
      var x=xFor(v);
      var isMajor=(v%labelEvery===0);
      ticks+='<line x1="'+x+'" y1="'+(lineY-6)+'" x2="'+x+'" y2="'+(lineY+6)+'" stroke="'+(isMajor?'#6b7896':'#c6d4ec')+'" stroke-width="'+(isMajor?2.5:1.5)+'"/>';
      if(isMajor){
        ticks+='<text x="'+x+'" y="'+(lineY+22)+'" font-size="12" font-weight="700" fill="#6b7896" text-anchor="middle">'+v+'</text>';
      }
    }

    var arcs='';
    history.forEach(function(hop, idx){
      var x1=xFor(hop.from), x2=xFor(hop.to);
      var midX=(x1+x2)/2;
      var distPx=Math.abs(x2-x1);
      var arcHeight=Math.min(58, Math.max(24, distPx*0.42));
      var ctrlY=lineY - arcHeight;
      var peakY=lineY - arcHeight*0.52;
      var isPos=hop.step>0;
      var color=isPos ? '#22b573' : '#eb6f2d';
      var isLatest=(idx===history.length-1);

      arcs+='<path d="M '+x1+' '+lineY+' Q '+midX+' '+ctrlY+' '+x2+' '+lineY+'" fill="none" stroke="'+color+'" stroke-width="'+(isLatest?3:2.2)+'" stroke-dasharray="'+(isLatest?'none':'4,3')+'"/>';
      if(!isLatest){
        arcs+='<circle cx="'+x2+'" cy="'+lineY+'" r="3.5" fill="'+color+'"/>';
      }
      var labelTxt=(hop.step>0?'+':'')+hop.step;
      arcs+='<text x="'+midX+'" y="'+(peakY-5)+'" font-size="11.5" font-weight="800" fill="'+color+'" text-anchor="middle">'+labelTxt+'</text>';
    });

    var zeroX=xFor(0);
    var markerX=xFor(pos);

    return '<svg id="nl-svg" viewBox="0 0 '+w+' '+h+'">'
      +'<line x1="'+padding+'" y1="'+lineY+'" x2="'+(w-padding)+'" y2="'+lineY+'" stroke="#8896b3" stroke-width="3" stroke-linecap="round"/>'
      +ticks
      +(MINV<=0&&MAXV>=0?'<line x1="'+zeroX+'" y1="'+(lineY-14)+'" x2="'+zeroX+'" y2="'+(lineY+14)+'" stroke="#3355dd" stroke-width="2.5"/>':'')
      +arcs
      +'<circle cx="'+markerX+'" cy="'+lineY+'" r="5" fill="#f5a623"/>'
      +'<text x="'+markerX+'" y="'+(lineY-10)+'" font-size="24" text-anchor="middle" style="user-select:none">🐸</text>'
      +'</svg>';
  }

  function equationTrail(){
    if(history.length===0) return 'Tap a jump button to hop from 0!';
    var terms=['0'];
    var allSame=true;
    var firstStep=history[0].step;
    history.forEach(function(h){
      if(h.step!==firstStep) allSame=false;
      terms.push((h.step>=0?'+ ':'− ')+Math.abs(h.step));
    });
    var chain=terms.join(' ')+' = '+pos;
    if(allSame && history.length>1){
      return chain+'  &nbsp;•&nbsp;  '+history.length+' jumps of '+(firstStep>=0?'+':'')+firstStep+' = '+pos;
    }
    return chain;
  }

  function render(){
    var jumpControls = mode==='challenge'
      ? '<button class="btn btn-primary" id="nl-jump">Hop '+(jumpSize>=0?'+':'')+jumpSize+'</button>'
        +'<button class="btn btn-ghost" id="nl-undo" '+(history.length===0?'disabled':'')+'>Undo Hop</button>'
      : '<button class="btn btn-primary" id="nl-j1">+1</button>'
        +'<button class="btn btn-primary" id="nl-j2">+2</button>'
        +'<button class="btn btn-primary" id="nl-j5">+5</button>'
        +'<button class="btn btn-ghost" id="nl-jm1">&minus;1</button>'
        +'<button class="btn btn-ghost" id="nl-jm2">&minus;2</button>'
        +'<button class="btn btn-ghost" id="nl-jm5">&minus;5</button>'
        +'<button class="btn btn-ghost" id="nl-undo" '+(history.length===0?'disabled':'')+'>Undo</button>';

    var rangeControls = mode==='explore'
      ? '<div class="ctrl-row"><div class="ctrl-group"><div class="ctrl-label">Line range</div>'
        +'<div><input type="number" id="nl-min" value="'+MINV+'" style="width:74px" class="conv-input"> to '
        +'<input type="number" id="nl-max" value="'+MAXV+'" style="width:74px" class="conv-input"></div></div></div>'
      : '';

    host.innerHTML=(mode==='challenge'?'<div class="nl-jump-label">Hops made: '+history.length+'</div>':'')
      +svgLine()
      +'<div class="stat-row"><div class="stat-pill">Frog Position: '+pos+'</div>'
      +'<div class="stat-pill" style="color:#3355dd">'+equationTrail()+'</div></div>'
      +'<div class="ctrl-row">'+jumpControls+'<button class="btn btn-ghost" id="nl-reset">Reset</button></div>'
      +rangeControls;

    el('nl-reset').onclick=function(){ pos=0; history=[]; render(); };
    el('nl-undo').onclick=undoJump;

    if(mode==='challenge'){
      el('nl-jump').onclick=function(){ recordJump(jumpSize); };
    } else {
      el('nl-j1').onclick=function(){ recordJump(1); };
      el('nl-j2').onclick=function(){ recordJump(2); };
      el('nl-j5').onclick=function(){ recordJump(5); };
      el('nl-jm1').onclick=function(){ recordJump(-1); };
      el('nl-jm2').onclick=function(){ recordJump(-2); };
      el('nl-jm5').onclick=function(){ recordJump(-5); };
      el('nl-min').addEventListener('change',function(){
        var v=parseInt(el('nl-min').value,10);
        if(!isNaN(v)&&v<MAXV){ MINV=v; pos=clamp(pos); history=[]; render(); }
      });
      el('nl-max').addEventListener('change',function(){
        var v=parseInt(el('nl-max').value,10);
        if(!isNaN(v)&&v>MINV){ MAXV=v; pos=clamp(pos); history=[]; render(); }
      });
    }
  }
  render();

  if(mode==='challenge'){
    MINV=-20; MAXV=20;
    function newTarget(){
      var dir=Math.random()<0.5?1:-1;
      var room=dir>0?MAXV:-MINV;
      var jumpMag=rand(2,Math.max(2,Math.min(9,Math.floor(room/2))));
      jumpSize=dir*jumpMag;
      var maxJumps=Math.max(2,Math.min(6,Math.floor(room/jumpMag)));
      var jumps=rand(2,maxJumps);
      pos=0; history=[];
      targetVal=jumpSize*jumps;
      render();
    }
    newTarget();
    buildChallengeBar(stage, function(){ return 'Using hops of '+(jumpSize>=0?'+':'')+jumpSize+', land the frog exactly on '+targetVal+'.'; },
      function(){ return pos===targetVal; }, newTarget);
  }
}

/* ══════════════ 4. CLOCK EXPLORER ══════════════ */
function mountClock(stage, mode){
  var hour24=15, minute=0;
  var use24=false;
  var hideDigital=false;
  var draggingHand=null;
  var host=document.createElement('div');
  stage.appendChild(host);
  var targetHour24=null, targetMinute=null;

  function clockSvg(){
    var cx=120, cy=120, r=108;
    var minuteAngle=minute*6;
    var hourAngle=(hour24%12)*30+minute*0.5;
    var marks='';

    for(var m=0; m<60; m++){
      var a=(m*6)*Math.PI/180;
      var isHour=(m%5===0);
      var rOuter=r-6;
      var rInner=isHour ? r-16 : r-11;
      var x1=cx+Math.sin(a)*rOuter, y1=cy-Math.cos(a)*rOuter;
      var x2=cx+Math.sin(a)*rInner, y2=cy-Math.cos(a)*rInner;
      marks+='<line x1="'+x1.toFixed(1)+'" y1="'+y1.toFixed(1)+'" x2="'+x2.toFixed(1)+'" y2="'+y2.toFixed(1)+'" stroke="'+(isHour?'#475569':'#cbd5e1')+'" stroke-width="'+(isHour?2.5:1.2)+'"/>';

      if(isHour){
        var num=(m===0)?12:(m/5);
        var rNum=r-29;
        var nx=cx+Math.sin(a)*rNum;
        var ny=cy-Math.cos(a)*rNum + 4.5;
        marks+='<text x="'+nx.toFixed(1)+'" y="'+ny.toFixed(1)+'" font-size="13" font-weight="800" fill="#233047" text-anchor="middle" style="user-select:none">'+num+'</text>';
      }
    }

    return '<svg id="clock-svg" viewBox="0 0 240 240" style="width:240px;height:240px;touch-action:none;cursor:grab">'
      +'<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="#fff" stroke="#3355dd" stroke-width="4"/>'
      +marks
      +'<g transform="rotate('+hourAngle+' '+cx+' '+cy+')" data-hand="hour" style="cursor:pointer">'
        +'<line x1="'+cx+'" y1="'+cy+'" x2="'+cx+'" y2="'+(cy-50)+'" stroke="transparent" stroke-width="20"/>'
        +'<line x1="'+cx+'" y1="'+cy+'" x2="'+cx+'" y2="'+(cy-50)+'" stroke="#233047" stroke-width="6.5" stroke-linecap="round"/>'
        +'<circle cx="'+cx+'" cy="'+(cy-44)+'" r="6" fill="#233047"/>'
      +'</g>'
      +'<g transform="rotate('+minuteAngle+' '+cx+' '+cy+')" data-hand="minute" style="cursor:pointer">'
        +'<line x1="'+cx+'" y1="'+cy+'" x2="'+cx+'" y2="'+(cy-76)+'" stroke="transparent" stroke-width="20"/>'
        +'<line x1="'+cx+'" y1="'+cy+'" x2="'+cx+'" y2="'+(cy-76)+'" stroke="#e5484d" stroke-width="4" stroke-linecap="round"/>'
        +'<circle cx="'+cx+'" cy="'+(cy-72)+'" r="6.5" fill="#e5484d" stroke="#fff" stroke-width="1.5"/>'
      +'</g>'
      +'<circle cx="'+cx+'" cy="'+cy+'" r="7" fill="#233047"/>'
      +'</svg>';
  }

  function digital(h24,m){
    var mm=m<10?'0'+m:''+m;
    if(use24){
      var hh=h24<10?'0'+h24:''+h24;
      return hh+':'+mm;
    }
    var h12=h24%12; if(h12===0) h12=12;
    return h12+':'+mm+' '+(h24<12?'AM':'PM');
  }

  function angleFromPointer(svgEl, clientX, clientY){
    var rect=svgEl.getBoundingClientRect();
    var cx=rect.left + rect.width/2;
    var cy=rect.top + rect.height/2;
    var dx=clientX - cx;
    var dy=clientY - cy;
    var deg=(Math.atan2(dx, -dy)*180/Math.PI + 360)%360;
    return deg;
  }

  function applyDragAngle(deg){
    if(draggingHand==='minute'){
      var newMin=(Math.round(deg/30)*5)%60;
      if(newMin!==minute){
        if(minute>=45 && newMin<=15){
          hour24=(hour24+1)%24;
        } else if(minute<=15 && newMin>=45){
          hour24=(hour24+23)%24;
        }
        minute=newMin;
        render();
      }
    } else if(draggingHand==='hour'){
      var h12=Math.round(deg/30)%12;
      var isPM=(hour24>=12);
      var newH24=h12 + (isPM?12:0);
      if(newH24!==hour24){
        hour24=newH24;
        render();
      }
    }
  }

  function wireClockDrag(){
    var svgEl=el('clock-svg');
    if(!svgEl) return;

    svgEl.addEventListener('pointerdown',function(e){
      var handGroup=e.target.closest('[data-hand]');
      if(handGroup){
        draggingHand=handGroup.getAttribute('data-hand');
      } else {
        draggingHand='minute';
      }
      svgEl.setPointerCapture(e.pointerId);
      applyDragAngle(angleFromPointer(svgEl, e.clientX, e.clientY));
    });

    svgEl.addEventListener('pointermove',function(e){
      if(!draggingHand) return;
      applyDragAngle(angleFromPointer(svgEl, e.clientX, e.clientY));
    });

    function endDrag(){ draggingHand=null; }
    svgEl.addEventListener('pointerup',endDrag);
    svgEl.addEventListener('pointercancel',endDrag);
  }

  function render(){
    var isPM=(hour24>=12);
    var digitalHtml = hideDigital
      ? '<div class="digital-time" style="color:#64748b;letter-spacing:2px">-- : --</div>'
      : '<div class="digital-time">'+digital(hour24,minute)+'</div>';

    host.innerHTML='<div class="clock-wrap">'
      +'<div class="ctrl-row" style="margin-top:0;margin-bottom:6px">'
        +'<button class="btn '+(use24?'btn-ghost':'btn-primary')+'" id="cl-mode-12">12-hour</button>'
        +'<button class="btn '+(use24?'btn-primary':'btn-ghost')+'" id="cl-mode-24">24-hour</button>'
        +'<button class="btn '+(hideDigital?'btn-primary':'btn-ghost')+'" id="cl-hide-dig">'
          +(hideDigital ? '👁 Show Digital' : '🙈 Hide Digital')
        +'</button>'
      +'</div>'
      +clockSvg()
      +'<div style="font-size:12px;color:var(--muted);font-weight:700">Drag the red minute hand or dark hour hand, or use the buttons below</div>'
      +digitalHtml
      +'<div class="ctrl-row">'
        +'<div class="ctrl-group"><div class="ctrl-label">Hour</div><div class="ctrl-btns"><button class="step-btn minus" id="cl-h-minus">&minus;</button><button class="step-btn" id="cl-h-plus">+</button></div></div>'
        +'<div class="ctrl-group"><div class="ctrl-label">Minute</div><div class="ctrl-btns"><button class="step-btn minus" id="cl-m-minus">&minus;</button><button class="step-btn" id="cl-m-plus">+</button></div></div>'
        +'<div class="ctrl-group"><div class="ctrl-label">Period</div><div class="ctrl-btns"><button class="btn '+(isPM?'btn-ghost':'btn-primary')+'" id="cl-am" style="padding:6px 10px;min-height:38px">AM</button><button class="btn '+(isPM?'btn-primary':'btn-ghost')+'" id="cl-pm" style="padding:6px 10px;min-height:38px">PM</button></div></div>'
      +'</div></div>';

    wireClockDrag();

    el('cl-mode-12').onclick=function(){ use24=false; render(); };
    el('cl-mode-24').onclick=function(){ use24=true; render(); };
    el('cl-hide-dig').onclick=function(){ hideDigital=!hideDigital; render(); };
    el('cl-h-plus').onclick=function(){ hour24=(hour24+1)%24; render(); };
    el('cl-h-minus').onclick=function(){ hour24=(hour24+23)%24; render(); };
    el('cl-m-plus').onclick=function(){
      if(minute+5>=60) hour24=(hour24+1)%24;
      minute=(minute+5)%60;
      render();
    };
    el('cl-m-minus').onclick=function(){
      if(minute-5<0) hour24=(hour24+23)%24;
      minute=(minute+55)%60;
      render();
    };
    el('cl-am').onclick=function(){ if(hour24>=12){ hour24-=12; render(); } };
    el('cl-pm').onclick=function(){ if(hour24<12){ hour24+=12; render(); } };
  }
  render();

  if(mode==='challenge'){
    var variant='set', duration=0;
    function newTarget(){
      variant=Math.random()<0.5?'set':'elapsed';
      if(variant==='set'){
        targetHour24=rand(0,23);
        targetMinute=rand(0,11)*5;
        hour24=0; minute=0;
      } else {
        hour24=rand(0,23);
        minute=rand(0,11)*5;
        duration=rand(1,47)*5;
        var totalStart=hour24*60+minute;
        var totalEnd=(totalStart+duration)%1440;
        targetHour24=Math.floor(totalEnd/60);
        targetMinute=totalEnd%60;
      }
      render();
    }
    newTarget();
    buildChallengeBar(stage, function(){
      return variant==='set'
        ? 'Set the clock to '+digital(targetHour24,targetMinute)+'.'
        : 'The clock shows the start time. A class lasts '+duration+' minutes. Set the clock to show when it ends.';
    }, function(){ return hour24===targetHour24 && minute===targetMinute; }, newTarget);
  }
}

/* ══════════════ 5. MONEY AND COINS ══════════════ */
function mountMoney(stage, mode){
  var DENOMS=[1,2,5,10,20,50,100,200];
  var SHOP_ITEMS=[
    {id:'biscuit',  name:'Biscuit',       price:35,  icon:'🍪'},
    {id:'juice',    name:'Fruit Juice',   price:80,  icon:'🧃'},
    {id:'book',     name:'Exercise Book', price:150, icon:'📓'},
    {id:'lunchbox', name:'Lunch Pack',    price:285, icon:'🍱'}
  ];

  var purse=[];
  var seq=0;
  var selectedShopId=null;
  var host=document.createElement('div');
  stage.appendChild(host);
  var target=null;

  function total(){ return purse.reduce(function(s,p){return s+p.value;},0); }

  function breakdownText(){
    if(purse.length===0) return '';
    var counts={};
    purse.forEach(function(p){ counts[p.value]=(counts[p.value]||0)+1; });
    var parts=DENOMS.slice().reverse().filter(function(v){ return counts[v]>0; }).map(function(v){
      return counts[v]+' &times; ₦'+v;
    });
    return parts.join(' + ');
  }

  function render(){
    var curTotal=total();
    var selectedItem = selectedShopId
      ? SHOP_ITEMS.filter(function(it){ return it.id===selectedShopId; })[0]
      : null;

    var shopHtml='';
    if(mode==='explore'){
      shopHtml='<div style="font-size:11.5px;font-weight:700;color:var(--muted);text-align:center;margin-bottom:8px;text-transform:uppercase;letter-spacing:.4px">Tap an item to pay for it (or tap again for free play)</div>'
        +'<div class="shop-shelf">'
        +SHOP_ITEMS.map(function(it){
          return '<button class="shop-item'+(it.id===selectedShopId?' on':'')+'" data-shop="'+it.id+'">'
            +'<div class="shop-icon">'+it.icon+'</div>'
            +'<div class="shop-name">'+it.name+'</div>'
            +'<div class="shop-price">₦'+it.price+'</div>'
            +'</button>';
        }).join('')
        +'</div>';

      if(selectedItem){
        var diff = curTotal - selectedItem.price;
        if(diff < 0){
          shopHtml+='<div class="shop-status short">Buying '+selectedItem.icon+' '+selectedItem.name+' (₦'+selectedItem.price+') — Add <strong>₦'+Math.abs(diff)+'</strong> more</div>';
        } else if(diff === 0){
          shopHtml+='<div class="shop-status exact">Exact payment for '+selectedItem.icon+' '+selectedItem.name+' (₦'+selectedItem.price+')!</div>';
        } else {
          shopHtml+='<div class="shop-status over">Paid ₦'+curTotal+' for ₦'+selectedItem.price+' '+selectedItem.name+' — Change due: <strong>₦'+diff+'</strong></div>';
        }
      }
    }

    var coinsHtml=DENOMS.map(function(v){
      var isCoin=v<20;
      return '<button class="'+(isCoin?'coin-btn':'note-btn')+'" data-v="'+v+'">₦'+v+'</button>';
    }).join('');

    var purseHtml=purse.map(function(p){
      var isCoin=p.value<20;

    host.innerHTML=shopHtml

      +(purse.length>0 ? '<div class="purse-breakdown">'+breakdownText()+'</div>' : '')
      +'<div class="stat-row"><button class="btn btn-ghost" id="money-clear" '+(purse.length===0?'disabled':'')+'>Empty Purse</button></div>';

    if(mode==='explore'){
      Array.prototype.forEach.call(host.querySelectorAll('[data-shop]'),function(b){
        b.addEventListener('click',function(){
          var id=b.getAttribute('data-shop');

        });
      });
