        +'<button class="step-btn" id="cmp-b-plus">+</button>'
        +'<button class="step-btn" id="cmp-b-p10" style="font-size:13px">+10</button>'
      +'</div></div>'
      +'</div>';
    el('cmp-a-plus').onclick=function(){ numA=Math.min(999,numA+1); renderExplore(); };
    el('cmp-a-minus').onclick=function(){ numA=Math.max(0,numA-1); renderExplore(); };
    el('cmp-a-p10').onclick=function(){ numA=Math.min(999,numA+10); renderExplore(); };
    el('cmp-a-m10').onclick=function(){ numA=Math.max(0,numA-10); renderExplore(); };
    el('cmp-b-plus').onclick=function(){ numB=Math.min(999,numB+1); renderExplore(); };
    el('cmp-b-minus').onclick=function(){ numB=Math.max(0,numB-1); renderExplore(); };
    el('cmp-b-p10').onclick=function(){ numB=Math.min(999,numB+10); renderExplore(); };
    el('cmp-b-m10').onclick=function(){ numB=Math.max(0,numB-10); renderExplore(); };
  }

  if(mode==='explore'){
    renderExplore();
  } else {
    var variant='compare', chosenSymbol=null, pool=[], builtOrder=[], correctOrder=[];
    var SYM_MAP={gt:'>',lt:'<',eq:'='};

    function renderCompareChallenge(){
      var bh = barHeights(numA, numB);
      host.innerHTML='<div class="cmp-row">'
        +'<div class="cmp-bar-wrap"><div class="cmp-bar" style="height:'+bh.hA+'px">'+numA+'</div></div>'
        +'<div class="cmp-sym-btns">'
        +'<button class="cmp-sym-btn'+(chosenSymbol==='>'?' on':'')+'" data-s="gt">&gt;</button>'
        +'<button class="cmp-sym-btn'+(chosenSymbol==='<'?' on':'')+'" data-s="lt">&lt;</button>'
        +'<button class="cmp-sym-btn'+(chosenSymbol==='='?' on':'')+'" data-s="eq">=</button>'
        +'</div>'
        +'<div class="cmp-bar-wrap"><div class="cmp-bar" style="height:'+bh.hB+'px">'+numB+'</div></div>'
        +'</div>';
      Array.prototype.forEach.call(host.querySelectorAll('.cmp-sym-btn'),function(b){
        b.addEventListener('click',function(){
          chosenSymbol=SYM_MAP[b.getAttribute('data-s')];
          renderCompareChallenge();
        });
      });
    }

    function renderOrderChallenge(){
      host.innerHTML='<div class="order-pool">'+pool.map(function(p,i){
          return '<button class="order-tile'+(p.used?' used':'')+'" data-i="'+i+'"'+(p.used?' disabled':'')+'>'+p.value+'</button>';
        }).join('')+'</div>'
        +'<div class="order-slots">'+correctOrder.map(function(_,i){
          var filled = builtOrder[i]!=null;
          return '<div class="order-slot'+(filled?' filled':'')+'" data-slot="'+i+'" style="'+(filled?'cursor:pointer':'')+'" title="'+(filled?'Tap to remove':'')+'">'+(filled?builtOrder[i]:'?')+'</div>';
        }).join('')+'</div>'
        +'<div class="stat-row"><button class="btn btn-ghost" id="cmp-order-reset">Reset Order</button></div>';

      Array.prototype.forEach.call(host.querySelectorAll('.order-tile'),function(b){
        b.addEventListener('click',function(){
          var i=parseInt(b.getAttribute('data-i'),10);
          if(pool[i].used) return;
          pool[i].used=true;
          builtOrder.push(pool[i].value);
          renderOrderChallenge();
        });
      });

      Array.prototype.forEach.call(host.querySelectorAll('.order-slot.filled'),function(s){
        s.addEventListener('click',function(){
          var slotIdx=parseInt(s.getAttribute('data-slot'),10);
          var removedVal=builtOrder.splice(slotIdx,1)[0];
          pool.forEach(function(p){ if(p.value===removedVal) p.used=false; });
          renderOrderChallenge();
        });
      });

      el('cmp-order-reset').onclick=function(){
        pool.forEach(function(p){ p.used=false; });
        builtOrder=[];
        renderOrderChallenge();
      };
    }

    function newTarget(){
      variant=Math.random()<0.5?'compare':'order';
      if(variant==='compare'){
        numA=rand(1,99);
        numB=Math.random()<0.2?numA:rand(1,99);
        chosenSymbol=null;
        renderCompareChallenge();
      } else {
        var vals=[];
        while(vals.length<5){ var v=rand(1,99); if(vals.indexOf(v)===-1) vals.push(v); }
        correctOrder=vals.slice().sort(function(a,b){return a-b;});
        pool=shuffle(vals.slice()).map(function(v){ return {value:v,used:false}; });
        builtOrder=[];
        renderOrderChallenge();
      }
    }
    newTarget();
    buildChallengeBar(stage, function(){
      return variant==='compare'
        ? 'Choose the correct symbol to compare '+numA+' and '+numB+'.'
        : 'Tap the numbers in order, from smallest to largest.';
    }, function(){
      if(variant==='compare') return chosenSymbol===compareSymbol(numA,numB);
      return builtOrder.length===correctOrder.length && builtOrder.every(function(v,i){ return v===correctOrder[i]; });
    }, newTarget);
  }
}

/* ══════════════ 10b. COUNTING AND ORDINALS ══════════════ */
function mountCounting(stage, mode){
  var host=document.createElement('div');
  stage.appendChild(host);
  var theme='counter';
  var n=6;
  var countedOrder=[];
  var scatterOffsets=[];

  function buildScatterOffsets(count){
    var arr=[];
    for(var i=0;i<count;i++){
      arr.push({
        mt: rand(-6, 10),
        rot: rand(-12, 12)
      });
    }
    return arr;
  }

  function toggleCounted(idx){
    var pos=countedOrder.indexOf(idx);
    if(pos===-1){
      countedOrder.push(idx);
    } else {
      countedOrder.splice(pos,1);
    }
  }

  function renderScatterBox(totalCount){
    if(scatterOffsets.length!==totalCount) scatterOffsets=buildScatterOffsets(totalCount);
    var icons='';
    for(var i=0;i<totalCount;i++){
      var orderPos=countedOrder.indexOf(i);
      var isCounted=(orderPos!==-1);
      var off=scatterOffsets[i];
      icons+='<span class="scatter-item'+(isCounted?' counted':'')+'" data-idx="'+i+'" style="margin-top:'+off.mt+'px;transform:rotate('+off.rot+'deg)">'
        +objectIcon(theme)
        +(isCounted?'<span class="scatter-badge">'+(orderPos+1)+'</span>':'')
        +'</span>';
    }
    return '<div class="count-scatter">'+(icons || '<span style="color:#8896b3;font-size:13px">Tap + to add objects</span>')+'</div>';
  }

  function wireScatterClicks(rerenderFn){
    Array.prototype.forEach.call(host.querySelectorAll('.scatter-item'),function(s){
      s.addEventListener('click',function(){
        var idx=parseInt(s.getAttribute('data-idx'),10);
        toggleCounted(idx);
        rerenderFn();
      });
    });
  }

  function renderExplore(){
    host.innerHTML=objectThemePicker(theme)
      +renderScatterBox(n)
      +'<div style="font-size:12px;color:var(--muted);font-weight:700;text-align:center;margin-bottom:8px">Tap each object to count them one by one!</div>'
      +'<div class="stat-row">'
        +'<div class="stat-pill">Total Objects: '+n+'</div>'
        +'<div class="stat-pill" style="color:#15803d">Tapped: '+countedOrder.length+'</div>'
      +'</div>'
      +'<div class="ctrl-row">'
        +'<button class="step-btn minus" id="ct-minus" '+(n<=0?'disabled':'')+'>&minus;</button>'
        +'<button class="step-btn" id="ct-plus" '+(n>=20?'disabled':'')+'>+</button>'
        +'<button class="btn btn-ghost" id="ct-clear-taps" '+(countedOrder.length===0?'disabled':'')+'>Reset Taps</button>'
      +'</div>';

    wireThemePicker(host,function(id){ theme=id; renderExplore(); });
    wireScatterClicks(renderExplore);
    el('ct-plus').onclick=function(){ n=Math.min(20,n+1); scatterOffsets=buildScatterOffsets(n); renderExplore(); };
    el('ct-minus').onclick=function(){ n=Math.max(0,n-1); countedOrder=countedOrder.filter(function(i){return i<n;}); scatterOffsets=buildScatterOffsets(n); renderExplore(); };
    el('ct-clear-taps').onclick=function(){ countedOrder=[]; renderExplore(); };
  }

  function ordName(v){
    var s=['th','st','nd','rd'], m=v%100;
    return v+(s[(m-20)%10]||s[m]||s[0]);
  }

  if(mode==='explore'){
    scatterOffsets=buildScatterOffsets(n);
    renderExplore();
  } else {
    var variant='count', targetCount=0, ordinalTarget=0, ordinalCount=0, tappedIndex=null, revealOrdinals=false;

    function renderCountChallenge(savedVal){
      host.innerHTML=renderScatterBox(targetCount)
        +'<div style="font-size:12px;color:var(--muted);font-weight:700;text-align:center;margin-bottom:10px">Tip: Tap objects to mark them as you count!</div>'
        +'<div class="conv-row"><div class="conv-field"><div class="ctrl-label">How many?</div>'
        +'<input class="conv-input" type="number" id="ct-answer" placeholder="?" value="'+(savedVal||'')+'"></div></div>';

      wireScatterClicks(function(){
        var curInput=el('ct-answer') ? el('ct-answer').value : '';
        renderCountChallenge(curInput);
      });

      var inp=el('ct-answer');
      if(inp){
        inp.addEventListener('keydown',function(e){
          if(e.key==='Enter'){ var chk=el('chal-check'); if(chk) chk.click(); }
        });
      }
    }

    function renderOrdinal(){
      var row='';
      for(var i=0;i<ordinalCount;i++){
        var cls='ord-item';
        if(revealOrdinals){
          if(i===(ordinalTarget-1)) cls+=' reveal-right';
          else if(tappedIndex===i) cls+=' reveal-wrong';
        } else if(tappedIndex===i){
          cls+=' picked';
        }
        row+='<div class="'+cls+'" data-i="'+i+'">'
          +'<span style="font-size:28px">'+objectIcon(theme)+'</span>'
          +(revealOrdinals ? '<span class="ord-tag">'+ordName(i+1)+'</span>' : '')
          +'</div>';
      }
      host.innerHTML='<div style="font-size:12px;color:var(--muted);font-weight:700;text-align:center;margin-bottom:8px">Count from left (1st) to right</div>'
        +'<div class="ord-row">'+row+'</div>';
      Array.prototype.forEach.call(host.querySelectorAll('.ord-item'),function(s){
        s.addEventListener('click',function(){
          tappedIndex=parseInt(s.getAttribute('data-i'),10);
          revealOrdinals=false;
          renderOrdinal();
        });
      });
    }

    function newTarget(){
      variant=Math.random()<0.5?'count':'ordinal';
      tappedIndex=null;
      countedOrder=[];
      revealOrdinals=false;
      if(variant==='count'){
        targetCount=rand(4,20);
        scatterOffsets=buildScatterOffsets(targetCount);
        renderCountChallenge('');
      } else {
        ordinalCount=rand(5,10);
        ordinalTarget=rand(1,ordinalCount);
        renderOrdinal();
      }
    }
    newTarget();
    buildChallengeBar(stage, function(){
      return variant==='count'
        ? 'Count the objects and type how many there are.'
        : 'Tap the '+ordName(ordinalTarget)+' object in the row (starting from the left).';
    }, function(){
      if(variant==='count'){
        var v=parseInt(el('ct-answer').value,10);
        return !isNaN(v) && v===targetCount;
      }
      revealOrdinals=true;
      renderOrdinal();
      return tappedIndex===(ordinalTarget-1);
    }, newTarget);
  }
}

/* ══════════════ 11. FRACTIONS ══════════════ */
function mountFractions(stage, mode){
  var host=document.createElement('div');
  stage.appendChild(host);

  var showCompare=true;
  var denom1=2, shaded1=[];
  var denom2=4, shaded2=[];

  function initBar(which, d){
    var arr=[];
    for(var i=0;i<d;i++) arr.push(false);
    if(which===1){ denom1=d; shaded1=arr; }
    else { denom2=d; shaded2=arr; }
  }

  function countShaded(arr){ return arr.filter(Boolean).length; }

  function toggleSeg(arr, idx){
    var currentlyFilled = countShaded(arr);
    if(!arr[idx] && idx === currentlyFilled){
      arr[idx] = true;
    } else if(arr[idx] && idx === currentlyFilled - 1){
      arr[idx] = false;
    } else {
      for(var k=0;k<arr.length;k++){
        arr[k] = (k <= idx);
      }
    }
  }

  function barCardHtml(which, d, arr, isLocked, allowDenomChange){
    var n=countShaded(arr);
    var segs='';
    for(var i=0;i<d;i++){
      segs+='<div class="frac-seg'+(arr[i]?' shaded':'')+'" data-bar="'+which+'" data-i="'+i+'" style="'+(isLocked?'cursor:default':'')+'"></div>';
    }
    var pct=Math.round((n/d)*100);
    return '<div class="frac-row-card'+(isLocked?' ref-locked':'')+'">'
      +'<div class="frac-bar'+(which===2?' bar-b':'')+'">'+segs+'</div>'
      +'<div class="frac-meta">'
        +'<div class="frac-label" style="margin-top:0;font-size:22px">'+n+' / '+d+'</div>'
        +'<div class="frac-sub">('+pct+'% of whole)</div>'
        +(allowDenomChange
          ? '<div class="ctrl-btns">'
              +'<button class="step-btn minus" id="fr-d'+which+'-minus" '+(d<=2?'disabled':'')+'>&minus;</button>'
              +'<button class="step-btn" id="fr-d'+which+'-plus" '+(d>=12?'disabled':'')+'>+</button>'
            +'</div>'
          : '')
      +'</div>'
      +'</div>';
  }

  function render(opts){
    opts = opts || {};
    var lockBar1 = !!opts.lockBar1;
    var allowDenom1 = opts.allowDenom1 !== undefined ? opts.allowDenom1 : (mode==='explore');
    var allowDenom2 = opts.allowDenom2 !== undefined ? opts.allowDenom2 : (mode==='explore');

    var n1=countShaded(shaded1), n2=countShaded(shaded2);
    var v1=n1/denom1, v2=n2/denom2;
    var isEqual = Math.abs(v1 - v2) < 0.0001 && n1 > 0;
    var relSym = Math.abs(v1 - v2) < 0.0001 ? '=' : (v1 > v2 ? '>' : '<');

    var compareBadge = showCompare
      ? '<div class="frac-badge'+(isEqual?' eq':'')+'">'
        + n1+'/'+denom1 + ' ' + (relSym==='<'?'&lt;':(relSym==='>'?'&gt;':'=')) + ' ' + n2+'/'+denom2
        + (isEqual ? ' &nbsp; Equivalent!' : '')
        + '</div>'
      : '';

    var topToggle = mode==='explore'
      ? '<div class="stat-row" style="margin-top:0;margin-bottom:14px">'
        +'<button class="btn '+(showCompare?'btn-primary':'btn-ghost')+'" id="fr-toggle-cmp">'
          +(showCompare ? 'Hide Compare Bar' : '+ Compare Equivalent Bar')
        +'</button>'
        +'</div>'
      : '';

    host.innerHTML = topToggle
      +'<div class="frac-stack">'
      +barCardHtml(1, denom1, shaded1, lockBar1, allowDenom1)
      +(showCompare ? compareBadge + barCardHtml(2, denom2, shaded2, false, allowDenom2) : '')
      +'</div>';

    if(mode==='explore'){
      el('fr-toggle-cmp').onclick=function(){ showCompare=!showCompare; render(); };
    }

    Array.prototype.forEach.call(host.querySelectorAll('.frac-seg'),function(s){
      s.addEventListener('click',function(){
        var bar=parseInt(s.getAttribute('data-bar'),10);
        var idx=parseInt(s.getAttribute('data-i'),10);
        if(bar===1 && !lockBar1){
          toggleSeg(shaded1, idx);
          render(opts);
        } else if(bar===2){
          toggleSeg(shaded2, idx);
          render(opts);
        }
      });
    });

    if(allowDenom1){
      el('fr-d1-plus').onclick=function(){ if(denom1<12){ initBar(1, denom1+1); render(opts); } };
      el('fr-d1-minus').onclick=function(){ if(denom1>2){ initBar(1, denom1-1); render(opts); } };
    }
    if(showCompare && allowDenom2){
      el('fr-d2-plus').onclick=function(){ if(denom2<12){ initBar(2, denom2+1); render(opts); } };
      el('fr-d2-minus').onclick=function(){ if(denom2>2){ initBar(2, denom2-1); render(opts); } };
    }
  }

  initBar(1, 2);
  shaded1[0] = true;
  initBar(2, 4);
  shaded2[0] = true; shaded2[1] = true;
  render();

  if(mode==='challenge'){
    var chalVariant='shade', targetNum=0, targetDenom=0;
    var EQUIV_BASES=[
      {n:1, d:2, mults:[2,3,4,5,6]},
      {n:1, d:3, mults:[2,3,4]},
      {n:2, d:3, mults:[2,3,4]},
      {n:1, d:4, mults:[2,3]},
      {n:3, d:4, mults:[2,3]}
    ];

    function newTarget(){
      chalVariant = Math.random()<0.5 ? 'shade' : 'equiv';
      if(chalVariant==='shade'){
        showCompare=false;
        targetDenom=rand(2,8);
        targetNum=rand(1,targetDenom-1);
        initBar(1, targetDenom);
        render({lockBar1:false, allowDenom1:false});
      } else {
        showCompare=true;
        var base=EQUIV_BASES[rand(0,EQUIV_BASES.length-1)];
        targetNum=base.n;
        targetDenom=base.d;
        initBar(1, targetDenom);
        for(var k=0;k<targetNum;k++) shaded1[k]=true;
        var startD = targetDenom===2 ? 3 : 2;
        initBar(2, startD);
        render({lockBar1:true, allowDenom1:false, allowDenom2:true});
      }
    }
    newTarget();

    var barObj = buildChallengeBar(stage, function(){
      return chalVariant==='shade'
        ? 'Shade the bar to show '+targetNum+'/'+targetDenom+'.'
        : 'Use + or − on the bottom bar to slice it into different parts, then shade an equivalent fraction equal to '+targetNum+'/'+targetDenom+'.';
    }, function(){
      if(chalVariant==='shade'){
        return denom1===targetDenom && countShaded(shaded1)===targetNum;
      }
      var n2=countShaded(shaded2);
      return denom2 !== targetDenom && n2 > 0 && Math.abs((n2/denom2) - (targetNum/targetDenom)) < 0.0001;
    }, newTarget);

    el('chal-check').addEventListener('click', function(){
      if(chalVariant==='equiv'){
        var n2=countShaded(shaded2);
        if(denom2===targetDenom && n2===targetNum){
          barObj.feedback.textContent='That is the exact same fraction ('+targetNum+'/'+targetDenom+'). Change the number of parts on the bottom bar to make an equivalent fraction!';
        }
      }
    });
  }
}

/* ══════════════ 12. SHAPE SORTER ══════════════ */
var SHAPES=[
  {id:'circle',    name:'Circle',    sides:0, clue:'Like a coin, clock face, or bicycle wheel — 1 curved edge, 0 corners'},
  {id:'triangle',  name:'Triangle',  sides:3, clue:'Like a slice of pizza or a roof gable — 3 straight sides, 3 corners'},
  {id:'square',    name:'Square',    sides:4, clue:'Like a chessboard tile — 4 equal sides, 4 square corners'},
  {id:'rectangle', name:'Rectangle', sides:4, clue:'Like a door, book, or Naira note — 4 sides (opposite sides equal), 4 corners'},
  {id:'pentagon',  name:'Pentagon',  sides:5, clue:'Like the black panels on a football — 5 straight sides, 5 corners'},
  {id:'hexagon',   name:'Hexagon',   sides:6, clue:'Like a bee honeycomb cell — 6 straight sides, 6 corners'},
  {id:'heptagon',  name:'Heptagon',  sides:7, clue:'A 7-sided polygon — 7 straight sides, 7 corners'},
  {id:'octagon',   name:'Octagon',   sides:8, clue:'Like a red road STOP sign — 8 straight sides, 8 corners'}
];

function getShapeVertices(shapeId){
  if(shapeId==='circle') return [];
  if(shapeId==='rectangle'){
    return [
      {x:32,  y:56},
      {x:168, y:56},
      {x:168, y:144},
      {x:32,  y:144}
    ];
  }
  var shape=SHAPES.filter(function(s){return s.id===shapeId;})[0];
  var pts=[];
  var cx=100, cy=100, r=72;
  for(var i=0;i<shape.sides;i++){
    var a=(i*(360/shape.sides)-90)*Math.PI/180;
    pts.push({
      x: Math.round((cx+r*Math.cos(a))*10)/10,
      y: Math.round((cy+r*Math.sin(a))*10)/10
    });
  }
  return pts;
}

function shapeSvg(shapeId, opts){
  opts = opts || {};
  var activeCorners = opts.activeCorners || [];
  var activeSides   = opts.activeSides   || [];
  var interactive   = !!opts.interactive;
  var showAll       = !!opts.showAll;

  if(shapeId==='circle'){
    return '<svg id="shape-svg" viewBox="0 0 200 200" style="width:200px;height:200px;display:block;margin:0 auto 10px">'
      +'<circle cx="100" cy="100" r="72" fill="#fed7aa" stroke="#ea580c" stroke-width="4.5"/>'
      +(showAll ? '<text x="100" y="104" font-size="12" font-weight="800" fill="#9a3412" text-anchor="middle">0 straight sides • 0 corners</text>' : '')
      +'</svg>';
  }

  var verts=getShapeVertices(shapeId);
  var ptsStr=verts.map(function(v){ return v.x+','+v.y; }).join(' ');
  var edgesHtml='', cornersHtml='';

  for(var i=0;i<verts.length;i++){
    var a=verts[i], b=verts[(i+1)%verts.length];
    var isEdgeLit = showAll || activeSides.indexOf(i)!==-1;
    var midX=(a.x+b.x)/2, midY=(a.y+b.y)/2;
    var dx=midX-100, dy=midY-100;
    var dist=Math.sqrt(dx*dx+dy*dy)||1;
    var lx=midX+(dx/dist)*14;
    var ly=midY+(dy/dist)*14 + 4;

    edgesHtml+='<line x1="'+a.x+'" y1="'+a.y+'" x2="'+b.x+'" y2="'+b.y+'" '
      +'stroke="'+(isEdgeLit?'#2563eb':'#ea580c')+'" stroke-width="'+(isEdgeLit?6:4.5)+'" stroke-linecap="round"/>';

    if(interactive){
      edgesHtml+='<line x1="'+a.x+'" y1="'+a.y+'" x2="'+b.x+'" y2="'+b.y+'" '
        +'stroke="transparent" stroke-width="18" data-edge="'+i+'" style="cursor:pointer"/>';
    }
    if(isEdgeLit){
      var edgeLabel = showAll ? (i+1) : (activeSides.indexOf(i)+1);
      edgesHtml+='<circle cx="'+lx.toFixed(1)+'" cy="'+(ly-4).toFixed(1)+'" r="9" fill="#2563eb"/>'
        +'<text x="'+lx.toFixed(1)+'" y="'+ly.toFixed(1)+'" font-size="10.5" font-weight="800" fill="#fff" text-anchor="middle" style="pointer-events:none">'+edgeLabel+'</text>';
    }
  }

  for(var c=0;c<verts.length;c++){
    var v=verts[c];
    var isCornerLit = showAll || activeCorners.indexOf(c)!==-1;
    var vdx=v.x-100, vdy=v.y-100;
    var vdist=Math.sqrt(vdx*vdx+vdy*vdy)||1;
    var vx=v.x+(vdx/vdist)*15;
    var vy=v.y+(vdy/vdist)*15 + 3.5;

    cornersHtml+='<circle cx="'+v.x+'" cy="'+v.y+'" r="'+(isCornerLit?8:5.5)+'" '
      +'fill="'+(isCornerLit?'#16a34a':'#fff')+'" stroke="'+(isCornerLit?'#15803d':'#ea580c')+'" stroke-width="2.5" '
      +(interactive?'data-corner="'+c+'" style="cursor:pointer"':'')+'/>';

    if(isCornerLit){
      var cornerLabel = showAll ? (c+1) : (activeCorners.indexOf(c)+1);
      cornersHtml+='<text x="'+vx.toFixed(1)+'" y="'+vy.toFixed(1)+'" font-size="10.5" font-weight="800" fill="#15803d" text-anchor="middle" style="pointer-events:none">C'+cornerLabel+'</text>';
    }
  }

  return '<svg id="shape-svg" viewBox="0 0 200 200" style="width:200px;height:200px;display:block;margin:0 auto 10px;user-select:none">'
    +'<polygon points="'+ptsStr+'" fill="#fed7aa" stroke="none"/>'
    +edgesHtml
    +cornersHtml
    +'</svg>';
}

function shuffleArr(arr){
  for(var i=arr.length-1;i>0;i--){ var j=rand(0,i), t=arr[i]; arr[i]=arr[j]; arr[j]=t; }
  return arr;
}
function pickDistinctOptions(correctVal, pool, count){
  var opts=[correctVal];
  var tries=0;
  while(opts.length<count && tries<80){
    var v=pool[rand(0,pool.length-1)];
    if(opts.indexOf(v)===-1) opts.push(v);
    tries++;
  }
  return shuffleArr(opts);
}

function mountShapes(stage, mode){
  var host=document.createElement('div');
  stage.appendChild(host);
  var browseIdx=1;
  var activeCorners=[];
  var activeSides=[];
  var showAll=false;

  function resetHighlights(){
    activeCorners=[];
    activeSides=[];
    showAll=false;
  }

  function renderExplore(){
    var s=SHAPES[browseIdx];
    var isPolygon = s.sides > 0;

    var interactiveHint = isPolygon
      ? '<div style="font-size:12px;color:var(--muted);font-weight:700;text-align:center;margin-bottom:8px">Tap the <span style="color:#16a34a">corners</span> or <span style="color:#2563eb">sides</span> on the shape to count them!</div>'
      : '';

    var countPills = isPolygon
      ? '<div class="stat-pill" style="color:#2563eb">Sides Tapped: '+(showAll?s.sides:activeSides.length)+' / '+s.sides+'</div>'
        +'<div class="stat-pill" style="color:#16a34a">Corners Tapped: '+(showAll?s.sides:activeCorners.length)+' / '+s.sides+'</div>'
      : '<div class="stat-pill">0 straight sides • 0 corners</div>';

    host.innerHTML=shapeSvg(s.id, {
        activeCorners:activeCorners,
        activeSides:activeSides,
        interactive:isPolygon,
        showAll:showAll
      })
      +interactiveHint
      +'<div class="stat-row" style="margin-top:8px">'
        +'<div class="stat-pill" style="font-size:17px;color:#ea580c">'+s.name+'</div>'
        +countPills
      +'</div>'
      +'<div style="font-size:12.5px;color:var(--muted);text-align:center;margin:10px auto 0;max-width:440px;font-weight:600">'+s.clue+'</div>'
      +'<div class="ctrl-row">'
        +'<button class="btn btn-ghost" id="sh-prev">&larr; Prev</button>'
        +(isPolygon
          ? '<button class="btn '+(showAll?'btn-primary':'btn-ghost')+'" id="sh-toggle-all">'
              +(showAll ? 'Clear Highlights' : '✨ Highlight All Corners & Sides')
            +'</button>'
          : '')
        +'<button class="btn btn-ghost" id="sh-next">Next &rarr;</button>'
      +'</div>';

    if(isPolygon){
      Array.prototype.forEach.call(host.querySelectorAll('[data-corner]'),function(c){
        c.addEventListener('click',function(){
          showAll=false;
          var idx=parseInt(c.getAttribute('data-corner'),10);
          var pos=activeCorners.indexOf(idx);
          if(pos===-1) activeCorners.push(idx);
          else activeCorners.splice(pos,1);
          renderExplore();
        });
      });
      Array.prototype.forEach.call(host.querySelectorAll('[data-edge]'),function(e){
        e.addEventListener('click',function(){
          showAll=false;
          var idx=parseInt(e.getAttribute('data-edge'),10);
          var pos=activeSides.indexOf(idx);
          if(pos===-1) activeSides.push(idx);
          else activeSides.splice(pos,1);
          renderExplore();
        });
      });
      el('sh-toggle-all').onclick=function(){
        showAll=!showAll;
        if(!showAll){ activeCorners=[]; activeSides=[]; }
        renderExplore();
      };
    }

    el('sh-prev').onclick=function(){ browseIdx=(browseIdx+SHAPES.length-1)%SHAPES.length; resetHighlights(); renderExplore(); };
    el('sh-next').onclick=function(){ browseIdx=(browseIdx+1)%SHAPES.length; resetHighlights(); renderExplore(); };
  }

  if(mode==='explore'){
    renderExplore();
  } else {
    var variant='name', current=null, options=[], selectedOpt=null, revealShape=false;

    function renderChallenge(){
      var html=shapeSvg(current.id, {showAll:revealShape})+'<div class="shape-opts">';
      options.forEach(function(opt){
        html+='<button class="shape-opt-btn'+(selectedOpt===opt?' on':'')+'" data-v="'+opt+'">'+opt+'</button>';
      });
      html+='</div>';
      host.innerHTML=html;
      Array.prototype.forEach.call(host.querySelectorAll('.shape-opt-btn'),function(b){
        b.addEventListener('click',function(){
          selectedOpt=b.getAttribute('data-v');
          renderChallenge();
        });
      });
    }

    function newTarget(){
      var pick=rand(1,3);
      variant = pick===1 ? 'name' : (pick===2 ? 'sides' : 'corners');
      current=SHAPES[rand(0,SHAPES.length-1)];
      selectedOpt=null;
      revealShape=false;
      if(variant==='name'){
        options=pickDistinctOptions(current.name, SHAPES.map(function(s){return s.name;}), 4);
      } else {
        options=pickDistinctOptions(current.sides, SHAPES.map(function(s){return s.sides;}), 4).map(String);
      }
      renderChallenge();
    }
    newTarget();

    buildChallengeBar(stage, function(){
      if(variant==='name') return 'What is the name of this shape?';
      if(variant==='sides') return 'How many sides does this shape have?';
      return 'How many corners (vertices) does this shape have?';
    }, function(){
      if(selectedOpt==null) return false;
      revealShape=true;
      renderChallenge();
      return variant==='name' ? selectedOpt===current.name : parseInt(selectedOpt,10)===current.sides;
    }, newTarget);
  }
}

/* ══════════════ 13. MEASURING RULER ══════════════ */
function mountRuler(stage, mode){
  var host=document.createElement('div');
  stage.appendChild(host);
  var MAXCM=20;
  var startCm=0;
  var lengthCm=7.5;
  var objKind='pencil';

  var OBJECTS=[
    {id:'pencil',      label:'Pencil',      icon:'✏️'},
    {id:'crayon',      label:'Crayon',      icon:'🖍️'},
    {id:'key',         label:'Key',         icon:'🔑'},
    {id:'caterpillar', label:'Caterpillar', icon:'🐛'}
  ];

  function drawObjectSvg(kind, x0, x1, baseY){
    var w=Math.max(12, x1-x0);
    if(kind==='pencil'){
      var tipW=Math.min(18, w*0.25);
      var eraserW=Math.min(14, w*0.18);
      var bodyX=x0+eraserW;
      var bodyW=Math.max(2, w-eraserW-tipW);
      var tipX=bodyX+bodyW;
      var midY=baseY-11;
      return '<g>'
        +'<rect x="'+x0+'" y="'+(baseY-18)+'" width="'+eraserW+'" height="14" rx="3" fill="#f472b6" stroke="#be185d" stroke-width="1.5"/>'
        +'<rect x="'+(x0+eraserW-4)+'" y="'+(baseY-18)+'" width="5" height="14" fill="#cbd5e1" stroke="#64748b" stroke-width="1"/>'
        +'<rect x="'+bodyX+'" y="'+(baseY-18)+'" width="'+bodyW+'" height="14" fill="#facc15" stroke="#ca8a04" stroke-width="1.5"/>'
        +'<line x1="'+bodyX+'" y1="'+(baseY-13)+'" x2="'+(bodyX+bodyW)+'" y2="'+(baseY-13)+'" stroke="#eab308" stroke-width="1"/>'
        +'<line x1="'+bodyX+'" y1="'+(baseY-9)+'" x2="'+(bodyX+bodyW)+'" y2="'+(baseY-9)+'" stroke="#eab308" stroke-width="1"/>'
        +'<polygon points="'+tipX+','+(baseY-18)+' '+x1+','+midY+' '+tipX+','+(baseY-4)+'" fill="#fed7aa" stroke="#c2410c" stroke-width="1.5" stroke-linejoin="round"/>'
        +'<polygon points="'+(x1-tipW*0.38)+','+(midY-2.6)+' '+x1+','+midY+' '+(x1-tipW*0.38)+','+(midY+2.6)+'" fill="#1e293b"/>'
        +'</g>';
    }
    if(kind==='crayon'){
      var noseW=Math.min(14, w*0.22);
      var bodyW2=Math.max(4, w-noseW);
      return '<g>'
        +'<rect x="'+x0+'" y="'+(baseY-19)+'" width="'+bodyW2+'" height="16" rx="2" fill="#38bdf8" stroke="#0284c7" stroke-width="1.5"/>'
        +'<rect x="'+(x0+Math.min(8,bodyW2*0.18))+'" y="'+(baseY-19)+'" width="'+Math.max(2,bodyW2*0.64)+'" height="16" fill="#bae6fd" stroke="#0284c7" stroke-width="1"/>'
        +'<polygon points="'+(x0+bodyW2)+','+(baseY-17)+' '+x1+','+(baseY-13)+' '+x1+','+(baseY-9)+' '+(x0+bodyW2)+','+(baseY-5)+'" fill="#38bdf8" stroke="#0284c7" stroke-width="1.5" stroke-linejoin="round"/>'
        +'</g>';
    }
    if(kind==='key'){
      var bowR=9;
      var bowCx=x0+bowR;
      var shaftStart=Math.min(x1-4, x0+bowR*2-2);
      var shaftW=Math.max(2, x1-shaftStart);
      return '<g>'
        +'<circle cx="'+bowCx+'" cy="'+(baseY-12)+'" r="'+bowR+'" fill="#fbbf24" stroke="#b45309" stroke-width="2"/>'
        +'<circle cx="'+bowCx+'" cy="'+(baseY-12)+'" r="3.5" fill="#fff" stroke="#b45309" stroke-width="1.5"/>'
        +'<rect x="'+shaftStart+'" y="'+(baseY-14.5)+'" width="'+shaftW+'" height="5" rx="1.5" fill="#fbbf24" stroke="#b45309" stroke-width="1.5"/>'
        +(shaftW>12 ? '<rect x="'+(x1-10)+'" y="'+(baseY-9.5)+'" width="3.5" height="5" fill="#fbbf24" stroke="#b45309" stroke-width="1.2"/>' : '')
        +(shaftW>6 ? '<rect x="'+(x1-4.5)+'" y="'+(baseY-9.5)+'" width="3.5" height="6.5" fill="#fbbf24" stroke="#b45309" stroke-width="1.2"/>' : '')
        +'</g>';
    }
    var segCount=Math.max(2, Math.round(w/14));
    var rSeg=Math.min(9, w/(segCount*1.4));
    var segs='';
    for(var i=0;i<segCount;i++){
      var t=segCount===1?0.5:i/(segCount-1);
      var cx=x0+rSeg + t*(w-rSeg*2);
      var isHead=(i===segCount-1);
      segs+='<circle cx="'+cx+'" cy="'+(baseY-rSeg-2)+'" r="'+rSeg+'" fill="'+(isHead?'#16a34a':'#4ade80')+'" stroke="#15803d" stroke-width="1.5"/>';
      if(isHead){
        segs+='<circle cx="'+(cx+rSeg*0.35)+'" cy="'+(baseY-rSeg-4)+'" r="1.6" fill="#fff"/>'
             +'<circle cx="'+(cx+rSeg*0.42)+'" cy="'+(baseY-rSeg-4)+'" r="0.8" fill="#0f172a"/>';
      }
    }
    return '<g>'+segs+'</g>';
  }

  function rulerSvg(sCm, lenCm, kind){
    var w=680, h=148, padding=24, usable=w-padding*2;
    var pxPerCm=usable/MAXCM;
    var rulerTop=62;
    var rulerH=54;
    var xStart=padding + sCm*pxPerCm;
    var xEnd=padding + (sCm+lenCm)*pxPerCm;

    var ticks='';
    for(var mm=0; mm<=MAXCM*10; mm++){
      var cmPos=mm/10;
      var x=padding+cmPos*pxPerCm;
      var isCm=mm%10===0;
      var isHalf=mm%5===0;
      var tickH=isCm?25:(isHalf?17:10);
      ticks+='<line x1="'+x+'" y1="'+rulerTop+'" x2="'+x+'" y2="'+(rulerTop+tickH)+'" stroke="'+(isCm?'#334155':'#94a3b8')+'" stroke-width="'+(isCm?2:1)+'"/>';
      if(isCm){
        ticks+='<text x="'+x+'" y="'+(rulerTop+tickH+16)+'" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">'+cmPos+'</text>';
      }
    }

    var guides='<line x1="'+xStart+'" y1="24" x2="'+xStart+'" y2="'+(rulerTop+18)+'" stroke="#e5484d" stroke-width="1.8" stroke-dasharray="3,3"/>'
      +'<line x1="'+xEnd+'" y1="24" x2="'+xEnd+'" y2="'+(rulerTop+18)+'" stroke="#0d9488" stroke-width="1.8" stroke-dasharray="3,3"/>';

    return '<svg id="ruler-svg" viewBox="0 0 '+w+' '+h+'">'
      +drawObjectSvg(kind, xStart, xEnd, rulerTop-4)
      +'<rect x="'+(padding-8)+'" y="'+rulerTop+'" width="'+(usable+16)+'" height="'+rulerH+'" rx="6" fill="#fefce8" stroke="#0d9488" stroke-width="2"/>'
      +ticks
      +guides
      +'<text x="'+(padding+usable-4)+'" y="'+(rulerTop+rulerH-6)+'" font-size="10" font-weight="800" fill="#0d9488" text-anchor="end">cm</text>'
      +'</svg>';
  }

  function renderExplore(){
    var endCm=Math.round((startCm+lengthCm)*10)/10;
    var picker='<div class="theme-row">'+OBJECTS.map(function(o){
      return '<button class="theme-btn'+(o.id===objKind?' on':'')+'" data-obj="'+o.id+'" title="'+o.label+'">'+o.icon+'</button>';
    }).join('')+'</div>';

    var formulaPill = startCm===0
      ? '<div class="stat-pill" style="color:#0d9488">Length: '+lengthCm+' cm</div>'
      : '<div class="stat-pill" style="color:#0d9488">End '+endCm+' cm &minus; Start '+startCm+' cm = <strong>'+lengthCm+' cm</strong></div>';

    host.innerHTML=picker
      +rulerSvg(startCm, lengthCm, objKind)
      +'<div class="stat-row">'
        +'<div class="stat-pill">Start: '+startCm+' cm</div>'
        +'<div class="stat-pill">End: '+endCm+' cm</div>'
        +formulaPill
      +'</div>'
      +'<div class="ctrl-row">'
        +'<div class="ctrl-group"><div class="ctrl-label">Start Position</div><div class="ctrl-btns">'
          +'<button class="step-btn minus" id="ru-s-minus" '+(startCm<=0?'disabled':'')+'>&minus;</button>'
          +'<button class="step-btn" id="ru-s-plus" '+(startCm+lengthCm>=MAXCM?'disabled':'')+'>+</button>'
        +'</div></div>'
        +'<div class="ctrl-group"><div class="ctrl-label">Object Length</div><div class="ctrl-btns">'
          +'<button class="step-btn minus" id="ru-l-minus" '+(lengthCm<=1?'disabled':'')+'>&minus;</button>'
          +'<button class="step-btn" id="ru-l-plus" '+(startCm+lengthCm>=MAXCM?'disabled':'')+'>+</button>'
        +'</div></div>'
      +'</div>';

    Array.prototype.forEach.call(host.querySelectorAll('[data-obj]'),function(b){
      b.addEventListener('click',function(){ objKind=b.getAttribute('data-obj'); renderExplore(); });
    });
    el('ru-s-plus').onclick=function(){ if(startCm+lengthCm+0.5<=MAXCM){ startCm=Math.round((startCm+0.5)*10)/10; renderExplore(); } };
    el('ru-s-minus').onclick=function(){ if(startCm>=0.5){ startCm=Math.round((startCm-0.5)*10)/10; renderExplore(); } };
    el('ru-l-plus').onclick=function(){ if(startCm+lengthCm+0.5<=MAXCM){ lengthCm=Math.round((lengthCm+0.5)*10)/10; renderExplore(); } };
    el('ru-l-minus').onclick=function(){ if(lengthCm>=1.5){ lengthCm=Math.round((lengthCm-0.5)*10)/10; renderExplore(); } };
  }

  if(mode==='explore'){
    renderExplore();
  } else {
    var target=0, chalStart=0, chalObj='pencil';
    function renderChallenge(){
      host.innerHTML=rulerSvg(chalStart, target, chalObj)
        +'<div class="conv-row"><div class="conv-field"><div class="ctrl-label">Length (cm)</div>'
        +'<input class="conv-input" type="number" step="0.5" id="ru-answer" placeholder="?"></div></div>';
      var inp=el('ru-answer');
      if(inp){
        inp.addEventListener('keydown',function(e){
          if(e.key==='Enter'){ var chk=el('chal-check'); if(chk) chk.click(); }
        });
      }
    }
    function newTarget(){
      chalObj=OBJECTS[rand(0,OBJECTS.length-1)].id;
      var shifted=Math.random()<0.5;
      chalStart = shifted ? rand(1,12)/2 : 0;
      var maxLenHalf = Math.floor((MAXCM - chalStart)*2);
      target = rand(3, Math.min(26, maxLenHalf))/2;
      renderChallenge();
    }
    newTarget();
    var barObj = buildChallengeBar(stage, function(){
      var objLabel=OBJECTS.filter(function(o){return o.id===chalObj;})[0].label.toLowerCase();
      return chalStart===0
        ? 'Measure the '+objLabel+' and type its length in centimetres.'
        : 'Look closely at where the '+objLabel+' starts and ends! How long is it in centimetres?';
    }, function(){
      var v=parseFloat(el('ru-answer').value);
      return !isNaN(v) && Math.abs(v-target)<0.05;
    }, newTarget);

    el('chal-check').addEventListener('click',function(){
      var v=parseFloat(el('ru-answer').value);
      var endPos=Math.round((chalStart+target)*10)/10;
      if(!isNaN(v) && chalStart>0 && Math.abs(v-endPos)<0.05){
        barObj.feedback.textContent='Careful! It ends at '+endPos+' cm, but it started at '+chalStart+' cm. Subtract '+endPos+' − '+chalStart+'!';
      }
    });
  }
}

/* ══════════════ 14. DATA AND GRAPHS ══════════════ */
function mountDataBar(stage, mode){
  var host=document.createElement('div');
  stage.appendChild(host);
  var CATS=[
    {label:'Apples',  icon:'\u{1F34E}', color:'#e5484d'},
    {label:'Bananas', icon:'\u{1F34C}', color:'#eab308'},
    {label:'Oranges', icon:'\u{1F34A}', color:'#f97316'}
  ];
  var tally=[6, 4, 8];
  var bars=[0, 0, 0];
  var showTallyNums=true;

  function tallySvg(count){
    if(count<=0) return '<span style="color:#94a3b8;font-size:12px">0</span>';
    var groups=Math.ceil(count/5);
    var groupW=34, gap=10, h=26;
    var totalW=groups*groupW + (groups-1)*gap;
    var svg='<svg width="'+totalW+'" height="'+h+'" viewBox="0 0 '+totalW+' '+h+'" style="display:block">';
    var rem=count;
    for(var g=0; g<groups; g++){
      var ox=g*(groupW+gap);
      var strokes=Math.min(4, rem);
      for(var s=0; s<strokes; s++){
        var sx=ox + 4 + s*7;
        svg+='<line x1="'+sx+'" y1="3" x2="'+sx+'" y2="23" stroke="#233047" stroke-width="2.6" stroke-linecap="round"/>';
      }
      if(rem>=5){
        svg+='<line x1="'+(ox+1)+'" y1="20" x2="'+(ox+28)+'" y2="6" stroke="#e5484d" stroke-width="2.6" stroke-linecap="round"/>';
      }
      rem-=Math.min(5, rem);
    }
    svg+='</svg>';
    return svg;
  }

  function renderInteractive(allowEditBars, showCounts){
    var tallyHtml=CATS.map(function(c,i){
      return '<div class="tally-line">'
        +'<div class="tally-label"><span>'+c.icon+'</span><span>'+c.label+'</span></div>'
        +'<div class="tally-strokes">'+tallySvg(tally[i])+'</div>'
        +(showCounts ? '<div class="tally-count-pill">'+tally[i]+'</div>' : '')
        +'</div>';
    }).join('');

    var barsHtml=CATS.map(function(c,i){
      var hPx=bars[i]*16;
      return '<div class="bar-col">'
        +'<div class="bar-rect" style="height:'+hPx+'px;background:'+c.color+'">'+(bars[i]>0?bars[i]:'')+'</div>'
        +'<div class="bar-lbl">'+c.label+'</div>'
        +(allowEditBars
          ? '<div class="ctrl-btns">'
              +'<button class="step-btn minus" id="db-minus-'+i+'" '+(bars[i]<=0?'disabled':'')+'>&minus;</button>'
              +'<button class="step-btn" id="db-plus-'+i+'" '+(bars[i]>=10?'disabled':'')+'>+</button>'
            +'</div>'
          : '')
        +'</div>';
    }).join('');

    var exploreControls = mode==='explore'
      ? '<div class="stat-row">'
          +'<button class="btn btn-ghost" id="db-new">New Tally Data</button>'
          +'<button class="btn '+(showTallyNums?'btn-ghost':'btn-primary')+'" id="db-hide-nums">'
            +(showTallyNums ? 'Hide Tally Numbers (Practice 5s)' : 'Show Tally Numbers')
          +'</button>'
        +'</div>'
      : '';

    host.innerHTML='<div class="tally-card">'+tallyHtml+'</div>'
      +'<div class="bar-chart-wrap"><div class="bar-chart">'+barsHtml+'</div></div>'
      +exploreControls;

    if(allowEditBars){
      CATS.forEach(function(c,i){
        el('db-plus-'+i).onclick=function(){ bars[i]=Math.min(10,bars[i]+1); renderInteractive(allowEditBars, showCounts); };
        el('db-minus-'+i).onclick=function(){ bars[i]=Math.max(0,bars[i]-1); renderInteractive(allowEditBars, showCounts); };
      });
    }
    if(mode==='explore'){
      el('db-new').onclick=function(){ tally=CATS.map(function(){return rand(1,9);}); bars=[0,0,0]; renderInteractive(true, showTallyNums); };
      el('db-hide-nums').onclick=function(){ showTallyNums=!showTallyNums; renderInteractive(true, showTallyNums); };
    }
  }

  if(mode==='explore'){
    renderInteractive(true, showTallyNums);
  } else {
    var chalVariant='build';
    var selectedCat=null;
    var diffIdxA=0, diffIdxB=1, expectedAnswer=0;

    function distinctTally(){
      var pool=[1,2,3,4,5,6,7,8,9];
      shuffleArr(pool);
      return [pool[0], pool[1], pool[2]];
    }

    function renderReadChallenge(){
      bars = tally.slice();
      renderInteractive(false, false);

      var extraHtml='';
      if(chalVariant==='most'){
        extraHtml='<div class="shape-opts" style="margin-top:14px">'
          +CATS.map(function(c,i){
            return '<button class="shape-opt-btn'+(selectedCat===i?' on':'')+'" data-ci="'+i+'">'+c.icon+' '+c.label+'</button>';
          }).join('')
          +'</div>';
      } else {
        extraHtml='<div class="conv-row" style="margin-top:14px">'
          +'<div class="conv-field"><div class="ctrl-label">Your Answer</div>'
          +'<input class="conv-input" type="number" id="db-num-ans" placeholder="?"></div>'
          +'</div>';
      }
      var wrap=document.createElement('div');
      wrap.innerHTML=extraHtml;
      host.appendChild(wrap);

      if(chalVariant==='most'){
        Array.prototype.forEach.call(host.querySelectorAll('[data-ci]'),function(b){
          b.addEventListener('click',function(){
            selectedCat=parseInt(b.getAttribute('data-ci'),10);
            renderReadChallenge();
          });
        });
      } else {
        var inp=el('db-num-ans');
        if(inp){
          inp.addEventListener('keydown',function(e){
            if(e.key==='Enter'){ var chk=el('chal-check'); if(chk) chk.click(); }
          });
        }
      }
    }

    function newTarget(){
      var pick=rand(1,3);
      chalVariant = pick===1 ? 'build' : (pick===2 ? 'most' : 'diff');
      tally = distinctTally();
      selectedCat = null;

      if(chalVariant==='build'){
        bars=[0,0,0];
        renderInteractive(true, false);
      } else if(chalVariant==='most'){
        var maxVal=Math.max.apply(null, tally);
        expectedAnswer=tally.indexOf(maxVal);
        renderReadChallenge();
      } else {
        var idxs=[0,1,2];
        shuffleArr(idxs);
        if(tally[idxs[0]] > tally[idxs[1]]){
          diffIdxA=idxs[0]; diffIdxB=idxs[1];
        } else {
          diffIdxA=idxs[1]; diffIdxB=idxs[0];
        }
        expectedAnswer = tally[diffIdxA] - tally[diffIdxB];
        renderReadChallenge();
      }
    }
    newTarget();

    buildChallengeBar(stage, function(){
      if(chalVariant==='build'){
        return 'Count the tally marks (remember each crossed bundle is 5!) and build the matching bar graph.';
      }
      if(chalVariant==='most'){
        return 'Look at the tally marks and bar graph. Which fruit has the MOST?';
      }
      return 'How many MORE '+CATS[diffIdxA].label.toLowerCase()+' are there than '+CATS[diffIdxB].label.toLowerCase()+'?';
    }, function(){
      if(chalVariant==='build'){
        return bars.every(function(b,i){ return b===tally[i]; });
      }
      if(chalVariant==='most'){
        return selectedCat===expectedAnswer;
      }
      var v=parseInt(el('db-num-ans').value,10);
      return !isNaN(v) && v===expectedAnswer;
    }, newTarget);
  }
}
