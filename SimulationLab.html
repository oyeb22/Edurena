    Array.prototype.forEach.call(host.querySelectorAll('.coin-row .coin-btn,.coin-row .note-btn'),function(b){
      b.addEventListener('click',function(){
        purse.push({id:++seq, value:parseInt(b.getAttribute('data-v'),10)});
        render();
      });
    });

    Array.prototype.forEach.call(host.querySelectorAll('.purse-item'),function(p){
      p.addEventListener('click',function(){
        var id=parseInt(p.getAttribute('data-id'),10);
        purse=purse.filter(function(x){return x.id!==id;});
        render();
      });
    });

    el('money-clear').onclick=function(){ purse=[]; render(); };
  }
  render();

  if(mode==='challenge'){
    var variant='make', changePrice=0, changePayment=0, changeItem=SHOP_ITEMS[0];
    function newTarget(){
      variant=Math.random()<0.5?'make':'change';
      purse=[];
      if(variant==='make'){
        target=rand(5,300);
      } else {
        var payOptions=DENOMS.filter(function(v){ return v>=50; });
        changePayment=payOptions[rand(0,payOptions.length-1)];
        changeItem=SHOP_ITEMS[rand(0,SHOP_ITEMS.length-1)];
        changePrice=rand(1,changePayment-1);
        target=changePayment-changePrice;
      }
      render();
    }
    newTarget();

    var barObj = buildChallengeBar(stage, function(){
      return variant==='make'
        ? 'Make exactly ₦'+target+' using any coins and notes.'
        : 'A '+changeItem.name.toLowerCase()+' '+changeItem.icon+' costs ₦'+changePrice+'. The customer pays with a ₦'+changePayment+' note. Put the correct change in the purse.';
    }, function(){ return total()===target; }, newTarget);

    el('chal-check').addEventListener('click',function(){
      var cur=total();
      if(cur!==target){
        var diff=Math.abs(cur-target);
        if(variant==='change'){
          barObj.feedback.textContent = cur < target
            ? 'You put ₦'+cur+' in the purse — that is ₦'+diff+' short! (Hint: ₦'+changePayment+' − ₦'+changePrice+' = ₦'+target+')'
            : 'You put ₦'+cur+' in the purse — that is ₦'+diff+' too much! Tap a coin or note inside the purse to remove it.';
        } else {
          barObj.feedback.textContent = cur < target
            ? 'You have ₦'+cur+' — add ₦'+diff+' more to reach ₦'+target+'.'
            : 'You have ₦'+cur+' — remove ₦'+diff+' to reach ₦'+target+'.';
        }
      }
    });
  }
}

/* ══════════════ 6. GEOBOARD ══════════════ */
function mountGeoboard(stage, mode){
  var GRID=6;
  var spacing=64, pad=24;
  var picked=[];
  var warnMsg='';
  var host=document.createElement('div');
  stage.appendChild(host);
  var target=null;

  function shoelaceArea(pts){
    if(pts.length<3) return 0;
    var sum=0;
    for(var i=0;i<pts.length;i++){
      var a=pts[i], b=pts[(i+1)%pts.length];
      sum += a.x*b.y - b.x*a.y;
    }
    return Math.abs(sum)/2;
  }

  function perimeter(pts){
    if(pts.length<2) return 0;
    var sum=0;
    var n=pts.length;
    var loopCount = pts.length>=3 ? n : n-1;
    for(var i=0;i<loopCount;i++){
      var a=pts[i], b=pts[(i+1)%n];
      sum += Math.sqrt(Math.pow(a.x-b.x,2)+Math.pow(a.y-b.y,2));
    }
    return sum;
  }

  function ccw(A,B,C){ return (C.y-A.y)*(B.x-A.x) > (B.y-A.y)*(C.x-A.x); }
  function properIntersect(A,B,C,D){
    if((A.x===C.x&&A.y===C.y)||(A.x===D.x&&A.y===D.y)||(B.x===C.x&&B.y===C.y)||(B.x===D.x&&B.y===D.y)) return false;
    return (ccw(A,C,D) !== ccw(B,C,D)) && (ccw(A,B,C) !== ccw(A,B,D));
  }
  function wouldSelfIntersect(newPt){
    var n=picked.length;
    if(n<2) return false;
    var last=picked[n-1];
    for(var i=0;i<n-1;i++){
      if(properIntersect(last, newPt, picked[i], picked[i+1])) return true;
    }
    if(n>=2){
      for(var j=0;j<n-1;j++){
        if(properIntersect(newPt, picked[0], picked[j], picked[j+1])) return true;
      }
    }
    return false;
  }

  function svg(){
    var size=pad*2+spacing*(GRID-1);
    var gridLines='', polyFill='', lines='', pegs='';

    for(var g=0;g<GRID;g++){
      var pos=pad+g*spacing;
      var endPos=pad+(GRID-1)*spacing;
      gridLines+='<line x1="'+pos+'" y1="'+pad+'" x2="'+pos+'" y2="'+endPos+'" stroke="#e2e8f0" stroke-width="1.5"/>';
      gridLines+='<line x1="'+pad+'" y1="'+pos+'" x2="'+endPos+'" y2="'+pos+'" stroke="#e2e8f0" stroke-width="1.5"/>';
    }

    if(picked.length>=3){
      var ptsStr=picked.map(function(p){ return (pad+p.x*spacing)+','+(pad+p.y*spacing); }).join(' ');
      polyFill+='<defs><clipPath id="geo-clip"><polygon points="'+ptsStr+'"/></clipPath></defs>';
      polyFill+='<polygon points="'+ptsStr+'" fill="rgba(168,85,247,0.22)"/>';
      var clippedGrid='';
      for(var cg=0;cg<GRID;cg++){
        var cpos=pad+cg*spacing;
        var cend=pad+(GRID-1)*spacing;
        clippedGrid+='<line x1="'+cpos+'" y1="'+pad+'" x2="'+cpos+'" y2="'+cend+'" stroke="#a855f7" stroke-opacity="0.45" stroke-width="1.5"/>';
        clippedGrid+='<line x1="'+pad+'" y1="'+cpos+'" x2="'+cend+'" y2="'+cpos+'" stroke="#a855f7" stroke-opacity="0.45" stroke-width="1.5"/>';
      }
      polyFill+='<g clip-path="url(#geo-clip)">'+clippedGrid+'</g>';
    }

    for(var i=0;i<picked.length-1;i++){
      var a=picked[i], b=picked[i+1];
      lines+='<line x1="'+(pad+a.x*spacing)+'" y1="'+(pad+a.y*spacing)+'" x2="'+(pad+b.x*spacing)+'" y2="'+(pad+b.y*spacing)+'" stroke="#7c3aed" stroke-width="3.5" stroke-linecap="round"/>';
    }
    if(picked.length>=3){
      var f=picked[0], l=picked[picked.length-1];
      lines+='<line x1="'+(pad+l.x*spacing)+'" y1="'+(pad+l.y*spacing)+'" x2="'+(pad+f.x*spacing)+'" y2="'+(pad+f.y*spacing)+'" stroke="#7c3aed" stroke-width="3" stroke-dasharray="6,4" stroke-linecap="round"/>';
    }

    for(var gy=0;gy<GRID;gy++){
      for(var gx=0;gx<GRID;gx++){
        var px=pad+gx*spacing, py=pad+gy*spacing;
        var idx=picked.map(function(p){return p.x+'_'+p.y;}).indexOf(gx+'_'+gy);
        var cls='geo-peg'+(idx===0?' first':(idx>0?' selected':''));
        pegs+='<circle class="'+cls+'" cx="'+px+'" cy="'+py+'" r="8" data-x="'+gx+'" data-y="'+gy+'"/>';
      }
    }

    return '<svg id="geo-svg" viewBox="0 0 '+size+' '+size+'">'+gridLines+polyFill+lines+pegs+'</svg>';
  }

  function render(){
    var area=picked.length>=3?shoelaceArea(picked):0;
    var perim=picked.length>=2?perimeter(picked):0;
    var areaStr = picked.length>=3 ? (Number.isInteger(area)?area:area.toFixed(1))+' sq units' : '—';

    var presetsHtml = mode==='explore'
      ? '<div class="ctrl-row" style="margin-bottom:10px">'
          +'<button class="btn btn-ghost" id="geo-pre-sq">Square (4 sq units)</button>'
          +'<button class="btn btn-ghost" id="geo-pre-rect">Rectangle (6 sq units)</button>'
          +'<button class="btn btn-ghost" id="geo-pre-tri">Triangle (4.5 sq units)</button>'
        +'</div>'
      : '';

    var warnHtml = warnMsg
      ? '<div style="color:#e5484d;font-size:12.5px;font-weight:700;text-align:center;margin-top:8px">'+warnMsg+'</div>'
      : '';

    host.innerHTML=presetsHtml
      +svg()
      +warnHtml
      +'<div class="stat-row"><div class="stat-pill">Corners: '+picked.length+'</div>'
      +'<div class="stat-pill" style="color:#7c3aed">Area: '+areaStr+'</div>'
      +'<div class="stat-pill">Perimeter: '+(picked.length>=2?perim.toFixed(1)+' units':'—')+'</div></div>'
      +'<div class="stat-row">'
        +'<button class="btn btn-ghost" id="geo-undo" '+(picked.length===0?'disabled':'')+'>Undo Peg</button>'
        +'<button class="btn btn-ghost" id="geo-clear" '+(picked.length===0?'disabled':'')+'>Clear Shape</button>'
      +'</div>'
      +'<div style="font-size:12px;color:#8896b3;text-align:center;margin-top:8px">Tap pegs in order around your shape. Count the shaded grid squares inside to see the area!</div>';

    Array.prototype.forEach.call(host.querySelectorAll('.geo-peg'),function(p){
      p.addEventListener('click',function(){
        var x=parseInt(p.getAttribute('data-x'),10), y=parseInt(p.getAttribute('data-y'),10);
        var already=picked.some(function(pt){return pt.x===x&&pt.y===y;});
        if(already) return;
        if(wouldSelfIntersect({x:x,y:y})){
          warnMsg='Lines cannot cross over each other—pick a peg around the outside edge!';
          render();
          return;
        }
        warnMsg='';
        picked.push({x:x,y:y});
        render();
      });
    });

    el('geo-undo').onclick=function(){ warnMsg=''; picked.pop(); render(); };
    el('geo-clear').onclick=function(){ warnMsg=''; picked=[]; render(); };

    if(mode==='explore'){
      el('geo-pre-sq').onclick=function(){ warnMsg=''; picked=[{x:1,y:1},{x:3,y:1},{x:3,y:3},{x:1,y:3}]; render(); };
      el('geo-pre-rect').onclick=function(){ warnMsg=''; picked=[{x:1,y:1},{x:4,y:1},{x:4,y:3},{x:1,y:3}]; render(); };
      el('geo-pre-tri').onclick=function(){ warnMsg=''; picked=[{x:1,y:1},{x:4,y:1},{x:1,y:4}]; render(); };
    }
  }
  render();

  if(mode==='challenge'){
    var achievable=[2,3,4,4.5,6,8,9,10,12];
    function newTarget(){ target=achievable[rand(0,achievable.length-1)]; picked=[]; warnMsg=''; render(); }
    newTarget();
    var barObj = buildChallengeBar(stage, function(){ return 'Build a closed shape with an area of exactly '+target+' square units.'; },
      function(){ if(picked.length<3) return false; return Math.abs(shoelaceArea(picked)-target)<0.05; }, newTarget);

    el('chal-check').addEventListener('click',function(){
      if(picked.length<3){
        barObj.feedback.textContent='Tap at least 3 pegs to close a shape first!';
        return;
      }
      var curArea=shoelaceArea(picked);
      if(Math.abs(curArea-target)>=0.05){
        barObj.feedback.textContent='Your shape covers '+curArea+' square units, but the target is '+target+' square units. Adjust your pegs!';
      }
    });
  }
}

/* ══════════════ 7. PICNIC & ARRAY BUILDER (multiplication & division) ══════════════ */
function mountArray(stage, mode){
  var FRIENDS=[
    {name:'Leo',  avatar:'👦🏾'},
    {name:'Mia',  avatar:'👧🏾'},
    {name:'Sam',  avatar:'🧒🏾'},
    {name:'Zoe',  avatar:'👧🏽'},
    {name:'Tobi', avatar:'👦🏽'},
    {name:'Ama',  avatar:'👧🏿'},
    {name:'Kofi', avatar:'👦🏿'},
    {name:'Zara', avatar:'🧒🏽'}
  ];

  var theme='apple';
  var viewStyle='picnic';
  var storyOp='mult';
  var rows=3;
  var cols=2;
  var divTotal=11;
  var prevTotal=null;
  var highlightNew=false;

  var host=document.createElement('div');
  stage.appendChild(host);

  var variant='mult', targetA=null, targetB=null, targetRem=0, lockRows=false, lockCols=false;

  function stepAddFriend(){
    if(rows>=8) return;
    prevTotal=rows*cols;
    rows++;
    highlightNew=true;
    render();
  }

  function renderMultView(){
    var icon=objectIcon(theme);
    var total=rows*cols;
    var repeatParts=[];
    for(var r=0;r<rows;r++){ repeatParts.push(cols); }
    var repeatStr=repeatParts.join(' + ')+' = '+total;

    var visualHtml='';
    if(viewStyle==='picnic'){
      var runningCount=0;
      var cards='';
      for(var f=0;f<rows;f++){
        var isNew=highlightNew && f===rows-1;
        var cardCls='friend-card'+(highlightNew ? (isNew?' new-step':' prev-group') : '');
        var plateHtml='';
        for(var item=0;item<cols;item++){
          runningCount++;
          plateHtml+='<span class="plate-item">'+icon+'<span class="plate-num">'+runningCount+'</span></span>';
        }
        cards+='<div class="'+cardCls+'">'
          +'<div class="friend-avatar">'+FRIENDS[f].avatar+'</div>'
          +'<div class="friend-name">'+FRIENDS[f].name+'</div>'
          +'<div class="friend-plate">'+plateHtml+'</div>'
          +'</div>';
      }
      visualHtml='<div class="picnic-blanket">'+cards+'</div>';
    } else {
      var cells='';
      for(var gr=0;gr<rows;gr++){
        var rowHighlight=highlightNew && gr===rows-1;
        for(var gc=0;gc<cols;gc++){
          cells+='<div class="arr-icon-cell'+(rowHighlight?' new-row':'')+'">'+icon+'</div>';
        }
      }
      visualHtml='<div style="text-align:center"><div class="arr-grid" style="grid-template-columns:repeat('+cols+',28px)">'+cells+'</div></div>';
    }

    var isDivChallenge = (mode==='challenge' && (variant==='div' || variant==='div_rem'));
    var unshared = isDivChallenge ? Math.max(0, targetB - total) : 0;
    var remIcons='';
    for(var ri=0;ri<unshared;ri++){ remIcons+='<span style="font-size:22px">'+icon+'</span>'; }

    var divChallengeBasket = isDivChallenge
      ? '<div class="remainder-box" style="'+(unshared===0?'border-color:#22b573;background:#e6f9f0;color:#15803d':'')+'">'
        +'<span>Basket ('+unshared+' of '+targetB+' left):</span> '+remIcons
        +'</div>'
      : '';

    var calloutHtml=(!isDivChallenge && highlightNew && prevTotal!==null && rows>1)
      ? '<div class="step-callout">Step-by-step: Already had <strong>'+prevTotal+'</strong> + <strong>'+cols+'</strong> new = <strong>'+total+'</strong>!</div>'
      : '';

    var bridgeHtml = isDivChallenge
      ? '<div class="equation-bridge">'
        +'<div class="eq-words">Shared '+total+' out of '+targetB+' items among '+rows+' friends</div>'
        +'<div class="eq-mult">'+targetB+' &divide; '+rows+' &rarr; '+cols+' each, '+unshared+' in basket</div>'
        +'</div>'
      : '<div class="equation-bridge">'
        +'<div class="eq-words">'+rows+' '+(rows===1?'friend':'friends')+' &times; '+cols+' '+(cols===1?'item':'items')+' each</div>'
        +(rows>1 ? '<div class="eq-repeat">'+repeatStr+'</div>' : '')
        +'<div class="eq-mult">'+rows+' &times; '+cols+' = '+total+'</div>'
        +'</div>';

    var maxColsAllowed = isDivChallenge ? Math.floor(targetB / rows) : 8;

    return visualHtml
      +divChallengeBasket
      +calloutHtml
      +bridgeHtml
      +'<div class="ctrl-row">'
      +'<div class="ctrl-group"><div class="ctrl-label">'+(viewStyle==='picnic'?'Friends':'Rows')+'</div><div class="ctrl-btns">'
        +'<button class="step-btn minus" id="ar-r-minus" '+(lockRows?'disabled':'')+'>&minus;</button>'
        +'<button class="step-btn" id="ar-r-plus" '+(lockRows?'disabled':'')+'>+</button>'
      +'</div></div>'
      +'<div class="ctrl-group"><div class="ctrl-label">'+(viewStyle==='picnic'?'Items Each':'Columns')+'</div><div class="ctrl-btns">'
        +'<button class="step-btn minus" id="ar-c-minus" '+(lockCols||cols<=0?'disabled':'')+'>&minus;</button>'
        +'<button class="step-btn" id="ar-c-plus" '+(lockCols||cols>=maxColsAllowed?'disabled':'')+'>+</button>'
      +'</div></div>'
      +(!lockRows && mode==='explore'
        ? '<div class="ctrl-group"><div class="ctrl-label">See Next Step</div>'
          +'<button class="btn btn-primary" id="ar-step-friend" '+(rows>=8?'disabled':'')+'>+1 '+(viewStyle==='picnic'?'Friend':'Row')+' (+'+cols+')</button></div>'
        : '')
      +'</div>';
  }

  function renderDivView(){
    var icon=objectIcon(theme);
    var perFriend=Math.floor(divTotal/rows);
    var remainder=divTotal%rows;
    var running=0;
    var cards='';
    for(var f=0;f<rows;f++){
      var plateHtml='';
      for(var k=0;k<perFriend;k++){
        running++;
        plateHtml+='<span class="plate-item">'+icon+'<span class="plate-num">'+running+'</span></span>';
      }
      cards+='<div class="friend-card">'
        +'<div class="friend-avatar">'+FRIENDS[f].avatar+'</div>'
        +'<div class="friend-name">'+FRIENDS[f].name+' ('+perFriend+')</div>'
        +'<div class="friend-plate">'+plateHtml+'</div>'
        +'</div>';
    }
    var remIcons='';
    for(var r=0;r<remainder;r++){ remIcons+='<span style="font-size:22px">'+icon+'</span>'; }

    var remHtml=remainder>0
      ? '<div class="remainder-box"><span>Leftover Basket (Remainder):</span> '+remIcons+' <strong>('+remainder+' left over)</strong></div>'
      : '<div class="step-callout" style="border-color:#22b573;background:#e6f9f0;color:#15803d">Shared evenly! 0 left over.</div>';

    return '<div class="picnic-blanket">'+cards+'</div>'
      +remHtml
      +'<div class="equation-bridge">'
      +'<div class="eq-words">Share '+divTotal+' items equally among '+rows+' friends</div>'
      +'<div class="eq-mult">'+divTotal+' &divide; '+rows+' = '+perFriend+(remainder>0?' R '+remainder:'')+'</div>'
      +'<div class="eq-repeat">Check: ('+rows+' &times; '+perFriend+')'+(remainder>0?' + '+remainder:'')+' = '+divTotal+'</div>'
      +'</div>'
      +'<div class="ctrl-row">'
      +'<div class="ctrl-group"><div class="ctrl-label">Total Items</div><div class="ctrl-btns">'
        +'<button class="step-btn minus" id="dv-t-minus">&minus;</button>'
        +'<button class="step-btn" id="dv-t-plus">+</button>'
      +'</div></div>'
      +'<div class="ctrl-group"><div class="ctrl-label">Friends</div><div class="ctrl-btns">'
        +'<button class="step-btn minus" id="dv-f-minus">&minus;</button>'
        +'<button class="step-btn" id="dv-f-plus">+</button>'
      +'</div></div>'
      +'</div>';
  }

  function render(){
    var topControls='';
    if(mode==='explore'){
      topControls=objectThemePicker(theme)
        +'<div class="picnic-tabs">'
        +'<button class="picnic-tab'+(storyOp==='mult'?' on':'')+'" id="tab-mult">Multiply (Give Each)</button>'
        +'<button class="picnic-tab'+(storyOp==='div'?' on':'')+'" id="tab-div">Divide (Share &amp; Leftovers)</button>'
        +(storyOp==='mult'
          ? '<button class="picnic-tab'+(viewStyle==='picnic'?' on':'')+'" id="tab-picnic">🧺 Picnic Story</button>'
            +'<button class="picnic-tab'+(viewStyle==='grid'?' on':'')+'" id="tab-grid">▦ Array Grid</button>'
          : '')
        +'</div>';
    } else {
      topControls='<div class="picnic-tabs">'
        +'<button class="picnic-tab'+(viewStyle==='picnic'?' on':'')+'" id="tab-picnic">🧺 Picnic Story</button>'
        +'<button class="picnic-tab'+(viewStyle==='grid'?' on':'')+'" id="tab-grid">▦ Array Grid</button>'
        +'</div>';
    }

    host.innerHTML=topControls + (storyOp==='mult' ? renderMultView() : renderDivView());

    if(mode==='explore'){
      wireThemePicker(host,function(id){ theme=id; render(); });
      el('tab-mult').onclick=function(){ storyOp='mult'; highlightNew=false; render(); };
      el('tab-div').onclick=function(){ storyOp='div'; highlightNew=false; render(); };

    if(el('tab-grid')) el('tab-grid').onclick=function(){ viewStyle='grid'; render(); };

    if(storyOp==='mult'){
      var isDivChallenge = (mode==='challenge' && (variant==='div' || variant==='div_rem'));
      var minCols = isDivChallenge ? 0 : 1;
      var maxColsAllowed = isDivChallenge ? Math.floor(targetB / rows) : 8;

      if(!lockRows){
        el('ar-r-plus').onclick=function(){ prevTotal=rows*cols; rows=Math.min(8,rows+1); highlightNew=true; render(); };
        el('ar-r-minus').onclick=function(){ rows=Math.max(1,rows-1); highlightNew=false; prevTotal=null; render(); };
      }
      if(!lockCols){
        el('ar-c-plus').onclick=function(){ cols=Math.min(maxColsAllowed,cols+1); highlightNew=false; prevTotal=null; render(); };
        el('ar-c-minus').onclick=function(){ cols=Math.max(minCols,cols-1); highlightNew=false; prevTotal=null; render(); };
      }
      if(el('ar-step-friend')) el('ar-step-friend').onclick=stepAddFriend;
    } else {
      el('dv-t-plus').onclick=function(){ divTotal=Math.min(36,divTotal+1); render(); };
      el('dv-t-minus').onclick=function(){ divTotal=Math.max(1,divTotal-1); render(); };
      el('dv-f-plus').onclick=function(){ rows=Math.min(8,rows+1); render(); };
      el('dv-f-minus').onclick=function(){ rows=Math.max(1,rows-1); render(); };
    }
  }
  render();

  if(mode==='challenge'){
    storyOp='mult';
    viewStyle='picnic';
    function newTarget(){
      var pick=rand(1,3);
      variant = pick===1 ? 'mult' : (pick===2 ? 'div' : 'div_rem');
      highlightNew=false;
      prevTotal=null;
      if(variant==='mult'){
        targetA=rand(2,6); targetB=rand(2,6); targetRem=0;
        lockRows=false; lockCols=false;
        rows=1; cols=1;
      } else if(variant==='div'){
        var r=rand(2,6), c=rand(2,6);
        targetA=r; targetB=r*c; targetRem=0;
        lockRows=true; lockCols=false;
        rows=r; cols=0;
      } else {
        var rRem=rand(3,6), qRem=rand(1,5);
        targetRem=rand(1,rRem-1);
        targetA=rRem;
        targetB=(rRem*qRem)+targetRem;
        lockRows=true; lockCols=false;
        rows=rRem; cols=0;
      }
      render();
    }
    newTarget();
    buildChallengeBar(stage, function(){
      if(variant==='mult'){
        return 'Set up the picnic for '+targetA+' friends with '+targetB+' '+theme+'s each (or '+targetB+' friends with '+targetA+' each).';
      }
      if(variant==='div'){
        return 'Share '+targetB+' '+theme+'s equally among '+targetA+' friends so 0 remain in the basket.';
      }
      return 'Share '+targetB+' '+theme+'s equally among '+targetA+' friends. Give the maximum equal share and leave the remainder in the basket!';
    }, function(){
      if(variant==='mult'){
        return (rows===targetA && cols===targetB) || (rows===targetB && cols===targetA);
      }
      var expectedPerFriend=Math.floor(targetB/targetA);
      var actualRemainder=targetB-(rows*cols);
      return rows===targetA && cols===expectedPerFriend && actualRemainder===targetRem;
    }, newTarget);
  }
}

/* ══════════════ 8. UNIT CONVERTER ══════════════ */
var CONV_CATS={
  liquid:{ label:'Liquid (Capacity)', units:[
    {id:'ml',label:'millilitres (ml)',mult:1},
    {id:'l', label:'litres (l)',mult:1000}
  ]},
  solid:{ label:'Solid (Mass)', units:[
    {id:'mg',label:'milligrams (mg)',mult:1},
    {id:'g', label:'grams (g)',mult:1000},
    {id:'kg',label:'kilograms (kg)',mult:1000000}
  ]},
  time:{ label:'Time', units:[
    {id:'sec', label:'seconds',mult:1},
    {id:'min', label:'minutes',mult:60},
    {id:'hr',  label:'hours',mult:3600},
    {id:'day', label:'days',mult:86400},
    {id:'week',label:'weeks',mult:604800}
  ]},
  money:{ label:'Money', units:[
    {id:'kobo', label:'kobo',mult:1},
    {id:'naira',label:'naira (₦)',mult:100}
  ]},
  length:{ label:'Length', units:[
    {id:'mm',label:'millimetres (mm)',mult:1},
    {id:'cm',label:'centimetres (cm)',mult:10},
    {id:'m', label:'metres (m)',mult:1000},
    {id:'km',label:'kilometres (km)',mult:1000000}
  ]}
};
var CONV_CAT_ORDER=['liquid','solid','length','time','money'];

function convUnit(catId,unitId){
  var found=null;
  CONV_CATS[catId].units.forEach(function(u){ if(u.id===unitId) found=u; });
  return found;
}
function convValue(catId,fromId,toId,val){
  var f=convUnit(catId,fromId), t=convUnit(catId,toId);
  return val*f.mult/t.mult;
}
function roundClean(n){
  return Math.round(n*10000)/10000;
}

function genLiquidChallenge(){
  var toL=Math.random()<0.5;
  if(toL){ var ml=rand(1,500)*10; return {cat:'liquid',from:'ml',to:'l',value:ml,answer:roundClean(ml/1000)}; }
  var l=rand(10,500)/100; return {cat:'liquid',from:'l',to:'ml',value:l,answer:roundClean(l*1000)};
}
function genSolidChallenge(){
  var pair=Math.random()<0.5?['mg','g',1000]:['g','kg',1000];
  var small=pair[0], big=pair[1], ratio=pair[2];
  if(Math.random()<0.5){
    var vSmall=rand(1,500)*10;
    return {cat:'solid',from:small,to:big,value:vSmall,answer:roundClean(vSmall/ratio)};
  }
  var vBig=rand(10,500)/100;
  return {cat:'solid',from:big,to:small,value:vBig,answer:roundClean(vBig*ratio)};
}
function genLengthChallenge(){
  var pairs=[['mm','cm',10],['cm','m',100],['m','km',1000]];
  var p=pairs[rand(0,pairs.length-1)];
  var small=p[0], big=p[1], ratio=p[2];
  if(Math.random()<0.5){
    var vSmall=rand(1,500)*10;
    return {cat:'length',from:small,to:big,value:vSmall,answer:roundClean(vSmall/ratio)};
  }
  var vBig=rand(10,500)/100;
  return {cat:'length',from:big,to:small,value:vBig,answer:roundClean(vBig*ratio)};
}
function genMoneyChallenge(){
  if(Math.random()<0.5){
    var kobo=rand(1,2000);
    return {cat:'money',from:'kobo',to:'naira',value:kobo,answer:roundClean(kobo/100)};
  }
  var naira=rand(1,500)+ (rand(0,1)?0.5:0);
  return {cat:'money',from:'naira',to:'kobo',value:naira,answer:roundClean(naira*100)};
}
var TIME_GENERATORS=[
  function(){ var m=rand(1,20); return {from:'sec',to:'min',value:m*60,answer:m}; },
  function(){ var m=rand(1,20); return {from:'min',to:'sec',value:m,answer:m*60}; },
  function(){ var q=rand(1,16); var mins=q*15; return {from:'min',to:'hr',value:mins,answer:roundClean(mins/60)}; },
  function(){ var h=rand(1,6); return {from:'hr',to:'min',value:h,answer:h*60}; },
  function(){ var d=rand(1,5); var hrs=d*24; return {from:'hr',to:'day',value:hrs,answer:roundClean(hrs/24)}; },
  function(){ var d=rand(1,10); return {from:'day',to:'hr',value:d,answer:d*24}; },
  function(){ var w=rand(1,8); var days=w*7; return {from:'day',to:'week',value:days,answer:roundClean(days/7)}; },
  function(){ var w=rand(1,10); return {from:'week',to:'day',value:w,answer:w*7}; }
];
function genTimeChallenge(){
  var pick=TIME_GENERATORS[rand(0,TIME_GENERATORS.length-1)]();
  pick.cat='time';
  return pick;
}
var CONV_GENERATORS={ liquid:genLiquidChallenge, solid:genSolidChallenge, time:genTimeChallenge, money:genMoneyChallenge, length:genLengthChallenge };

function mountConvert(stage, mode){
  var host=document.createElement('div');
  stage.appendChild(host);
  var cat='liquid', fromU=CONV_CATS.liquid.units[0].id, toU=CONV_CATS.liquid.units[1].id, inputVal=1;
  var challenge=null;

  function unitOptions(catId,selectedId){
    return CONV_CATS[catId].units.map(function(u){
      return '<option value="'+u.id+'"'+(u.id===selectedId?' selected':'')+'>'+u.label+'</option>';
    }).join('');
  }

  var CONTAINER_CAPACITY={ liquid:5000, solid:5000000 };
  function containerVisualHtml(){
    if(cat!=='liquid' && cat!=='solid') return '';
    var baseUnit=CONV_CATS[cat].units[0].id;
    var capacityBase=CONTAINER_CAPACITY[cat];
    var valueInBase=convValue(cat,fromU,baseUnit,inputVal);
    var fillPct=Math.max(0,Math.min(100,(valueInBase/capacityBase)*100));
    var overflow=valueInBase>capacityBase;
    var ticks='';
    for(var i=1;i<=4;i++){ ticks+='<div class="conv-tick" style="bottom:'+(i*20)+'%"></div>'; }
    var capacityLabel=cat==='liquid' ? (capacityBase/1000)+' litres' : (capacityBase/1000000)+' kilograms';
    return '<div class="conv-container-wrap">'
      +'<div class="conv-overflow" id="conv-overflow">'+(overflow?'⚠ Overflowing the container!':'')+'</div>'
      +'<div class="conv-beaker"><div class="conv-fill '+cat+'" id="conv-fill" style="height:'+fillPct+'%"></div><div class="conv-ticks">'+ticks+'</div></div>'
      +'<div class="conv-capacity-note">Container capacity: '+capacityLabel+'</div>'
      +'</div>';
  }
  function updateContainerVisual(){
    if(cat!=='liquid' && cat!=='solid') return;
    var baseUnit=CONV_CATS[cat].units[0].id;
    var capacityBase=CONTAINER_CAPACITY[cat];
    var valueInBase=convValue(cat,fromU,baseUnit,inputVal);
    var fillPct=Math.max(0,Math.min(100,(valueInBase/capacityBase)*100));
    var fillEl=host.querySelector('#conv-fill');
    if(fillEl) fillEl.style.height=fillPct+'%';
    var overEl=host.querySelector('#conv-overflow');
    if(overEl) overEl.textContent=valueInBase>capacityBase?'⚠ Overflowing the container!':'';
  }

  function renderExplore(){
    var result=roundClean(convValue(cat,fromU,toU,inputVal));
    host.innerHTML='<div class="conv-cats">'
      +CONV_CAT_ORDER.map(function(c){
        return '<button class="conv-cat-btn'+(c===cat?' on':'')+'" data-cat="'+c+'">'+CONV_CATS[c].label+'</button>';
      }).join('')
      +'</div>'
      +'<div class="conv-row">'
      +'<div class="conv-field"><div class="ctrl-label">Value</div><input class="conv-input" type="number" id="conv-val" value="'+inputVal+'"></div>'
      +'<div class="conv-field"><div class="ctrl-label">From</div><select class="conv-select" id="conv-from">'+unitOptions(cat,fromU)+'</select></div>'
      +'<button class="conv-swap" id="conv-swap" title="Swap">&#8646;</button>'
      +'<div class="conv-field"><div class="ctrl-label">To</div><select class="conv-select" id="conv-to">'+unitOptions(cat,toU)+'</select></div>'
      +'<div class="conv-equals">=</div>'
      +'<div class="conv-result">'+result+'</div>'
      +'</div>'
      +containerVisualHtml();
    Array.prototype.forEach.call(host.querySelectorAll('.conv-cat-btn'),function(b){
      b.addEventListener('click',function(){
        cat=b.getAttribute('data-cat');
        fromU=CONV_CATS[cat].units[0].id;
        toU=CONV_CATS[cat].units[1] ? CONV_CATS[cat].units[1].id : CONV_CATS[cat].units[0].id;
        renderExplore();
      });
    });
    el('conv-val').addEventListener('input',function(){
      var v=parseFloat(el('conv-val').value);
      inputVal=isNaN(v)?0:v;
      var resEl=host.querySelector('.conv-result');
      if(resEl) resEl.textContent=roundClean(convValue(cat,fromU,toU,inputVal));
      updateContainerVisual();
    });
    el('conv-from').addEventListener('change',function(){ fromU=el('conv-from').value; renderExplore(); });
    el('conv-to').addEventListener('change',function(){ toU=el('conv-to').value; renderExplore(); });
    el('conv-swap').addEventListener('click',function(){ var t=fromU; fromU=toU; toU=t; renderExplore(); });
  }

  function unitLabel(catId,unitId){ return convUnit(catId,unitId).label; }

  function renderChallenge(){
    host.innerHTML='<div class="conv-row">'
      +'<div class="conv-field"><div class="ctrl-label">Your answer</div><input class="conv-input" type="number" id="conv-answer" placeholder="?"></div>'
      +'</div>';
    var inp=el('conv-answer');
    if(inp){
      inp.addEventListener('keydown',function(e){
        if(e.key==='Enter'){ var chk=el('chal-check'); if(chk) chk.click(); }
      });
    }
  }

  if(mode==='explore'){
    renderExplore();
  } else {
    function newChallenge(){
      var whichCat=CONV_CAT_ORDER[rand(0,CONV_CAT_ORDER.length-1)];
      challenge=CONV_GENERATORS[whichCat]();
      challenge.cat=challenge.cat||whichCat;
      renderChallenge();
    }
    newChallenge();
    buildChallengeBar(stage, function(){
      return 'Convert '+challenge.value+' '+unitLabel(challenge.cat,challenge.from)+' to '+unitLabel(challenge.cat,challenge.to)+'.';
    }, function(){
      var v=parseFloat(el('conv-answer').value);
      if(isNaN(v)) return false;
      return Math.abs(v-challenge.answer)<0.01;
    }, newChallenge);
  }
}

/* ══════════════ 9. ADDITION AND SUBTRACTION ══════════════ */
function mountAddSub(stage, mode){
  var theme='counter';
  var op='add';
  var isMerged=false;
  var countA=3, countB=2;
  var startCount=8, takeAway=3;
  var host=document.createElement('div');
  stage.appendChild(host);
  var target=null;

  function iconRow(count, removedFrom){
    var out='';
    for(var i=0;i<count;i++){
      out+='<span class="'+(removedFrom!=null && i>=removedFrom?'removed':'')+'">'+objectIcon(theme)+'</span>';
    }
    return out;
  }

  function pvBlocksHtml(total){
    var hundreds=Math.floor(total/100), tens=Math.floor((total%100)/10), ones=total%10;
    function row(kind,c){ var o=''; for(var i=0;i<c;i++) o+='<div class="pv-'+kind+'"></div>'; return o; }
    return '<div class="pv-cols">'
      +'<div class="pv-col"><div class="pv-col-label">Hundreds</div><div class="pv-blocks">'+row('hundred',hundreds)+'</div></div>'
      +'<div class="pv-col"><div class="pv-col-label">Tens</div><div class="pv-blocks">'+row('ten',tens)+'</div></div>'
      +'<div class="pv-col"><div class="pv-col-label">Ones</div><div class="pv-blocks">'+row('one',ones)+'</div></div>'
      +'</div>';
  }

  function currentTotal(){
    return op==='add' ? (countA+countB) : Math.max(0,startCount-takeAway);
  }

  function render(){
    var opControls = mode==='explore'
      ? '<div class="stat-row" style="margin-top:0;margin-bottom:14px">'
          +'<button class="btn '+(op==='add'?'btn-primary':'btn-ghost')+'" id="as-op-add">Add (+)</button>'
          +'<button class="btn '+(op==='sub'?'btn-primary':'btn-ghost')+'" id="as-op-sub">Subtract (&minus;)</button>'
        +'</div>'
      : '';

    var body='', eqText='';
    if(op==='add'){
      eqText = countA+' + '+countB+' = '+(countA+countB);
      var mergeBtnHtml = '<div class="stat-row" style="margin-top:12px">'
        +'<button class="btn '+(isMerged?'btn-ghost':'btn-primary')+'" id="as-merge-toggle">'
          +(isMerged ? '↔ Split Back into Two Groups' : '🤝 Combine Groups Together')
        +'</button>'
        +'</div>';

      if(isMerged){
        var mergedIcons='';
        for(var ia=0;ia<countA;ia++) mergedIcons+='<span class="from-a" title="From Group A">'+objectIcon(theme)+'</span>';
        for(var ib=0;ib<countB;ib++) mergedIcons+='<span class="from-b" title="From Group B">'+objectIcon(theme)+'</span>';
        body='<div class="as-merged-tray">'
          +'<div class="ctrl-label" style="color:#3355dd">Combined Group ('+countA+' Blue + '+countB+' Gold)</div>'
          +'<div class="as-merged-icons">'+(mergedIcons || '<span style="font-size:13px;color:#8896b3">0 items</span>')+'</div>'
          +'</div>'
          +mergeBtnHtml;
      } else {
        body='<div class="as-groups">'
          +'<div class="as-group"><div class="as-icons">'+iconRow(countA,null)+'</div>'
          +'<div class="ctrl-btns"><button class="step-btn minus" id="as-a-minus" '+(countA<=0?'disabled':'')+'>&minus;</button><button class="step-btn" id="as-a-plus" '+(countA>=20?'disabled':'')+'>+</button></div>'
          +'<div class="ctrl-label">Group A: '+countA+'</div></div>'
          +'<div class="as-op">+</div>'
          +'<div class="as-group"><div class="as-icons">'+iconRow(countB,null)+'</div>'
          +'<div class="ctrl-btns"><button class="step-btn minus" id="as-b-minus" '+(countB<=0?'disabled':'')+'>&minus;</button><button class="step-btn" id="as-b-plus" '+(countB>=20?'disabled':'')+'>+</button></div>'
          +'<div class="ctrl-label">Group B: '+countB+'</div></div>'
          +'</div>'
          +mergeBtnHtml;
      }
    } else {
      var rem=Math.max(0, startCount-takeAway);
      eqText = startCount+' &minus; '+takeAway+' = '+rem;
      body='<div class="as-groups">'
        +'<div class="as-group"><div class="as-icons">'+iconRow(startCount, rem)+'</div>'
        +'<div class="ctrl-btns"><button class="step-btn minus" id="as-start-minus" '+(startCount<=0?'disabled':'')+'>&minus;</button><button class="step-btn" id="as-start-plus" '+(startCount>=30?'disabled':'')+'>+</button></div>'
        +'<div class="ctrl-label">Start: '+startCount+'</div></div>'
        +'<div class="as-op">&minus;</div>'
        +'<div class="as-group">'
        +'<div style="min-height:40px;display:flex;align-items:center;font-family:var(--fd);font-weight:800;color:#e5484d;font-size:15px">'+takeAway+' faded out</div>'
        +'<div class="ctrl-btns"><button class="step-btn minus" id="as-take-minus" '+(takeAway<=0?'disabled':'')+'>&minus;</button><button class="step-btn" id="as-take-plus" '+(takeAway>=startCount?'disabled':'')+'>+</button></div>'
        +'<div class="ctrl-label">Take away: '+takeAway+'</div></div>'
        +'</div>';
    }

    host.innerHTML=(mode==='explore'?objectThemePicker(theme):'')
      +opControls
      +body
      +'<div class="as-eq-banner">'+eqText+'</div>'
      +'<div style="margin-top:16px">'+pvBlocksHtml(currentTotal())+'</div>'
      +'<div class="stat-row"><div class="stat-pill">'+(op==='add'?'Total':'Remaining')+': '+currentTotal()+'</div></div>';

    if(mode==='explore'){
      wireThemePicker(host,function(id){ theme=id; render(); });
      el('as-op-add').onclick=function(){ op='add'; isMerged=false; render(); };
      el('as-op-sub').onclick=function(){ op='sub'; isMerged=false; render(); };
    }
    if(op==='add'){
      el('as-merge-toggle').onclick=function(){ isMerged=!isMerged; render(); };
      if(!isMerged){
        el('as-a-plus').onclick=function(){ countA=Math.min(20,countA+1); render(); };
        el('as-a-minus').onclick=function(){ countA=Math.max(0,countA-1); render(); };
        el('as-b-plus').onclick=function(){ countB=Math.min(20,countB+1); render(); };
        el('as-b-minus').onclick=function(){ countB=Math.max(0,countB-1); render(); };
      }
    } else {
      el('as-start-plus').onclick=function(){ startCount=Math.min(30,startCount+1); if(takeAway>startCount) takeAway=startCount; render(); };
      el('as-start-minus').onclick=function(){ startCount=Math.max(0,startCount-1); if(takeAway>startCount) takeAway=startCount; render(); };
      el('as-take-plus').onclick=function(){ takeAway=Math.min(startCount,takeAway+1); render(); };
      el('as-take-minus').onclick=function(){ takeAway=Math.max(0,takeAway-1); render(); };
    }
  }
  render();

  if(mode==='challenge'){
    function newTarget(){
      op=Math.random()<0.5?'add':'sub';
      isMerged=false;
      if(op==='add'){
        countA=0; countB=0;
        target=rand(3,20);
      } else {
        startCount=rand(5,20);
        takeAway=0;
        target=startCount-rand(1,startCount-1);
      }
      render();
    }
    newTarget();
    buildChallengeBar(stage, function(){
      return op==='add'
        ? 'Using Group A and Group B, make a total of '+target+' (try Combine Groups to see them join!).'
        : 'Start with '+startCount+' and take away enough to leave exactly '+target+'.';
    }, function(){ return currentTotal()===target; }, newTarget);
  }
}

/* ══════════════ 10. COMPARE AND ORDER ══════════════ */
function mountCompare(stage, mode){
  var host=document.createElement('div');
  stage.appendChild(host);
  var numA=3, numB=7;

  function compareSymbol(a,b){ return a>b?'>':(a<b?'<':'='); }
  function escSym(s){ return s==='<' ? '&lt;' : (s==='>' ? '&gt;' : s); }
  function shuffle(arr){
    for(var i=arr.length-1;i>0;i--){
      var j=rand(0,i), t=arr[i]; arr[i]=arr[j]; arr[j]=t;
    }
    return arr;
  }

  function barHeights(a, b){
    var peak = Math.max(a, b, 10);
    var maxH = 185;
    return {
      hA: Math.max(26, Math.round((a / peak) * maxH)),
      hB: Math.max(26, Math.round((b / peak) * maxH))
    };

    var bh = barHeights(numA, numB);

      +'<div class="ctrl-label">Number B</div>'
      +'<div class="ctrl-btns">'
        +'<button class="step-btn minus" id="cmp-b-m10" style="font-size:13px">&minus;10</button>'
