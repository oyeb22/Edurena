<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" sizes="64x64" href="./assets/edurena_logo_64.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Word Ladder — Projector</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#050810;--panel:#0d1117;--bdr:#1a2035;--txt:#e8edf5;--muted:#5a6a8a;--acc:#00d4ff;--grn:#00ff88;--red:#ff3355;--yel:#ffcc00;--pur:#bf5fff;--f:'Plus Jakarta Sans',system-ui,sans-serif;--display:'Orbitron',monospace}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:var(--bg);color:var(--txt);font-family:var(--f);overflow:hidden}
.screen{display:none;position:fixed;inset:0;z-index:100}
.screen.on{display:flex;flex-direction:column;align-items:center;justify-content:center}
#s-fatal h2{color:var(--muted);font-family:var(--display);font-size:22px;margin-bottom:12px}
#s-fatal.err h2{color:var(--red)}
#s-fatal p{color:var(--muted);font-size:14px;line-height:1.8;max-width:420px;text-align:center}
.brand-title{font-family:var(--display);font-size:clamp(20px,5vw,34px);font-weight:900;letter-spacing:4px;background:linear-gradient(135deg,var(--acc),var(--pur));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:6px}
.brand-sub{color:var(--muted);font-size:12px;letter-spacing:2px;text-transform:uppercase;margin-bottom:30px;text-align:center}
.wait-code{font-family:var(--display);font-size:clamp(48px,11vw,110px);font-weight:900;letter-spacing:10px;color:var(--acc);text-shadow:0 0 40px rgba(0,212,255,.4)}
.wait-count{font-family:var(--display);font-size:clamp(32px,6vw,52px);font-weight:900;color:var(--grn);margin-top:18px;text-shadow:0 0 20px rgba(0,255,136,.4)}
.wait-lbl{font-size:12px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin:4px 0 20px}
.wait-chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:900px;margin:0 auto}
.wait-chip{padding:6px 14px;background:#0d1525;border:1px solid #1e2d4a;border-radius:20px;font-size:14px;font-weight:600;color:var(--acc)}
.wait-status{font-size:14px;color:var(--muted);letter-spacing:1px;margin-top:20px}

#s-board{align-items:stretch;justify-content:flex-start;background:var(--bg)}
.wlh-top{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;border-bottom:1px solid var(--bdr)}
.wlh-brand{font-family:var(--display);font-size:13px;font-weight:900;letter-spacing:3px;color:var(--acc)}
.wlh-code{font-family:var(--display);font-size:16px;font-weight:900;letter-spacing:4px;color:var(--txt)}
.wlh-end{padding:8px 16px;border-radius:8px;border:1px solid rgba(255,51,85,.5);background:rgba(255,51,85,.12);color:#ff6680;font-family:var(--display);font-size:11px;font-weight:700;letter-spacing:1px;cursor:pointer}
.wlh-body{flex:1;display:flex;min-height:0}
.wlh-main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;min-width:0}
.wlh-turn{font-family:var(--display);font-size:clamp(14px,2.4vw,20px);font-weight:700;letter-spacing:2px;margin-bottom:18px;text-align:center}
.wlh-turn.live{color:var(--grn)}
.wlh-tiles{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:18px}
.wlh-tile{width:clamp(44px,6vw,72px);height:clamp(52px,7vw,84px);display:flex;align-items:center;justify-content:center;background:var(--panel);border:2px solid var(--bdr);border-radius:12px;font-family:var(--display);font-size:clamp(22px,3.2vw,38px);font-weight:900;color:var(--acc)}
.wlh-def{max-width:560px;text-align:center;background:rgba(0,255,136,.06);border:1px solid rgba(0,255,136,.25);border-radius:12px;padding:14px 20px;min-height:60px}
.wlh-def-word{font-family:var(--display);font-weight:900;color:var(--grn);font-size:18px;letter-spacing:1px}
.wlh-def-text{font-size:14px;color:var(--txt);margin-top:4px;line-height:1.5}
.wlh-side{width:min(320px,34vw);border-left:1px solid var(--bdr);padding:16px;overflow-y:auto;scrollbar-width:none}
.wlh-side::-webkit-scrollbar{display:none}
.wlh-h{font-size:11px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;margin:4px 0 10px}
.wlh-score-row{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;background:var(--panel);border:1px solid var(--bdr);border-radius:8px;margin-bottom:6px;font-size:13px}
.wlh-score-row.lead{border-color:rgba(255,204,0,.5);background:rgba(255,204,0,.07)}
.wlh-score-row .sc{font-family:var(--display);color:var(--yel);font-weight:700}
.wlh-chain-item{padding:6px 0 6px 10px;border-left:2px solid var(--bdr);margin-bottom:8px;font-size:12px}
.wlh-chain-word{font-family:var(--display);font-weight:700;color:var(--acc)}
.wlh-chain-by{color:var(--muted);font-size:10px;margin-left:5px}
.wlh-chain-def{color:var(--muted);font-size:11px;margin-top:2px;line-height:1.4}

.oscreen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:200;background:rgba(5,8,16,.95);backdrop-filter:blur(10px)}
.oscreen.on{display:flex}
.pod-title{font-family:var(--display);font-size:clamp(28px,6vw,56px);font-weight:900;letter-spacing:6px;color:var(--yel);margin-bottom:28px;text-shadow:0 0 30px rgba(255,204,0,.4)}
.pod-list{width:min(420px,88vw)}
.end-close{margin-top:26px;padding:10px 22px;border-radius:8px;border:1px solid var(--bdr);background:#0d1525;color:var(--txt);cursor:pointer;font-family:var(--f)}
</style>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
</head>
<body>

<div class="screen on" id="s-fatal"><h2 id="fatal-title">LOADING&hellip;</h2><p id="fatal-msg">Please wait a moment.</p></div>

<div class="screen" id="s-wait">
  <div class="brand-title">WORD LADDER</div>
  <div class="brand-sub">Edurena &middot; Projector View</div>
  <div class="wait-code" id="w-code">------</div>
  <div class="wait-count" id="w-count">0</div>
  <div class="wait-lbl">players joined</div>
  <div class="wait-chips" id="w-chips"></div>
  <div class="wait-status" id="w-status">Waiting for a 2nd player to join&hellip;</div>
</div>

<div class="screen" id="s-board">
  <div class="wlh-top">
    <div class="wlh-brand">WORD LADDER</div>
    <div class="wlh-code" id="hud-code">------</div>
    <button class="wlh-end" id="endBtn">&#x23F9; End Game</button>
  </div>
  <div class="wlh-body">
    <div class="wlh-main">
      <div class="wlh-turn" id="wlh-turn">&hellip;</div>
      <div class="wlh-tiles" id="wlh-tiles"></div>
      <div class="wlh-def" id="wlh-def">
        <div class="wlh-def-word" id="wlh-def-word">&mdash;</div>
        <div class="wlh-def-text" id="wlh-def-text">Waiting for the first move&hellip;</div>
      </div>
    </div>
    <div class="wlh-side">
      <div class="wlh-h">Scoreboard</div>
      <div id="wlh-scores"></div>
      <div class="wlh-h">Word Chain</div>
      <div id="wlh-chain"></div>
    </div>
  </div>
</div>

<div class="oscreen" id="s-end">
  <div class="pod-title">GAME OVER</div>
  <div class="pod-list" id="pod-list"></div>
  <button class="end-close" onclick="window.close()">Close Projector</button>
</div>

<script>
(function () {
'use strict';
var P = new URLSearchParams(location.search);
var GAS_URL = (P.get('script') || '').trim();
var sessionId = (P.get('sessionId') || '').trim().toUpperCase();
function el(id) { return document.getElementById(id); }
function esc(s) { return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function overlay(id) { document.querySelectorAll('.oscreen').forEach(function (s) { s.classList.remove('on'); }); if (id) el(id).classList.add('on'); }
function showScreen(id) { document.querySelectorAll('.screen').forEach(function (s) { s.classList.remove('on'); }); var t = el(id); if (t) t.classList.add('on'); }
function fatal(msg) { showScreen('s-fatal'); el('s-fatal').classList.add('err'); el('fatal-title').textContent = 'CANNOT LOAD'; el('fatal-msg').textContent = msg; }
if (!sessionId) { fatal('No game code — open this from the "Open Projector" link in the live-game launcher.'); return; }

var db;
try {
  var cfgFb = { apiKey: 'AIzaSyCLfySFzCpbz3CBX1bjha5KxvA0MrJExIc', authDomain: 'kahoot-24063.firebaseapp.com', databaseURL: 'https://kahoot-24063-default-rtdb.firebaseio.com', projectId: 'kahoot-24063', storageBucket: 'kahoot-24063.firebasestorage.app', messagingSenderId: '962917873467', appId: '1:962917873467:web:a6b526aee30cd15c92291e' };
  var existing = null; if (firebase.apps) firebase.apps.forEach(function (a) { if (a.name === 'wl') existing = a; });
  db = firebase.database(existing || firebase.initializeApp(cfgFb, 'wl'));
} catch (e) { fatal('Firebase error: ' + e.message); return; }

var state = null, lastChainLen = 0;
el('w-code').textContent = sessionId;
el('hud-code').textContent = sessionId;

db.ref('wordladder/' + sessionId).on('value', function (s) {
  var v = s.val(); if (!v) return;
  state = v; render();
});

function render() {
  if (!state) return;
  if (state.status === 'ended') { renderEnd(); overlay('s-end'); showScreen('s-board'); return; }
  overlay(null);
  var players = state.players || [];
  if (players.length < 2) {
    showScreen('s-wait');
    el('w-count').textContent = players.length;
    el('w-chips').innerHTML = players.map(function (p) { return '<div class="wait-chip">' + esc(p.name) + '</div>'; }).join('');
    el('w-status').textContent = players.length === 0 ? 'Waiting for players to join…' : 'Waiting for a 2nd player to join…';
    return;
  }
  showScreen('s-board');

  var chain = state.chain || [];
  var current = chain[chain.length - 1];
  el('wlh-tiles').innerHTML = current.word.split('').map(function (ch) { return '<div class="wlh-tile">' + esc(ch) + '</div>'; }).join('');

  var turnPlayer = players[state.turnIndex];
  var tEl = el('wlh-turn');
  tEl.textContent = (turnPlayer ? turnPlayer.name : '…') + "'s turn to change a letter";
  tEl.className = 'wlh-turn live';

  if (chain.length > 1) {
    el('wlh-def-word').textContent = current.word;
    el('wlh-def-text').textContent = (current.playerName ? current.playerName + ' found: ' : '') + (current.definition || '');
  } else {
    el('wlh-def-word').textContent = current.word;
    el('wlh-def-text').textContent = current.definition || '';
  }

  var sorted = players.slice().sort(function (a, b) { return (b.score || 0) - (a.score || 0); });
  el('wlh-scores').innerHTML = sorted.map(function (p, i) {
    return '<div class="wlh-score-row' + (i === 0 && (p.score || 0) > 0 ? ' lead' : '') + '"><span>' + esc(p.name) + '</span><span class="sc">' + (p.score || 0) + '</span></div>';
  }).join('');

  var hist = chain.slice(1).slice().reverse();
  el('wlh-chain').innerHTML = hist.map(function (c) {
    return '<div class="wlh-chain-item"><span class="wlh-chain-word">' + esc(c.word) + '</span><span class="wlh-chain-by">by ' + esc(c.playerName || '?') + '</span><div class="wlh-chain-def">' + esc(c.definition || '') + '</div></div>';
  }).join('') || '<div style="color:var(--muted);font-size:11px">No words changed yet</div>';

  lastChainLen = chain.length;
}

function renderEnd() {
  var players = (state.players || []).slice().sort(function (a, b) { return (b.score || 0) - (a.score || 0); });
  el('pod-list').innerHTML = players.map(function (p, i) {
    return '<div class="wlh-score-row' + (i === 0 ? ' lead' : '') + '"><span>' + (i + 1) + '. ' + esc(p.name) + '</span><span class="sc">' + (p.score || 0) + '</span></div>';
  }).join('');
}

el('endBtn').addEventListener('click', function () {
  if (!confirm('End the game for all players?')) return;
  if (!GAS_URL) { fatal('Missing backend URL — cannot end the game from here.'); return; }
  fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'endWordLadderSession', sessionId: sessionId }) })
    .then(function (r) { return r.json(); })
    .catch(function () {});
});
})();
</script>
</body>
</html>
