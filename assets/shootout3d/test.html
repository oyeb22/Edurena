<!doctype html>
<html><head><meta charset="utf-8"><title>Penalty 3D test</title>
<style>html,body{margin:0;background:#111;color:#eee;font:14px sans-serif}
#stage{width:100vw;height:80vh;background:#000}#unity{width:100%;height:100%}
#log{padding:8px;white-space:pre-wrap;font:12px monospace}</style>
</head><body>
<div id="stage"><canvas id="unity"></canvas></div>
<button onclick="go('goal')">goal</button>
<button onclick="go('save')">save</button>
<button onclick="go('miss')">miss</button>
<div id="log"></div>
<script src="./shootoutCommon.js"></script>
<script>
var n = 0;
function log(s){ document.getElementById('log').textContent += s + '\n'; console.log(s); }
window.SHOOT3D.loadUnity({ canvas: document.getElementById('unity'), buildUrl:'./Build', productName:'PenaltyGame',
  onProgress:function(p){ log('progress ' + Math.round(p*100) + '%'); },
  onKickStart:function(o){ log('KICKSTART ' + JSON.stringify(o)); },
  onKickDone:function(o){ log('KICKDONE ' + JSON.stringify(o)); }
}).then(function(h){
  log('READY');
  window.view = h;
  window.go = function(outcome){
    n++;
    h.queueKick({ id:'t'+n, outcome:outcome, seed:n*7+1, kickerName:'Ada', keeperName:'Tunde', roundLabel:'Test '+n });
  };
  h.setStandings([{name:'Ada',goals:2,saves:0},{name:'Tunde',goals:0,saves:1}]);
  var params = new URLSearchParams(location.search);
  if (params.get('auto')) {
    ['goal','save','miss'].forEach(function(o,i){ setTimeout(function(){ go(o); }, i*4000+500); });
  }
}).catch(function(e){ log('ERROR ' + (e && (e.stack||e.message) || e)); });
</script>
</body></html>
