<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260">
  <rect x="4" y="4" width="392" height="252" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <!-- horizontal ray -->
  <line x1="40" y1="130" x2="340" y2="130" stroke="#0f172a" stroke-width="2.5"/>
  <polygon points="340,130 328,124 328,136" fill="#0f172a"/>

  <!-- diagonal transversal crossing it -->
  <line x1="120" y1="40" x2="290" y2="220" stroke="#0f172a" stroke-width="2.5"/>

  <!-- angle labels at intersection (~205,130) -->
  <text x="235" y="105" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#0f172a" text-anchor="middle">50°</text>
  <text x="165" y="165" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#2563eb" text-anchor="middle">x°</text>
</svg>
