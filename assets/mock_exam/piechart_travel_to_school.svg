  <!-- Cars 80deg -->
  <path d="M200,130 L122.1,175 A90,90 0 0,1 142.1,61.1 Z" fill="#fde68a" stroke="#0f172a" stroke-width="1.5"/>
  <!-- Okada 40deg -->
  <path d="M200,130 L142.1,61.1 A90,90 0 0,1 200,40 Z" fill="#fca5a5" stroke="#0f172a" stroke-width="1.5"/>

  <text x="246" y="118" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">Walking</text>
  <text x="246" y="133" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">150°</text>

  <text x="184" y="193" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">Bus</text>
  <text x="184" y="208" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">90°</text>

  <text x="141" y="125" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">Cars</text>
  <text x="141" y="140" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">80°</text>

  <text x="179" y="78" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">Okada</text>
  <text x="179" y="93" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">40°</text>
