<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260">
  <rect x="4" y="4" width="392" height="252" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <!-- full circle, shaded -->
  <circle cx="170" cy="130" r="95" fill="#475569" stroke="#0f172a" stroke-width="2"/>
  <!-- unshaded quarter (top to right, 90 degree wedge) -->
  <path d="M170,130 L170,35 A95,95 0 0,1 265,130 Z" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <!-- right-angle mark at the centre showing the removed quarter is 90 degrees -->
  <path d="M170,110 L190,110 L190,130" fill="none" stroke="#0f172a" stroke-width="1.5"/>

  <text x="170" y="245" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">diameter = 28cm</text>
</svg>
