<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260">
  <rect x="4" y="4" width="392" height="252" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <!-- three rays from a central point -->
  <line x1="200" y1="150" x2="200" y2="40" stroke="#0f172a" stroke-width="2.5"/>
  <line x1="200" y1="150" x2="310" y2="90" stroke="#0f172a" stroke-width="2.5"/>
  <line x1="200" y1="150" x2="110" y2="110" stroke="#0f172a" stroke-width="2.5"/>

  <text x="235" y="80" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">50°</text>
  <text x="235" y="130" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">70°</text>
  <text x="150" y="210" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#2563eb" text-anchor="middle">y°</text>
</svg>
