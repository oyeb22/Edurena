<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260">
  <rect x="4" y="4" width="392" height="252" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <!-- axes -->
  <line x1="35" y1="15" x2="35" y2="210" stroke="#0f172a" stroke-width="2.5"/>
  <line x1="35" y1="210" x2="355" y2="210" stroke="#0f172a" stroke-width="2.5"/>

  <!-- y ticks: 100,200,300,400,500,600 -->
  <line x1="30" y1="178" x2="35" y2="178" stroke="#0f172a" stroke-width="2"/>
  <text x="28" y="182" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#0f172a" text-anchor="end">100</text>
  <line x1="30" y1="147" x2="35" y2="147" stroke="#0f172a" stroke-width="2"/>
  <text x="28" y="151" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#0f172a" text-anchor="end">200</text>
  <line x1="30" y1="115" x2="35" y2="115" stroke="#0f172a" stroke-width="2"/>
  <text x="28" y="119" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#0f172a" text-anchor="end">300</text>
  <line x1="30" y1="83" x2="35" y2="83" stroke="#0f172a" stroke-width="2"/>
  <text x="28" y="87" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#0f172a" text-anchor="end">400</text>
  <line x1="30" y1="52" x2="35" y2="52" stroke="#0f172a" stroke-width="2"/>
  <text x="28" y="56" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#0f172a" text-anchor="end">500</text>
  <line x1="30" y1="20" x2="35" y2="20" stroke="#0f172a" stroke-width="2"/>
  <text x="28" y="24" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#0f172a" text-anchor="end">600</text>

  <!-- bars: 2016=320, 2017=480, 2018=560, 2019=240 -->
  <rect x="55" y="109" width="50" height="101" fill="#93c5fd" stroke="#0f172a" stroke-width="2"/>
  <rect x="135" y="58" width="50" height="152" fill="#93c5fd" stroke="#0f172a" stroke-width="2"/>
  <rect x="215" y="33" width="50" height="177" fill="#93c5fd" stroke="#0f172a" stroke-width="2"/>
  <rect x="295" y="134" width="50" height="76" fill="#93c5fd" stroke="#0f172a" stroke-width="2"/>

  <text x="80" y="225" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">2016</text>
  <text x="160" y="225" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">2017</text>
  <text x="240" y="225" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">2018</text>
  <text x="320" y="225" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">2019</text>

  <text x="200" y="245" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">PRODUCTION (TONNES) BY YEAR — Fig. 3</text>
</svg>
