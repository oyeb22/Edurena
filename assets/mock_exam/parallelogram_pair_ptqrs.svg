<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260">
  <rect x="4" y="4" width="392" height="252" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <!-- P(50,60) T(170,60) S(290,60) top; Q(90,190) R(250,190) bottom -->
  <polygon points="50,60 170,60 290,60 250,190 90,190" fill="none" stroke="#0f172a" stroke-width="2.5"/>
  <line x1="170" y1="60" x2="90" y2="190" stroke="#0f172a" stroke-width="2.2"/>
  <line x1="170" y1="60" x2="250" y2="190" stroke="#0f172a" stroke-width="2.2"/>

  <text x="35" y="55" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#0f172a">P</text>
  <text x="165" y="48" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#0f172a">T</text>
  <text x="298" y="55" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#0f172a">S</text>
  <text x="68" y="208" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Q</text>
  <text x="256" y="208" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#0f172a">R</text>

  <text x="95" y="130" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#2563eb" text-anchor="middle">4cm</text>
  <text x="225" y="130" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#2563eb" text-anchor="middle">5cm</text>
  <text x="170" y="215" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">4cm</text>
</svg>
