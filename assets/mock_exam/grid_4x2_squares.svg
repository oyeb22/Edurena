<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260">
  <rect x="4" y="4" width="392" height="252" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <!-- 4 columns x 2 rows grid, each cell 3 units (not to scale, unit size irrelevant to the count) -->
  <g stroke="#0f172a" stroke-width="2" fill="none">
    <rect x="60" y="60" width="280" height="140"/>
    <line x1="130" y1="60" x2="130" y2="200"/>
    <line x1="200" y1="60" x2="200" y2="200"/>
    <line x1="270" y1="60" x2="270" y2="200"/>
    <line x1="60" y1="130" x2="340" y2="130"/>
  </g>

  <text x="95" y="222" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">3</text>
  <text x="165" y="222" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">3</text>
  <text x="235" y="222" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">3</text>
  <text x="305" y="222" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">3</text>
  <text x="45" y="99" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#0f172a" text-anchor="end">3</text>
  <text x="45" y="169" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#0f172a" text-anchor="end">3</text>
</svg>
