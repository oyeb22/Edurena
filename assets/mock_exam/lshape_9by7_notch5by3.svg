<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260">
  <rect x="4" y="4" width="392" height="252" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <!-- L-shape: outer 9cm x 7cm with a 5cm x 3cm notch removed from the top-right corner -->
  <!-- scale: 1cm = 22px. outer width 9cm=198px, height 7cm=154px -->
  <polygon points="90,40 288,40 288,96 200,96 200,194 90,194"
           fill="none" stroke="#0f172a" stroke-width="2.5"/>

  <text x="189" y="28" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">9cm</text>
  <text x="72" y="117" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">7cm</text>
  <text x="244" y="84" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#2563eb" text-anchor="middle">5cm</text>
  <text x="222" y="150" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#2563eb" text-anchor="middle">3cm</text>
</svg>
