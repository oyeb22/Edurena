<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260">
  <rect x="4" y="4" width="392" height="252" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <!-- horizontal base and vertical ray, with right-angle mark -->
  <line x1="60" y1="210" x2="330" y2="210" stroke="#0f172a" stroke-width="2.5"/>
  <line x1="300" y1="210" x2="300" y2="50" stroke="#0f172a" stroke-width="2.5"/>
  <rect x="280" y="190" width="20" height="20" fill="none" stroke="#0f172a" stroke-width="1.5"/>
  <!-- slanted ray splitting the right angle into 35 and x -->
  <line x1="140" y1="210" x2="300" y2="90" stroke="#0f172a" stroke-width="2.5"/>

  <text x="195" y="195" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">35°</text>
  <text x="285" y="140" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#2563eb" text-anchor="end">x</text>
</svg>
