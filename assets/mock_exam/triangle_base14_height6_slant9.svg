<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260">
  <rect x="4" y="4" width="392" height="252" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <!-- triangle: apex top, base at bottom -->
  <polygon points="220,40 60,210 340,210" fill="none" stroke="#0f172a" stroke-width="2.5"/>
  <!-- internal altitude from apex to base, right-angle marked -->
  <line x1="220" y1="40" x2="220" y2="210" stroke="#0f172a" stroke-width="2"/>
  <rect x="220" y="196" width="14" height="14" fill="none" stroke="#0f172a" stroke-width="1.5"/>

  <text x="140" y="118" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">9cm</text>
  <text x="246" y="118" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">6cm</text>
  <text x="200" y="236" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">14cm</text>
</svg>
