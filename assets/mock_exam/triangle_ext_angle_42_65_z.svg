<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260">
  <rect x="4" y="4" width="392" height="252" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <polygon points="200,40 90,210 300,210" fill="none" stroke="#0f172a" stroke-width="2.5"/>
  <!-- extend base beyond the left vertex to show the exterior angle z -->
  <line x1="40" y1="210" x2="90" y2="210" stroke="#0f172a" stroke-width="2.5"/>

  <text x="200" y="70" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">42°</text>
  <text x="260" y="195" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">65°</text>
  <text x="65" y="195" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#2563eb" text-anchor="middle">z°</text>
</svg>
