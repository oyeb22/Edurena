<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260">
  <rect x="4" y="4" width="392" height="252" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <!-- axes -->
  <line x1="60" y1="30" x2="60" y2="210" stroke="#0f172a" stroke-width="2"/>
  <line x1="60" y1="210" x2="390" y2="210" stroke="#0f172a" stroke-width="2"/>

  <!-- horizontal gridlines + y labels (marks: 0,10,20,30,40) -->
  <line x1="60" y1="165" x2="390" y2="165" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="60" y1="120" x2="390" y2="120" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="60" y1="75"  x2="390" y2="75"  stroke="#cbd5e1" stroke-width="1"/>
  <text x="50" y="214" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#0f172a" text-anchor="end">0</text>
  <text x="50" y="169" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#0f172a" text-anchor="end">10</text>
  <text x="50" y="124" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#0f172a" text-anchor="end">20</text>
  <text x="50" y="79"  font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#0f172a" text-anchor="end">30</text>
  <text x="50" y="34"  font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#0f172a" text-anchor="end">40</text>
  <text x="18" y="124" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Marks</text>

  <!-- vertical gridlines + x labels (0,20,40,60,80,100 %) -->
  <line x1="126" y1="30" x2="126" y2="210" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="192" y1="30" x2="192" y2="210" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="258" y1="30" x2="258" y2="210" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="324" y1="30" x2="324" y2="210" stroke="#cbd5e1" stroke-width="1"/>
  <text x="60"  y="226" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">0%</text>
  <text x="126" y="226" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">20%</text>
  <text x="192" y="226" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">40%</text>
  <text x="258" y="226" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">60%</text>
  <text x="324" y="226" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">80%</text>
  <text x="390" y="226" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">100%</text>
  <text x="225" y="245" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Percentage</text>

  <!-- conversion line: marks = (percentage/100) x 40, from (0,0) to (100%,40) -->
  <line x1="60" y1="210" x2="390" y2="30" stroke="#2563eb" stroke-width="2.5"/>
</svg>
