<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260">
  <rect x="4" y="4" width="392" height="252" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <!-- main number line -->
  <line x1="50" y1="150" x2="350" y2="150" stroke="#0f172a" stroke-width="2.5"/>

  <!-- tick marks: 8 equal segments between 6 and 7, every tick at 50 + k*37.5 -->
  <!-- k=0 (6) -->
  <line x1="50" y1="130" x2="50" y2="170" stroke="#0f172a" stroke-width="2.5"/>
  <!-- k=1 -->
  <line x1="87.5" y1="140" x2="87.5" y2="160" stroke="#0f172a" stroke-width="2"/>
  <!-- k=2 -->
  <line x1="125" y1="140" x2="125" y2="160" stroke="#0f172a" stroke-width="2"/>
  <!-- k=3 -->
  <line x1="162.5" y1="140" x2="162.5" y2="160" stroke="#0f172a" stroke-width="2"/>
  <!-- k=4 (6.5, taller midpoint tick) -->
  <line x1="200" y1="130" x2="200" y2="170" stroke="#0f172a" stroke-width="2.5"/>
  <!-- k=5 -->
  <line x1="237.5" y1="140" x2="237.5" y2="160" stroke="#0f172a" stroke-width="2"/>
  <!-- k=6 -->
  <line x1="275" y1="140" x2="275" y2="160" stroke="#0f172a" stroke-width="2"/>
  <!-- k=7 -->
  <line x1="312.5" y1="140" x2="312.5" y2="160" stroke="#0f172a" stroke-width="2"/>
  <!-- k=8 (7) -->
  <line x1="350" y1="130" x2="350" y2="170" stroke="#0f172a" stroke-width="2.5"/>

  <text x="50" y="195" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">6</text>
  <text x="350" y="195" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">7</text>

  <!-- arrow pointing up to A, at k=5 => 6 + 5/8 -->
  <line x1="237.5" y1="210" x2="237.5" y2="172" stroke="#2563eb" stroke-width="2.5"/>
  <polygon points="237.5,166 232,178 243,178" fill="#2563eb"/>
  <text x="237.5" y="230" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#2563eb" text-anchor="middle">A</text>
</svg>
